idth="1.5"/><circle cx="248" cy="346" r="11" fill="#e4f1f3"/><text x="248" y="351" font-size="14" fill="#087f8c" font-weight="650" text-anchor="middle">5</text><text x="334.5" y="366" font-size="21" fill="#087f8c" font-weight="650" text-anchor="middle">accepted</text><text x="334.5" y="393" font-size="16" fill="#526a75" font-weight="400" text-anchor="middle">API inbound 末尾</text><rect x="229" y="326" width="211" height="86" rx="8" fill="none" stroke="#de343b" stroke-width="3"/><rect x="577" y="329" width="205" height="80" rx="7" fill="#ffffff" stroke="#b6cdd4" stroke-width="1.5"/><circle cx="593" cy="346" r="11" fill="#e4f1f3"/><text x="593" y="351" font-size="14" fill="#087f8c" font-weight="650" text-anchor="middle">6</text><text x="679.5" y="366" font-size="21" fill="#087f8c" font-weight="650" text-anchor="middle">文書の形式検査</text><text x="679.5" y="393" font-size="16" fill="#526a75" font-weight="400" text-anchor="middle">Operation固有ガード</text><rect x="922" y="329" width="205" height="80" rx="7" fill="#ffffff" stroke="#b6cdd4" stroke-width="1.5"/><circle cx="938" cy="346" r="11" fill="#e4f1f3"/><text x="938" y="351" font-size="14" fill="#087f8c" font-weight="650" text-anchor="middle">7</text><text x="1024.5" y="366" font-size="21" fill="#087f8c" font-weight="650" text-anchor="middle">業務呼出</text><text x="1024.5" y="393" font-size="16" fill="#526a75" font-weight="400" text-anchor="middle">下流の解析処理へ</text><text x="231" y="444" font-size="19" fill="#20323e" font-weight="600" text-anchor="start">番号順に、記録が残る位置と最終応答を照合する。</text><text x="231" y="468" font-size="16" fill="#647984" font-weight="400" text-anchor="start">矢印はポリシーの処理順。ネットワークの通信経路を表すものではない。</text></g></svg>
