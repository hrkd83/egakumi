o Sans,Yu Gothic,Meiryo,sans-serif" font-size="17" font-weight="500" fill="#20323e" text-anchor="start">暗号化された本文は読めない</text><text x="539" y="353" font-family="Hiragino Sans,Yu Gothic,Meiryo,sans-serif" font-size="15" font-weight="500" fill="#647984" text-anchor="middle">HTTPS / TCP 443</text><rect x="214" y="365" width="972" height="102" rx="6" fill="#fff" stroke="#d2e0e5"/><text x="233" y="391" font-family="Hiragino Sans,Yu Gothic,Meiryo,sans-serif" font-size="21" font-weight="650" fill="#20323e" text-anchor="start">APIM → Foundry のPE</text><rect x="233" y="404" width="158" height="43" rx="6" fill="#edf7f7" stroke="#b6d6d6"/><text x="312" y="432.5" font-family="Hiragino Sans,Yu Gothic,Meiryo,sans-serif" font-size="21" font-weight="600" fill="#087f8c" text-anchor="middle">APIM</text><path d="M391 425 L432 425" fill="none" stroke="#087f8c" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="435" y="404" width="158" height="43" rx="6" fill="#edf7f7" stroke="#b6d6d6"/><text x="514" y="432.5" font-family="Hiragino Sans,Yu Gothic,Meiryo,sans-serif" font-size="21" font-weight="600" fill="#087f8c" text-anchor="middle">PE</text><path d="M593 425 L634 425" fill="none" stroke="#087f8c" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="637" y="404" width="174" height="43" rx="6" fill="#edf7f7" stroke="#b6d6d6"/><text x="724" y="432.5" font-family="Hiragino Sans,Yu Gothic,Meiryo,sans-serif" font-size="21" font-weight="600" fill="#087f8c" text-anchor="middle">Foundry</text><text x="832" y="417" font-family="Hiragino Sans,Yu Gothic,Meiryo,sans-serif" font-size="20" font-weight="650" fill="#bc3741" text-anchor="start">Firewallを通らない</text><text x="832" y="444" font-family="Hiragino Sans,Yu Gothic,Meiryo,sans-serif" font-size="17" font-weight="500" fill="#20323e" text-anchor="start">このFWのIDPSは作用しない</text><text x="539" y="462" font-family="Hiragino Sans,Yu Gothic,Meiryo,sans-serif" font-size="15" font-weight="500" fill="#647984" text-anchor="middle">PEへの直接経路</text></svg>