<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1207 511"><rect x="0" y="0" width="1207" height="511" rx="9" fill="#f5f7f9" stroke="#75949f" stroke-width="1"/><rect x="0" y="0" width="1207" height="39" rx="0" fill="#183844" stroke="#183844" stroke-width="1"/><text x="19" y="26" fill="#e0f4f2" font-size="18" font-weight="650" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">APIM / 利用制限と下流認証</text><text x="1186" y="26" fill="#b8d8dc" font-size="15" font-weight="500" text-anchor="end" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">egakumi STUDY / 設定ビュー</text><text x="20" y="64" fill="#52727d" font-size="14" font-weight="500" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">教材用ポリシー設定 / 回数制限</text><text x="20" y="100" fill="#20323e" font-size="26" font-weight="650" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">要求を数えるタイミング</text><text x="21" y="123" fill="#647984" font-size="14" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">設定と処理の位置関係を確認する</text><path d="M0 135H1207" stroke="#cfdde1"/><rect x="0" y="136" width="192" height="346" rx="0" fill="#eaf0f3" stroke="#d5e0e5" stroke-width="1"/><text x="18" y="161" fill="#647984" font-size="13" font-weight="600" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">確認する設定</text><rect x="9" y="169" width="173" height="32" rx="5" fill="#d4e9e9" stroke="#c1dddd" stroke-width="1"/><rect x="9" y="169" width="3" height="32" rx="0" fill="#087f8c" stroke="#087f8c" stroke-width="1"/><text x="23" y="192" fill="#086975" font-size="16" font-weight="600" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">回数制限</text><text x="23" y="227" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">下流認証</text><rect x="0" y="483" width="1207" height="28" rx="0" fill="#e8eff2" stroke="#d1dfe4" stroke-width="1"/><text x="18" y="502" fill="#5a737d" font-size="14" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">公開設定例・リポジトリ定義に基づく教材用の補助図</text><rect x="214" y="147" width="972" height="328" rx="8" fill="#f6fafb" stroke="#c5d8df" stroke-width="1.4"/><text x="235" y="178" font-family="Hiragino Sans,Yu Gothic,Meiryo,sans-serif" font-size="20" font-weight="650" fill="#17496b">通常REST：共通検査 → 利用枠 → 下流認証準備 → 固有検査</text><rect x="234" y="204" width="165" height="88" rx="8" fill="#fff" stroke="#c5d8df" stroke-width="1.4"/><text x="246" y="237" font-family="Hiragino Sans,Yu Gothic,Meiryo,sans-serif" font-size="18" font-weight="650" fill="#086975">共通入力検査</text><text x="246" y="268" font-family="Hiragino Sans,Yu Gothic,Meiryo,sans-serif" font-size="16" font-weight="500" fill="#52727d">model / profile</text><path d="M399 250H419" fill="none" stroke="#288a94" stroke-width="2.5"/><path d="m411 245 8 5-8 5" fill="none" stroke="#288a94" stroke-width="2.5"/><rect x="422" y="204" width="165" height="88" rx="8" fill="#fff" stroke="#c5d8df" stroke-width="1.4"/><text x="434" y="237" font-family="Hiragino Sans,Yu Gothic,Meiryo,sans-serif" font-size="18" font-weight="650" fill="#086975">利用枠の取得</text><text x="434" y="268" font-family="Hiragino Sans,Yu Gothic,Meiryo,sans-serif" font-size="16" font-weight="500" fill="#52727d">取得／キャッシュ</text><path d="M587 250H607" fill="none" stroke="#288a94" stroke-width="2.5"/><path d="m599 245 8 5-8 5" fill="none" stroke="#288a94" stroke-width="2.5"/><rect x="610" y="204" width="165" height="88" rx="8" fill="#e7f4f4" stroke="#c5d8df" stroke-width="1.4"/><text x="622" y="237" font-family="Hiragino Sans,Yu Gothic,Meiryo,sans-serif" font-size="18" font-weight="650" fill="#086975">回数を計数</text><text x="622" y="268" font-family="Hiragino Sans,Yu Gothic,Meiryo,sans-serif" font-size="16" font-weight="500" fill="#52727d">inboundで1回</text><path d="M775 250H795" fill="none" stroke="#288a94" stroke-width="2.5"/><path d="m787 245 8 5-8 5" fill="none" stroke="#288a94" stroke-width="2.5"/><rect x="798" y="204" width="165" height="88" rx="8" fill="#fff" stroke="#c5d8df" stroke-width="1.4"/><text x="810" y="237" font-family="Hiragino Sans,Yu Gothic,Meiryo,sans-serif" font-size="18" font-weight="650" fill="#086975">下流認証準備</text><text x="810" y="268" font-family="Hiragino Sans,Yu Gothic,Meiryo,sans-serif" font-size="16" font-weight="500" fill="#52727d">入口値を除去</text><path d="M963 250H983" fill="none" stroke="#288a94" stroke-width="2.5"/><path d="m975 245 8 5-8 5" fill="none" stroke="#288a94" stroke-width="2.5"/><rect x="986" y="204" width="165" height="88" rx="8" fill="#fff" stroke="#c5d8df" stroke-width="1.4"/><text x="998" y="237" font-family="Hiragino Sans,Yu Gothic,Meiryo,sans-serif" font-size="18" font-weight="650" fill="#086975">固有検査</text><text x="998" y="268" font-family="Hiragino Sans,Yu Gothic,Meiryo,sans-serif" font-size="16" font-weight="500" fill="#52727d">PII・文書 等</text><rect x="234" y="317" width="917" height="132" rx="8" fill="#fff" stroke="#c5d8df" stroke-width="1.4"/><text x="252" y="347" font-family="Hiragino Sans,Yu Gothic,Meiryo,sans-serif" font-size="19" font-weight="500" fill="#183844">計数前の拒否：未知model / profile、共通サイズ検査</text><text x="252" y="383" font-family="Hiragino Sans,Yu Gothic,Meiryo,sans-serif" font-size="19" font-weight="500" fill="#183844">計数後の拒否：PII・文書等の固有検査で起きる場合がある</text><text x="252" y="425" font-family="Hiragino Sans,Yu Gothic,Meiryo,sans-serif" font-size="18" font-weight="500" fill="#52727d">回数は「成功回数」ではない。固有検査の後に業務呼出しへ進む。</text></svg>
