<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1207 511"><rect x="0" y="0" width="1207" height="511" rx="9" fill="#f5f7f9" stroke="#75949f" stroke-width="1"/><rect x="0" y="0" width="1207" height="39" rx="0" fill="#183844" stroke="#183844" stroke-width="1"/><text x="19" y="26" fill="#e0f4f2" font-size="18" font-weight="650" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">APIM / 利用制限と下流認証</text><text x="1186" y="26" fill="#b8d8dc" font-size="15" font-weight="500" text-anchor="end" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">egakumi STUDY / 設定ビュー</text><text x="20" y="64" fill="#52727d" font-size="14" font-weight="500" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">教材用ポリシー設定 / 下流認証</text><text x="20" y="100" fill="#20323e" font-size="26" font-weight="650" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">入口から下流で資格情報を切り替える</text><text x="21" y="123" fill="#647984" font-size="14" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">設定と処理の位置関係を確認する</text><path d="M0 135H1207" stroke="#cfdde1"/><rect x="0" y="136" width="192" height="346" rx="0" fill="#eaf0f3" stroke="#d5e0e5" stroke-width="1"/><text x="18" y="161" fill="#647984" font-size="13" font-weight="600" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">確認する設定</text><text x="23" y="192" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">回数制限</text><rect x="9" y="204" width="173" height="32" rx="5" fill="#d4e9e9" stroke="#c1dddd" stroke-width="1"/><rect x="9" y="204" width="3" height="32" rx="0" fill="#087f8c" stroke="#087f8c" stroke-width="1"/><text x="23" y="227" fill="#086975" font-size="16" font-weight="600" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">下流認証</text><rect x="0" y="483" width="1207" height="28" rx="0" fill="#e8eff2" stroke="#d1dfe4" stroke-width="1"/><text x="18" y="502" fill="#5a737d" font-size="14" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">公開設定例・リポジトリ定義に基づく教材用の補助図</text><rect x="214" y="147" width="972" height="328" rx="8" fill="#f6fafb" stroke="#c5d8df" stroke-width="1.4"/><text x="235" y="178" font-family="Hiragino Sans,Yu Gothic,Meiryo,sans-serif" font-size="20" font-weight="650" fill="#17496b">Coreを呼ぶ契約と、接続先を呼ぶ権限を分ける</text><rect x="234" y="204" width="220" height="149" rx="8" fill="#fff" stroke="#c5d8df" stroke-width="1.4"/><text x="250" y="234" font-family="Hiragino Sans,Yu Gothic,Meiryo,sans-serif" font-size="21" font-weight="650" fill="#086975">呼出元 → Core</text><text x="250" y="271" font-family="Hiragino Sans,Yu Gothic,Meiryo,sans-serif" font-size="16" font-weight="500" fill="#183844">APIMサブスクリプション</text><text x="250" y="297" font-family="Hiragino Sans,Yu Gothic,Meiryo,sans-serif" font-size="19" font-weight="500" fill="#183844">キーを検証</text><text x="250" y="330" font-family="Hiragino Sans,Yu Gothic,Meiryo,sans-serif" font-size="17" font-weight="500" fill="#52727d">利用枠は契約IDで管理</text><path d="M454 275H480" fill="none" stroke="#288a94" stroke-width="2.5"/><path d="m472 270 8 5-8 5" fill="none" stroke="#288a94" stroke-width="2.5"/><rect x="482" y="204" width="332" height="149" rx="8" fill="#e7f4f4" stroke="#c5d8df" stroke-width="1.4"/><text x="499" y="234" font-family="Hiragino Sans,Yu Gothic,Meiryo,sans-serif" font-size="21" font-weight="650" fill="#086975">APIM：入口資格情報を除去</text><text x="499" y="271" font-family="Hiragino Sans,Yu Gothic,Meiryo,sans-serif" font-size="19" font-weight="500" fill="#183844">キー／受信Authorization</text><text x="499" y="300" font-family="Hiragino Sans,Yu Gothic,Meiryo,sans-serif" font-size="19" font-weight="500" fill="#183844">入口識別値／入力profile</text><text x="499" y="330" font-family="Hiragino Sans,Yu Gothic,Meiryo,sans-serif" font-size="17" font-weight="500" fill="#52727d">本人接続証明も下流へ渡さない</text><path d="M814 275H840" fill="none" stroke="#288a94" stroke-width="2.5"/><path d="m832 270 8 5-8 5" fill="none" stroke="#288a94" stroke-width="2.5"/><rect x="842" y="204" width="324" height="149" rx="8" fill="#fff" stroke="#c5d8df" stroke-width="1.4"/><text x="859" y="234" font-family="Hiragino Sans,Yu Gothic,Meiryo,sans-serif" font-size="21" font-weight="650" fill="#086975">APIM → 接続先</text><text x="859" y="271" font-family="Hiragino Sans,Yu Gothic,Meiryo,sans-serif" font-size="20" font-weight="500" fill="#183844">Managed Identity</text><text x="859" y="300" font-family="Hiragino Sans,Yu Gothic,Meiryo,sans-serif" font-size="19" font-weight="500" fill="#183844">専用キー・ヘッダー等</text><text x="859" y="330" font-family="Hiragino Sans,Yu Gothic,Meiryo,sans-serif" font-size="19" font-weight="500" fill="#183844">本人OAuthの下流token</text><rect x="234" y="375" width="932" height="74" rx="8" fill="#fff" stroke="#c5d8df" stroke-width="1.4"/><text x="252" y="405" font-family="Hiragino Sans,Yu Gothic,Meiryo,sans-serif" font-size="19" font-weight="500" fill="#183844">下流の接続方式は登録済み設定から選ぶ。入口キーを代用品にしない。</text><text x="252" y="433" font-family="Hiragino Sans,Yu Gothic,Meiryo,sans-serif" font-size="17" font-weight="500" fill="#52727d">本人OAuth接続では、Coreの接続証明照合とAPIMの接続利用権を確認する。</text></svg>
