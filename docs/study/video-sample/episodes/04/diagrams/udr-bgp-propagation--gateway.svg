<svg xmlns="http://www.w3.org/2000/svg" width="1207" height="511" viewBox="0 0 1207 511"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#567e8b"/></marker></defs><rect x="0" y="0" width="1207" height="511" rx="9" fill="#f5f7f9" stroke="#75949f" stroke-width="1"/><rect x="0" y="0" width="1207" height="39" rx="0" fill="#183844" stroke="#183844" stroke-width="1"/><text x="19" y="26" fill="#e0f4f2" font-size="18" font-weight="650" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">ネットワーク設定 / UDR</text><text x="1186" y="26" fill="#b8d8dc" font-size="15" font-weight="500" text-anchor="end" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">egakumi STUDY / 設定ビュー</text><text x="20" y="64" fill="#52727d" font-size="14" font-weight="500" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">ルートテーブル / 運用確認</text><text x="20" y="100" fill="#20323e" font-size="26" font-weight="650" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">ゲートウェイ経路伝搬の設定</text><text x="21" y="123" fill="#647984" font-size="14" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">公開例の伝搬設定と、企業接続の存在を区別する</text><path d="M0 135H1207" stroke="#cfdde1"/><rect x="0" y="136" width="192" height="346" rx="0" fill="#eaf0f3" stroke="#d5e0e5" stroke-width="1"/><text x="18" y="161" fill="#647984" font-size="13" font-weight="600" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">確認する設定</text><text x="23" y="192" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">概要</text><text x="23" y="227" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">ルート設定</text><text x="23" y="262" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">経路選択</text><text x="23" y="297" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">往復経路</text><text x="23" y="332" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">閉域と公開</text><text x="23" y="367" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">管理通信</text><rect x="9" y="379" width="173" height="32" rx="5" fill="#d4e9e9" stroke="#c1dddd" stroke-width="1"/><rect x="9" y="379" width="3" height="32" rx="0" fill="#087f8c" stroke="#087f8c" stroke-width="1"/><text x="23" y="402" fill="#086975" font-size="16" font-weight="600" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">運用確認</text><text x="23" y="437" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">確認問題</text><rect x="0" y="483" width="1207" height="28" rx="0" fill="#e8eff2" stroke="#d1dfe4" stroke-width="1"/><text x="18" y="502" fill="#5a737d" font-size="14" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">公開設定例に基づく教材用の設定ビュー / 実効経路の取得画面ではない</text><g font-family="Hiragino Sans,Yu Gothic,Meiryo,sans-serif"><text x="215" y="169" font-size="18" fill="#365864" font-weight="650" text-anchor="start">代表設定・候補経路</text><rect x="214" y="183" width="550" height="29" rx="4" fill="#edf1f5" stroke="#d5e0e5"/><text x="225" y="202.6" font-size="15" fill="#637780" font-weight="600" text-anchor="start">対象RT</text><text x="465" y="202.6" font-size="15" fill="#637780" font-weight="600" text-anchor="start">config値</text><text x="620" y="202.6" font-size="15" fill="#637780" font-weight="600" text-anchor="start">Azure値</text><rect x="214" y="212" width="550" height="68" rx="4" fill="#fff" stroke="#d5e0e5"/><text x="225" y="251.78" font-size="17" fill="#087f8c" font-weight="550" text-anchor="start">AppGW / APIM / 管理VM</text><text x="465" y="251.78" font-size="17" fill="#20323e" font-weight="400" text-anchor="start">伝搬 true</text><text x="620" y="251.78" font-size="17" fill="#20323e" font-weight="400" text-anchor="start">disable false</text><rect x="214" y="280" width="550" height="68" rx="4" fill="#fff" stroke="#d5e0e5"/><text x="225" y="319.78" font-size="17" fill="#087f8c" font-weight="550" text-anchor="start">ACA</text><text x="465" y="319.78" font-size="17" fill="#20323e" font-weight="400" text-anchor="start">切替なし</text><text x="620" y="319.78" font-size="17" fill="#20323e" font-weight="400" text-anchor="start">disable true</text><rect x="214" y="386" width="550" height="65" rx="4" fill="#eaf3f4" stroke="#d5e0e5"/><text x="230" y="413.78" font-size="17" fill="#365864" font-weight="400" text-anchor="start">Azure値は disableBgpRoutePropagation。</text><text x="230" y="434.78" font-size="17" fill="#365864" font-weight="400" text-anchor="start">利用者の「伝搬 true」を反転して指定。</text><rect x="782" y="147" width="404" height="328" rx="4" fill="#eef5f6" stroke="#d5e0e5"/><text x="798" y="173" font-size="18" fill="#365864" font-weight="650" text-anchor="start">独立VNetには伝搬元がない</text><rect x="809" y="207" width="350" height="67" rx="6" fill="#fff" stroke="#8eafb6"/><text x="984" y="246.62" font-size="18" fill="#087f8c" font-weight="600" text-anchor="middle">伝搬元Gateway：なし</text><text x="808" y="337.96" font-size="19" fill="#365864" font-weight="400" text-anchor="start">伝搬有効だけでVPNやExpressRouteは</text><text x="808" y="360.96" font-size="19" fill="#365864" font-weight="400" text-anchor="start">作られない。</text><text x="808" y="428.12" font-size="18" fill="#365864" font-weight="400" text-anchor="start">企業接続は第8回の後の</text><text x="808" y="450.12" font-size="18" fill="#365864" font-weight="400" text-anchor="start">必修 A1・A2 で確認する。</text><g id="highlights"><rect x="807" y="205" width="354" height="71" rx="4" fill="none" stroke="#de343b" stroke-width="2.8"/></g></g></svg>
