-size="18" fill="#087f8c" font-weight="600" text-anchor="middle">往復の次ホップと許可を照合</text><path d="M983 263L983 332" fill="none" stroke="#567e8b" stroke-width="2.3"  marker-end="url(#arrow)"/><text x="984" y="443" font-size="17" fill="#617983" font-weight="500" text-anchor="middle">既定経路 ≠ 全通信の強制経路</text><g id="highlights"><rect x="216" y="214" width="546" height="50" rx="4" fill="none" stroke="#de343b" stroke-width="2.8"/><rect x="216" y="268" width="546" height="50" rx="4" fill="none" stroke="#de343b" stroke-width="2.8"/><rect x="216" y="322" width="546" height="50" rx="4" fill="none" stroke="#de343b" stroke-width="2.8"/></g></g></svg>
