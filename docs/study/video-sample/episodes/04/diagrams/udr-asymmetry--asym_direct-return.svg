<svg xmlns="http://www.w3.org/2000/svg" width="1207" height="511" viewBox="0 0 1207 511"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#567e8b"/></marker></defs><rect x="0" y="0" width="1207" height="511" rx="9" fill="#f5f7f9" stroke="#75949f" stroke-width="1"/><rect x="0" y="0" width="1207" height="39" rx="0" fill="#183844" stroke="#183844" stroke-width="1"/><text x="19" y="26" fill="#e0f4f2" font-size="18" font-weight="650" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">ネットワーク設定 / UDR</text><text x="1186" y="26" fill="#b8d8dc" font-size="15" font-weight="500" text-anchor="end" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">egakumi STUDY / 設定ビュー</text><text x="20" y="64" fill="#52727d" font-size="14" font-weight="500" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">ルートテーブル / 往復経路</text><text x="20" y="100" fill="#20323e" font-size="26" font-weight="650" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">復路が別経路になる場合を考える</text><text x="21" y="123" fill="#647984" font-size="14" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">教材上の比較：往路だけをFirewallへ向けた場合</text><path d="M0 135H1207" stroke="#cfdde1"/><rect x="0" y="136" width="192" height="346" rx="0" fill="#eaf0f3" stroke="#d5e0e5" stroke-width="1"/><text x="18" y="161" fill="#647984" font-size="13" font-weight="600" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">確認する設定</text><text x="23" y="192" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">概要</text><text x="23" y="227" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">ルート設定</text><text x="23" y="262" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">経路選択</text><rect x="9" y="274" width="173" height="32" rx="5" fill="#d4e9e9" stroke="#c1dddd" stroke-width="1"/><rect x="9" y="274" width="3" height="32" rx="0" fill="#087f8c" stroke="#087f8c" stroke-width="1"/><text x="23" y="297" fill="#086975" font-size="16" font-weight="600" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">往復経路</text><text x="23" y="332" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">閉域と公開</text><text x="23" y="367" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">管理通信</text><text x="23" y="402" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">運用確認</text><text x="23" y="437" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">確認問題</text><rect x="0" y="483" width="1207" height="28" rx="0" fill="#e8eff2" stroke="#d1dfe4" stroke-width="1"/><text x="18" y="502" fill="#5a737d" font-size="14" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">公開設定例に基づく教材用の設定ビュー / 実効経路の取得画面ではない</text><g font-family="Hiragino Sans,Yu Gothic,Meiryo,sans-serif"><text x="215" y="169" font-size="18" fill="#365864" font-weight="650" text-anchor="start">代表設定・候補経路</text><rect x="214" y="183" width="550" height="29" rx="4" fill="#edf1f5" stroke="#d5e0e5"/><text x="225" y="202.6" font-size="15" fill="#637780" font-weight="600" text-anchor="start">設定項目</text><text x="465" y="202.6" font-size="15" fill="#637780" font-weight="600" text-anchor="start">値</text><rect x="214" y="212" width="550" height="54" rx="4" fill="#fff" stroke="#d5e0e5"/><text x="225" y="244.78" font-size="17" fill="#087f8c" font-weight="550" text-anchor="start">往路のUDR</text><text x="465" y="244.78" font-size="17" fill="#20323e" font-weight="400" text-anchor="start">AppGW → Firewall → APIM</text><rect x="214" y="266" width="550" height="54" rx="4" fill="#fff" stroke="#d5e0e5"/><text x="225" y="298.78" font-size="17" fill="#087f8c" font-weight="550" text-anchor="start">復路UDRがない場合</text><text x="465" y="298.78" font-size="17" fill="#20323e" font-weight="400" text-anchor="start">VNet内を直接戻る経路が候補</text><rect x="214" y="320" width="550" height="54" rx="4" fill="#fff" stroke="#d5e0e5"/><text x="225" y="352.78" font-size="17" fill="#087f8c" font-weight="550" text-anchor="start">NSGの状態追跡</text><text x="465" y="352.78" font-size="17" fill="#20323e" font-weight="400" text-anchor="start">応答を許可する</text><rect x="214" y="374" width="550" height="54" rx="4" fill="#fff" stroke="#d5e0e5"/><text x="225" y="406.78" font-size="17" fill="#087f8c" font-weight="550" text-anchor="start">復路のUDR</text><text x="465" y="406.78" font-size="17" fill="#20323e" font-weight="400" text-anchor="start">応答の次ホップをFirewallへ</text><rect x="782" y="147" width="404" height="328" rx="4" fill="#eef5f6" stroke="#d5e0e5"/><text x="798" y="173" font-size="18" fill="#365864" font-weight="650" text-anchor="start">仮に復路だけが直接戻ると</text><rect x="800" y="234" width="112" height="59" rx="6" fill="#fff" stroke="#8eafb6"/><text x="856" y="269.62" font-size="18" fill="#087f8c" font-weight="600" text-anchor="middle">AppGW</text><rect x="930" y="234" width="112" height="59" rx="6" fill="#fff" stroke="#8eafb6"/><text x="986" y="269.62" font-size="18" fill="#087f8c" font-weight="600" text-anchor="middle">Firewall</text><rect x="1060" y="234" width="112" height="59" rx="6" fill="#fff" stroke="#8eafb6"/><text x="1116" y="269.62" font-size="18" fill="#087f8c" font-weight="600" text-anchor="middle">APIM</text><path d="M912 264L930 264" fill="none" stroke="#567e8b" stroke-width="2.3"  marker-end="url(#arrow)"/><path d="M1042 264L1060 264" fill="none" stroke="#567e8b" stroke-width="2.3"  marker-end="url(#arrow)"/><path d="M1116 293L1116 350L856 350L856 293" fill="none" stroke="#607989" stroke-width="2.3" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="986" y="379" font-size="14" fill="#607989" font-weight="500" text-anchor="middle">復路：Firewallを通らない</text><text x="808" y="440.78" font-size="17" fill="#365864" font-weight="400" text-anchor="start">応答の許可は、転送先を変えない。</text><g id="highlights"><rect x="216" y="268" width="546" height="50" rx="4" fill="none" stroke="#de343b" stroke-width="2.8"/><rect x="851" y="276" width="270" height="89" rx="4" fill="none" stroke="#de343b" stroke-width="2.8"/></g></g></svg>
