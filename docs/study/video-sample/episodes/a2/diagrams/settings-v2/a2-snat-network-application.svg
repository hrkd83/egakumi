<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1207 511"><rect x="0" y="0" width="1207" height="511" rx="9" fill="#f5f7f9" stroke="#75949f" stroke-width="1"/><rect x="0" y="0" width="1207" height="39" rx="0" fill="#183844" stroke="#183844" stroke-width="1"/><text x="19" y="26" fill="#e0f4f2" font-size="18" font-weight="650" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">ハブ接続後の設定と切替</text><text x="1186" y="26" fill="#b8d8dc" font-size="15" font-weight="500" text-anchor="end" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">egakumi STUDY / 設定ビュー</text><text x="20" y="64" fill="#52727d" font-size="14" font-weight="500" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">接続案の設定（教材） / 送信元と出口</text><text x="20" y="100" fill="#20323e" font-size="26" font-weight="650" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">Firewall前後の送信元・復路とSNAT方式</text><text x="21" y="123" fill="#647984" font-size="14" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">教材・現行定義に基づく確認項目。稼働環境の取得値ではない</text><path d="M0 135H1207" stroke="#cfdde1"/><rect x="0" y="136" width="192" height="346" rx="0" fill="#eaf0f3" stroke="#d5e0e5" stroke-width="1"/><text x="18" y="161" fill="#647984" font-size="13" font-weight="600" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">確認する設定</text><text x="23" y="192" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">切替の範囲</text><text x="23" y="227" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">DNS設定</text><text x="23" y="262" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">Private DNS</text><text x="23" y="297" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">通信の許可</text><rect x="9" y="309" width="173" height="32" rx="5" fill="#d4e9e9" stroke="#c1dddd" stroke-width="1"/><rect x="9" y="309" width="3" height="32" rx="0" fill="#087f8c" stroke="#087f8c" stroke-width="1"/><text x="23" y="332" fill="#086975" font-size="16" font-weight="600" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">送信元と出口</text><text x="23" y="367" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">切替と検証</text><text x="23" y="402" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">切戻しと再配備</text><text x="23" y="437" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">確認問題</text><rect x="0" y="483" width="1207" height="28" rx="0" fill="#e8eff2" stroke="#d1dfe4" stroke-width="1"/><text x="18" y="502" fill="#5a737d" font-size="14" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">実FQDN・IP・経路・許可は対象環境で照合し、設定とレコードの管理元を確定する</text><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#087f8c"/></marker></defs><g font-family="Hiragino Sans,Yu Gothic,Meiryo,sans-serif"><rect x="230" y="168" width="245" height="70" rx="5" fill="#fff" stroke="#c7d9df"/><text x="352.5" y="193" font-size="20" fill="#20323e" font-weight="650" text-anchor="middle">対象区画</text><text x="352.5" y="215" font-size="16" fill="#647984" font-weight="400" text-anchor="middle">要求を開始する側</text><rect x="574" y="168" width="245" height="70" rx="5" fill="#fff" stroke="#c7d9df"/><text x="696.5" y="193" font-size="20" fill="#20323e" font-weight="650" text-anchor="middle">Firewall</text><text x="696.5" y="215" font-size="16" fill="#647984" font-weight="400" text-anchor="middle">SNAT・許可と復路</text><rect x="918" y="168" width="245" height="70" rx="5" fill="#fff" stroke="#c7d9df"/><text x="1040.5" y="193" font-size="20" fill="#20323e" font-weight="650" text-anchor="middle">接続先</text><text x="1040.5" y="215" font-size="16" fill="#647984" font-weight="400" text-anchor="middle">観測した送信元を確認</text><path d="M475 203H574" fill="none" stroke="#087f8c" stroke-width="2.6" marker-end="url(#arr)"/><text x="524" y="194" font-size="16" fill="#087f8c" font-weight="500" text-anchor="middle">通信</text><path d="M819 203H918" fill="none" stroke="#087f8c" stroke-width="2.6" marker-end="url(#arr)"/><text x="868" y="194" font-size="16" fill="#087f8c" font-weight="500" text-anchor="middle">送信元</text><rect x="214" y="288" width="972" height="42" rx="5" fill="#fff" stroke="#c7d9df"/><text x="230" y="315" font-size="17" fill="#586875" font-weight="400" text-anchor="start">Networkルール</text><text x="562" y="315" font-size="17" fill="#087f8c" font-weight="500" text-anchor="start">宛先・SNAT除外private rangesにより確認</text><rect class="highlight" data-target="network" x="217" y="291" width="966" height="36" rx="5" fill="none" stroke="#de343b" stroke-width="2.8"/><rect x="214" y="339" width="972" height="42" rx="5" fill="#fff" stroke="#c7d9df"/><text x="230" y="366" font-size="17" fill="#586875" font-weight="400" text-anchor="start">Applicationルール</text><text x="562" y="366" font-size="17" fill="#087f8c" font-weight="500" text-anchor="start">常にSNAT。Networkの除外指定とは別</text><rect class="highlight" data-target="application" x="217" y="342" width="966" height="36" rx="5" fill="none" stroke="#de343b" stroke-width="2.8"/><rect x="214" y="390" width="972" height="42" rx="5" fill="#fff" stroke="#c7d9df"/><text x="230" y="417" font-size="17" fill="#586875" font-weight="400" text-anchor="start">公開出口をハブへ変更</text><text x="562" y="417" font-size="17" fill="#087f8c" font-weight="500" text-anchor="start">新規接続で公開SNAT元・接続先の許可元を照合</text><text x="232" y="462" font-size="17" fill="#647984" font-weight="400" text-anchor="start">FW両側で何が見えるか、反対側がどこへ返すかを同じ通信で確認</text></g></svg>