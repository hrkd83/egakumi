<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1207 511"><style>text{font-family:Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif}</style><rect width="1207" height="511" rx="16" fill="#071c2a" stroke="#376c7e"/><rect x="25" y="65" width="1157" height="100" rx="12" fill="#0a2231" stroke="#356377"/><text x="52" y="124" fill="#82dfd8" font-size="25" font-weight="650">条件</text><text x="172" y="124" fill="#e4f9fc" font-size="27" font-weight="600">gRPC有効、追加管理規則なしの標準例</text><rect x="25" y="195" width="1157" height="100" rx="12" fill="#0a2231" stroke="#356377"/><text x="52" y="254" fill="#82dfd8" font-size="25" font-weight="650">送信側</text><text x="172" y="254" fill="#e4f9fc" font-size="27" font-weight="600">送信側は、どの規則に一致する？</text><rect x="25" y="325" width="1157" height="100" rx="12" fill="#0a2231" stroke="#356377"/><text x="52" y="384" fill="#82dfd8" font-size="25" font-weight="650">受信側</text><text x="172" y="384" fill="#e4f9fc" font-size="27" font-weight="600">受信側に、管理VMからTCP 80の許可はある？</text></svg>
