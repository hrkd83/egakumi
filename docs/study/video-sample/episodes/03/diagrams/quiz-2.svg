<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1207 511"><style>text{font-family:Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif}</style><rect width="1207" height="511" rx="16" fill="#071c2a" stroke="#376c7e"/><rect x="25" y="65" width="1157" height="100" rx="12" fill="#0a2231" stroke="#356377"/><text x="52" y="124" fill="#82dfd8" font-size="25" font-weight="650">前提</text><text x="172" y="124" fill="#e4f9fc" font-size="27" font-weight="600">新規のTCP 443接続は、両端で許可済み</text><rect x="25" y="195" width="1157" height="100" rx="12" fill="#0a2231" stroke="#356377"/><text x="52" y="254" fill="#82dfd8" font-size="25" font-weight="650">応答</text><text x="172" y="254" fill="#e4f9fc" font-size="27" font-weight="600">同じ接続の応答に、逆向きの許可を追加する？</text><rect x="25" y="325" width="1157" height="100" rx="12" fill="#0a2231" stroke="#356377"/><text x="52" y="384" fill="#82dfd8" font-size="25" font-weight="650">変更後</text><text x="172" y="384" fill="#e4f9fc" font-size="27" font-weight="600">規則変更後、既存接続の継続だけで確認できる？</text></svg>
