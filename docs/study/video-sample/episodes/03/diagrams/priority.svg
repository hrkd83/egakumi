<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1207 511"><rect x="0" y="0" width="1207" height="511" rx="16" fill="#071c2a" stroke="#376c7e"/><text x="36" y="45" font-family="Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif" font-size="21" fill="#7edbd9" font-weight="650">評価順</text><text x="441" y="45" font-family="Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif" font-size="21" fill="#7edbd9" font-weight="650">条件に一致したら</text><text x="881" y="45" font-family="Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif" font-size="21" fill="#7edbd9" font-weight="650">その後の規則</text><path d="M20 65H1187" stroke="#274e61"/><text x="36" y="108.0" font-family="Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif" font-size="22" fill="#dff8fb" font-weight="600">100〜410 / 個別規則</text><text x="441" y="108.0" font-family="Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif" font-size="22" fill="#a9cbd9" font-weight="500">Access: Allow または Deny</text><text x="881" y="108.0" font-family="Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif" font-size="22" fill="#a9cbd9" font-weight="500">評価を終える</text><path d="M20 135H1187" stroke="#274e61"/><text x="36" y="178.0" font-family="Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif" font-size="22" fill="#dff8fb" font-weight="600">4096 / 独自の終端拒否</text><text x="441" y="178.0" font-family="Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif" font-size="22" fill="#a9cbd9" font-weight="500">それ以前に未一致 → Deny</text><text x="881" y="178.0" font-family="Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif" font-size="22" fill="#a9cbd9" font-weight="500">既定許可へ進まない</text><path d="M20 205H1187" stroke="#274e61"/><text x="36" y="248.0" font-family="Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif" font-size="22" fill="#dff8fb" font-weight="600">65000以降 / Azure既定</text><text x="441" y="248.0" font-family="Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif" font-size="22" fill="#a9cbd9" font-weight="500">4096がない方向などで評価</text><text x="881" y="248.0" font-family="Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif" font-size="22" fill="#a9cbd9" font-weight="500">VNet内許可など</text><text x="34" y="479" font-family="Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif" font-size="21" fill="#87cbd1" font-weight="500">同じNSG・同じ方向の中で、数字の小さい順に照合する。</text></svg>
