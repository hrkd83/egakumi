<svg xmlns="http://www.w3.org/2000/svg" width="1207" height="511" viewBox="0 0 1207 511"><rect x="0" y="0" width="1207" height="511" rx="9" fill="#f5f7f9" stroke="#75949f" stroke-width="1"/><rect x="0" y="0" width="1207" height="39" rx="0" fill="#183844" stroke="#183844" stroke-width="1"/><text x="19" y="26" fill="#e0f4f2" font-size="18" font-weight="650" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">Portal のサービスと管理</text><text x="1186" y="26" fill="#b8d8dc" font-size="15" font-weight="500" text-anchor="end" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">egakumi STUDY / 設定ビュー</text><text x="20" y="64" fill="#52727d" font-size="14" font-weight="500" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">APIキー発行の教材図 / 再試行</text><text x="20" y="100" fill="#20323e" font-size="26" font-weight="650" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">APIM成功後のSQL確定失敗から再開する</text><text x="21" y="123" fill="#647984" font-size="14" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">同じ画面のまま、処理の順番と保存される状態を確認する</text><path d="M0 135H1207" stroke="#cfdde1"/><rect x="0" y="136" width="192" height="346" rx="0" fill="#eaf0f3" stroke="#d5e0e5" stroke-width="1"/><text x="18" y="161" fill="#647984" font-size="13" font-weight="600" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">確認する設定</text><text x="23" y="192" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">発行入力</text><text x="23" y="227" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">許可の確認</text><text x="23" y="262" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">SQL予約</text><text x="23" y="297" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">APIM作成</text><text x="23" y="332" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">確定と監査</text><rect x="9" y="344" width="173" height="32" rx="5" fill="#d4e9e9" stroke="#c1dddd" stroke-width="1"/><rect x="9" y="344" width="3" height="32" rx="0" fill="#087f8c" stroke="#087f8c" stroke-width="1"/><text x="23" y="367" fill="#086975" font-size="16" font-weight="600" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">再試行</text><rect x="0" y="483" width="1207" height="28" rx="0" fill="#e8eff2" stroke="#d1dfe4" stroke-width="1"/><text x="18" y="502" fill="#5a737d" font-size="14" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">リポジトリ定義に基づく処理図。稼働環境の取得・実測結果ではない。</text><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#087f8c"/></marker></defs><g font-family="Hiragino Sans,Yu Gothic,Meiryo,sans-serif">
<rect x="214" y="147" width="972" height="328" rx="7" fill="#f8fbfc" stroke="#c6d8de" stroke-width="1.5"/>
<text x="234" y="181" font-size="20" fill="#5d7580" font-weight="500">APIM作成後にSQL確定が失敗した例：保存済みの予約から再開する</text>
<rect x="234" y="212" width="218" height="157" rx="7" fill="#fff" stroke="#c6d8de" stroke-width="1.5"/><text x="248" y="244" font-size="20" fill="#087f8c" font-weight="650">① 確定で失敗</text><text x="248" y="280" font-size="18" fill="#20323e" font-weight="400">APIM作成は成功</text><text x="248" y="308" font-size="18" fill="#20323e" font-weight="400">SQL確定は失敗</text><text x="248" y="336" font-size="18" fill="#20323e" font-weight="400">SQLの確定を取消</text>
<rect x="472" y="212" width="218" height="157" rx="7" fill="#edf5fb" stroke="#c6d8de" stroke-width="1.5"/><text x="486" y="244" font-size="20" fill="#087f8c" font-weight="650">② 残る状態</text><text x="486" y="280" font-size="18" fill="#20323e" font-weight="400">SQL：creating 予約</text><text x="486" y="308" font-size="18" fill="#20323e" font-weight="400">APIM：実体あり</text><text x="486" y="336" font-size="18" fill="#20323e" font-weight="400">両方を照合する</text>
<rect x="710" y="212" width="218" height="157" rx="7" fill="#fff" stroke="#c6d8de" stroke-width="1.5"/><text x="724" y="244" font-size="20" fill="#087f8c" font-weight="650">③ 同じ依頼で再開</text><text x="724" y="280" font-size="18" fill="#20323e" font-weight="400">依頼ID ＋ 同じ入力</text><text x="724" y="308" font-size="18" fill="#20323e" font-weight="400">APIMを GET 再照会</text><text x="724" y="336" font-size="18" fill="#20323e" font-weight="400">一致を確認する</text>
<rect x="948" y="212" width="218" height="157" rx="7" fill="#e9f5f3" stroke="#c6d8de" stroke-width="1.5"/><text x="962" y="244" font-size="20" fill="#087f8c" font-weight="650">④ SQLで確定</text><text x="962" y="280" font-size="18" fill="#20323e" font-weight="400">active に更新</text><text x="962" y="308" font-size="18" fill="#20323e" font-weight="400">create 監査を保存</text><text x="962" y="336" font-size="18" fill="#20323e" font-weight="400">一緒に commit</text>
<path d="M454 291h16" fill="none" stroke="#087f8c" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M692 291h16" fill="none" stroke="#087f8c" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M930 291h16" fill="none" stroke="#087f8c" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="234" y="405" font-size="18" fill="#5d7580" font-weight="400">再試行でも現在所属・承認を再確認。既存APIMを上書きせず、結果が一致するかを調べる。</text>
<rect x="234" y="423" width="932" height="35" rx="7" fill="#f1f4fa" stroke="#c9d5e4" stroke-width="1.5"/>
<text x="248" y="447" font-size="19" fill="#3379a7" font-weight="600">creating の予約だけでは、APIMの作成成功は判断できない。</text>
</g></svg>
