<svg xmlns="http://www.w3.org/2000/svg" width="1207" height="511" viewBox="0 0 1207 511"><rect x="0" y="0" width="1207" height="511" rx="9" fill="#f5f7f9" stroke="#75949f" stroke-width="1"/><rect x="0" y="0" width="1207" height="39" rx="0" fill="#183844" stroke="#183844" stroke-width="1"/><text x="19" y="26" fill="#e0f4f2" font-size="18" font-weight="650" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">Portal のサービスと管理</text><text x="1186" y="26" fill="#b8d8dc" font-size="15" font-weight="500" text-anchor="end" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">egakumi STUDY / 設定ビュー</text><text x="20" y="64" fill="#52727d" font-size="14" font-weight="500" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">教材用の関連図 / 本人と所有</text><text x="20" y="100" fill="#20323e" font-size="26" font-weight="650" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">本人から管理できるキーへ</text><text x="21" y="123" fill="#647984" font-size="14" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">設定と保存先の関係を、固定した画面で確認する</text><path d="M0 135H1207" stroke="#cfdde1"/><rect x="0" y="136" width="192" height="346" rx="0" fill="#eaf0f3" stroke="#d5e0e5" stroke-width="1"/><text x="18" y="161" fill="#647984" font-size="13" font-weight="600" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">確認する設定</text><text x="23" y="192" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">役割の分担</text><rect x="9" y="204" width="173" height="32" rx="5" fill="#d4e9e9" stroke="#c1dddd" stroke-width="1"/><rect x="9" y="204" width="3" height="32" rx="0" fill="#087f8c" stroke="#087f8c" stroke-width="1"/><text x="23" y="227" fill="#086975" font-size="16" font-weight="600" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">本人と所有</text><text x="23" y="262" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">会社と費用</text><rect x="0" y="483" width="1207" height="28" rx="0" fill="#e8eff2" stroke="#d1dfe4" stroke-width="1"/><text x="18" y="502" fill="#5a737d" font-size="14" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">リポジトリの実装説明に基づく概念図・稼働環境の取得画面ではない</text><defs><marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#087f8c"/></marker><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#3379a7"/></marker></defs><g font-family="Hiragino Sans,Yu Gothic,Meiryo,sans-serif">
<rect x="214" y="147" width="972" height="328" rx="7" fill="#f8fbfc" stroke="#c6d8de" stroke-width="1.5"/>
<text x="234" y="174" font-size="19" fill="#5d7580" font-weight="500">操作時の現在所属を確認し、グループ所有のキーへ対応付ける</text>
<rect x="234" y="212" width="258" height="142" rx="7" fill="#edf5fb" stroke="#b9d3e5" stroke-width="1.5"/>
<text x="254" y="244" font-size="23" fill="#20323e" font-weight="650">本人</text>
<text x="254" y="274" font-size="19" fill="#20323e" font-weight="400">Entra の tenant ID</text>
<text x="254" y="302" font-size="19" fill="#20323e" font-weight="400">＋ Object ID</text>
<text x="254" y="332" font-size="17" fill="#5d7580" font-weight="400">portalUser / Session</text>
<path d="M492 281H556" fill="none" stroke="#087f8c" stroke-width="2.4" marker-end="url(#arrow-teal)"/>
<text x="505" y="263" font-size="16" fill="#5d7580" font-weight="400">照会</text>
<rect x="567" y="212" width="256" height="142" rx="7" fill="#e9f5f3" stroke="#98c9c5" stroke-width="1.5"/>
<text x="587" y="244" font-size="22" fill="#087f8c" font-weight="650">Microsoft Graph</text>
<text x="587" y="274" font-size="19" fill="#20323e" font-weight="400">現在の所属グループ</text>
<text x="587" y="302" font-size="18" fill="#20323e" font-weight="400">本人 ID を使って確認</text>
<text x="587" y="332" font-size="15" fill="#5d7580" font-weight="400">所属の名簿を SQL に保存しない</text>
<path d="M823 281H887" fill="none" stroke="#087f8c" stroke-width="2.4" marker-end="url(#arrow-teal)"/>
<text x="836" y="263" font-size="16" fill="#5d7580" font-weight="400">照合</text>
<rect x="898" y="212" width="268" height="142" rx="7" fill="#fff" stroke="#c6d8de" stroke-width="1.5"/>
<text x="918" y="244" font-size="22" fill="#087f8c" font-weight="650">SQL の管理情報</text>
<text x="918" y="274" font-size="18" fill="#20323e" font-weight="400">所有グループ → APIキー</text>
<text x="918" y="302" font-size="19" fill="#20323e" font-weight="400">製品承認・キー状態</text>
<text x="918" y="332" font-size="16" fill="#5d7580" font-weight="400">本人とキーの直接 FK はない</text>
<path d="M1032 354V380" fill="none" stroke="#3379a7" stroke-width="2.4" stroke-dasharray="6 5" marker-end="url(#arrow-blue)"/>
<rect x="234" y="391" width="932" height="65" rx="7" fill="#f1f4fa" stroke="#c9d5e4" stroke-width="1.5"/>
<text x="254" y="418" font-size="20" fill="#3379a7" font-weight="600">companyId → portalCompany：利用会社と費用帰属の対応</text>
<text x="254" y="443" font-size="17" fill="#5d7580" font-weight="400">会社の一致だけでは管理権限を与えない。所有と操作権限は Entra グループで判断。</text>
</g></svg>
