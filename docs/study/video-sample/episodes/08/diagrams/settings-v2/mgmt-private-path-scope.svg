 y="235" font-size="15" fill="#52727d" font-weight="400" text-anchor="middle">接続元を確認</text><rect x="482" y="190" width="195" height="56" rx="4" fill="#f2f8f8" stroke="#87aab1" stroke-width="1"/><text x="579.5" y="213" font-size="20" fill="#174b55" font-weight="600" text-anchor="middle">企業側の経路</text><text x="579.5" y="235" font-size="15" fill="#52727d" font-weight="400" text-anchor="middle">接続方式を別に準備</text><rect x="734" y="190" width="195" height="56" rx="4" fill="#f2f8f8" stroke="#87aab1" stroke-width="1"/><text x="831.5" y="213" font-size="20" fill="#174b55" font-weight="600" text-anchor="middle">受信NSG</text><text x="831.5" y="235" font-size="15" fill="#52727d" font-weight="400" text-anchor="middle">通信条件を判定</text><rect x="986" y="190" width="184" height="56" rx="4" fill="#f2f8f8" stroke="#87aab1" stroke-width="1"/><text x="1078" y="213" font-size="20" fill="#174b55" font-weight="600" text-anchor="middle">管理VM</text><text x="1078" y="235" font-size="15" fill="#52727d" font-weight="400" text-anchor="middle">実IPは出力を確認</text><path d="M425 218H482" fill="none" stroke="#087f8c" stroke-width="2.2"  marker-end="url(#arrow08)"/><path d="M677 218H734" fill="none" stroke="#087f8c" stroke-width="2.2"  marker-end="url(#arrow08)"/><path d="M929 218H986" fill="none" stroke="#087f8c" stroke-width="2.2"  marker-end="url(#arrow08)"/><path d="M1078 246V277H328V246" fill="none" stroke="#087f8c" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#arrow08)"/><text x="702" y="269" font-size="16" fill="#52727d" font-weight="400" text-anchor="middle">戻りの経路も照合</text><rect x="214" y="307" width="972" height="52" rx="4" fill="#fff" stroke="#d5e0e5" stroke-width="1"/><text x="230" y="339" font-size="17" fill="#586875" font-weight="500" text-anchor="start">このinfraの構築範囲</text><text x="475" y="339" font-size="17" fill="#087f8c" font-weight="400" text-anchor="start">VPN Gateway・Bastion・VNetピアリングは作らない</text><rect x="214" y="359" width="972" height="52" rx="4" fill="#fff" stroke="#d5e0e5" stroke-width="1"/><text x="230" y="391" font-size="17" fill="#586875" font-weight="500" text-anchor="start">NSG許可元の記入</text><text x="475" y="391" font-size="17" fill="#087f8c" font-weight="400" text-anchor="start">private IPへの接続経路を新しく作る操作ではない</text><rect x="214" y="411" width="972" height="52" rx="4" fill="#fff" stroke="#d5e0e5" stroke-width="1"/><text x="230" y="443" font-size="17" fill="#586875" font-weight="500" text-anchor="start">宛先の確認</text><text x="475" y="443" font-size="17" fill="#087f8c" font-weight="400" text-anchor="start">管理VM / NICの実出力で確認し、値を推測しない</text></g><g id="explanation-highlights"><rect x="214" y="307" width="972" height="52" rx="5" fill="none" stroke="#de343b" stroke-width="2.8"/></g></svg>
