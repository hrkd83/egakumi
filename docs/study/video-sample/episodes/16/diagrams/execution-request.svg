<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1207 511"><g font-family="Hiragino Sans,Yu Gothic,Meiryo,sans-serif"><rect x="0" y="0" width="1207" height="511" rx="9" fill="#f5f7f9" stroke="#75949f" stroke-width="1"/><rect x="0" y="0" width="1207" height="39" rx="0" fill="#183844" stroke="#183844" stroke-width="1"/><text x="19" y="26" fill="#e0f4f2" font-size="18" font-weight="650" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">Portal / API試用</text><text x="1186" y="26" fill="#b8d8dc" font-size="15" font-weight="500" text-anchor="end" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">egakumi STUDY / 設定ビュー</text><text x="20" y="64" fill="#52727d" font-size="14" font-weight="500" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">教材の処理図 / APIの試用</text><text x="20" y="100" fill="#20323e" font-size="26" font-weight="650" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">台帳の選択からGateway実行へ</text><text x="21" y="123" fill="#647984" font-size="14" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">ブラウザーから送る値と、サーバー内で解決する値を分ける</text><path d="M0 135H1207" stroke="#cfdde1"/><rect x="0" y="136" width="192" height="346" rx="0" fill="#eaf0f3" stroke="#d5e0e5" stroke-width="1"/><text x="18" y="161" fill="#647984" font-size="13" font-weight="600" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">確認する設定</text><text x="23" y="192" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">カタログ生成</text><text x="23" y="227" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">候補の表示</text><rect x="9" y="239" width="173" height="32" rx="5" fill="#d4e9e9" stroke="#c1dddd" stroke-width="1"/><rect x="9" y="239" width="3" height="32" rx="0" fill="#087f8c" stroke="#087f8c" stroke-width="1"/><text x="23" y="262" fill="#086975" font-size="16" font-weight="600" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">APIの試用</text><rect x="0" y="483" width="1207" height="28" rx="0" fill="#e8eff2" stroke="#d1dfe4" stroke-width="1"/><text x="18" y="502" fill="#5a737d" font-size="14" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">通常REST試用の代表経路 / Realtime・文書解析・MCPは方式に差があります</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#438d9a"/></marker></defs><rect x="228" y="161" width="249" height="116" rx="7" fill="#fff" stroke="#b7cdd4"/><text x="244" y="191" font-size="21" fill="#087f8c" font-weight="650">ブラウザー</text><text x="244" y="220" font-size="17" fill="#20323e" font-weight="400">台帳ID ＋ 入力</text><text x="244" y="245" font-size="17" fill="#20323e" font-weight="400">キー実値は指定しない</text><rect x="535" y="161" width="339" height="116" rx="7" fill="#fff" stroke="#b7cdd4"/><text x="551" y="191" font-size="21" fill="#087f8c" font-weight="650">Portalサーバー</text><text x="551" y="220" font-size="17" fill="#20323e" font-weight="400">現在の権限・状態を再確認</text><text x="551" y="245" font-size="17" fill="#20323e" font-weight="400">ARM主キー → 要求に付与</text><rect x="932" y="161" width="238" height="116" rx="7" fill="#fff" stroke="#b7cdd4"/><text x="948" y="191" font-size="21" fill="#087f8c" font-weight="650">固定Gateway</text><text x="948" y="220" font-size="17" fill="#20323e" font-weight="400">サービスの処理を実行</text><text x="948" y="245" font-size="17" fill="#20323e" font-weight="400">結果 → Portal → 画面</text><path d="M479 216H525" fill="none" stroke="#438d9a" stroke-width="3" marker-end="url(#arrow)"/><path d="M877 216H922" fill="none" stroke="#438d9a" stroke-width="3" marker-end="url(#arrow)"/><text x="232" y="312" font-size="17" fill="#647984" font-weight="600">サーバー内で参照を解決</text><rect x="228" y="326" width="249" height="100" rx="7" fill="#fff" stroke="#b7cdd4"/><text x="244" y="356" font-size="21" fill="#087f8c" font-weight="650">SQL台帳ID</text><text x="244" y="385" font-size="17" fill="#20323e" font-weight="400">portalApiKey.id</text><rect x="535" y="326" width="339" height="100" rx="7" fill="#fff" stroke="#b7cdd4"/><text x="551" y="356" font-size="21" fill="#087f8c" font-weight="650">実APIMサブスクリプションID</text><text x="551" y="385" font-size="17" fill="#20323e" font-weight="400">apimSubscriptionId</text><rect x="932" y="326" width="238" height="100" rx="7" fill="#fff" stroke="#b7cdd4"/><text x="948" y="356" font-size="21" fill="#087f8c" font-weight="650">秘密の主キー</text><text x="948" y="385" font-size="17" fill="#20323e" font-weight="400">primaryKey</text><path d="M479 373H525" fill="none" stroke="#438d9a" stroke-width="3" marker-end="url(#arrow)"/><path d="M877 373H922" fill="none" stroke="#438d9a" stroke-width="3" marker-end="url(#arrow)"/><text x="231" y="461" font-size="17" fill="#52727d" font-weight="400">入力・結果・キー実値を保存するPortal SQL表はありません。</text><g id="highlights"><rect x="225" y="158" width="255" height="122" rx="8" fill="none" stroke="#de343b" stroke-width="2.8"/></g></g></svg>