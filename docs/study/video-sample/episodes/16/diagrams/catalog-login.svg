<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1207 511"><g font-family="Hiragino Sans,Yu Gothic,Meiryo,sans-serif"><rect x="0" y="0" width="1207" height="511" rx="9" fill="#f5f7f9" stroke="#75949f" stroke-width="1"/><rect x="0" y="0" width="1207" height="39" rx="0" fill="#183844" stroke="#183844" stroke-width="1"/><text x="19" y="26" fill="#e0f4f2" font-size="18" font-weight="650" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">Portal / カタログ</text><text x="1186" y="26" fill="#b8d8dc" font-size="15" font-weight="500" text-anchor="end" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">egakumi STUDY / 設定ビュー</text><text x="20" y="64" fill="#52727d" font-size="14" font-weight="500" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">教材の処理図 / カタログ生成</text><text x="20" y="100" fill="#20323e" font-size="26" font-weight="650" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">仕様が画面に届くまで</text><text x="21" y="123" fill="#647984" font-size="14" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">元データ・生成処理・同梱ファイルを分けて確認する</text><path d="M0 135H1207" stroke="#cfdde1"/><rect x="0" y="136" width="192" height="346" rx="0" fill="#eaf0f3" stroke="#d5e0e5" stroke-width="1"/><text x="18" y="161" fill="#647984" font-size="13" font-weight="600" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">確認する設定</text><rect x="9" y="169" width="173" height="32" rx="5" fill="#d4e9e9" stroke="#c1dddd" stroke-width="1"/><rect x="9" y="169" width="3" height="32" rx="0" fill="#087f8c" stroke="#087f8c" stroke-width="1"/><text x="23" y="192" fill="#086975" font-size="16" font-weight="600" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">カタログ生成</text><text x="23" y="227" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">候補の表示</text><text x="23" y="262" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">APIの試用</text><rect x="0" y="483" width="1207" height="28" rx="0" fill="#e8eff2" stroke="#d1dfe4" stroke-width="1"/><text x="18" y="502" fill="#5a737d" font-size="14" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">リポジトリ実装に基づく教材図 / 稼働環境の取得画面ではありません</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#438d9a"/></marker></defs><rect x="228" y="163" width="280" height="121" rx="7" fill="#fff" stroke="#b7cdd4"/><text x="244" y="193" font-size="21" fill="#087f8c" font-weight="650">元データ</text><text x="244" y="222" font-size="17" fill="#20323e" font-weight="400">API定義・公開名</text><text x="244" y="247" font-size="17" fill="#20323e" font-weight="400">モデル能力情報</text><rect x="558" y="163" width="252" height="121" rx="7" fill="#fff" stroke="#b7cdd4"/><text x="574" y="193" font-size="21" fill="#087f8c" font-weight="650">ビルド前に生成</text><text x="574" y="222" font-size="17" fill="#20323e" font-weight="400">prepare-model-catalog</text><text x="574" y="247" font-size="17" fill="#20323e" font-weight="400">同じ定義から整理</text><rect x="860" y="163" width="310" height="121" rx="7" fill="#fff" stroke="#b7cdd4"/><text x="876" y="193" font-size="21" fill="#087f8c" font-weight="650">Portalに同梱</text><text x="876" y="222" font-size="17" fill="#20323e" font-weight="400">生成JSON → 画面へ</text><text x="876" y="247" font-size="17" fill="#20323e" font-weight="400">カテゴリ・提供元・仕様</text><path d="M509 221H548" fill="none" stroke="#438d9a" stroke-width="3" marker-end="url(#arrow)"/><path d="M812 221H851" fill="none" stroke="#438d9a" stroke-width="3" marker-end="url(#arrow)"/><rect x="228" y="315" width="450" height="119" rx="7" fill="#fff" stroke="#b7cdd4"/><text x="244" y="345" font-size="21" fill="#087f8c" font-weight="650">カタログ本体</text><text x="244" y="374" font-size="17" fill="#20323e" font-weight="400">Portal同梱JSONとToolのアプリ内定義</text><text x="244" y="399" font-size="17" fill="#20323e" font-weight="400">SQLにカタログ本体を保存しない</text><rect x="704" y="315" width="466" height="119" rx="7" fill="#fff" stroke="#b7cdd4"/><text x="720" y="345" font-size="21" fill="#087f8c" font-weight="650">閲覧時のログイン確認</text><text x="720" y="374" font-size="17" fill="#20323e" font-weight="400">本人のセッションをSQLで確認</text><text x="720" y="399" font-size="17" fill="#20323e" font-weight="400">カタログの保存先とは役割が異なる</text><g id="highlights"><rect x="701" y="312" width="472" height="125" rx="8" fill="none" stroke="#de343b" stroke-width="2.8"/></g></g></svg>