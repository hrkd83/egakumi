<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1207 511"><rect x="0" y="0" width="1207" height="511" rx="9" fill="#f5f7f9" stroke="#75949f" stroke-width="1"/><rect x="0" y="0" width="1207" height="39" rx="0" fill="#183844" stroke="#183844" stroke-width="1"/><text x="19" y="26" fill="#e0f4f2" font-size="18" font-weight="650" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">ネットワーク調査 / 教材用の設定メニュー</text><text x="1186" y="26" fill="#b8d8dc" font-size="15" font-weight="500" text-anchor="end" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">egakumi STUDY / 設定ビュー</text><text x="20" y="64" fill="#52727d" font-size="14" font-weight="500" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">通信の到達性を調べる / 通信の特定</text><text x="20" y="100" fill="#20323e" font-size="26" font-weight="650" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">調査する通信を一つに絞る</text><text x="21" y="123" fill="#647984" font-size="14" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">現行定義・公開設定例に基づく教材。実環境の値は調査時に確認します。</text><path d="M0 135H1207" stroke="#cfdde1"/><rect x="0" y="136" width="192" height="346" rx="0" fill="#eaf0f3" stroke="#d5e0e5" stroke-width="1"/><text x="18" y="161" fill="#647984" font-size="13" font-weight="600" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">確認する設定</text><rect x="9" y="169" width="173" height="32" rx="5" fill="#d4e9e9" stroke="#c1dddd" stroke-width="1"/><rect x="9" y="169" width="3" height="32" rx="0" fill="#087f8c" stroke="#087f8c" stroke-width="1"/><text x="23" y="192" fill="#086975" font-size="16" font-weight="600" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">通信の特定</text><text x="23" y="227" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">DNS</text><text x="23" y="262" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">実効経路</text><text x="23" y="297" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">NSG</text><text x="23" y="332" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">Firewallログ</text><text x="23" y="367" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">収集範囲</text><text x="23" y="402" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">通知条件</text><text x="23" y="437" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">確認・まとめ</text><rect x="0" y="483" width="1207" height="28" rx="0" fill="#e8eff2" stroke="#d1dfe4" stroke-width="1"/><text x="18" y="502" fill="#5a737d" font-size="14" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">教材注釈：公開設定例と、調査時に照合する項目・判断を示しています。</text><defs><marker id="arrow07" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#087f8c"/></marker></defs><g font-family="Hiragino Sans,Yu Gothic,Meiryo,sans-serif"><rect x="235" y="156" width="230" height="65" rx="5" fill="#f2f8f8" stroke="#7ba3aa" stroke-width="1"/><text x="247" y="183" font-size="21" fill="#174b55" font-weight="600">AppGW</text><text x="247" y="206" font-size="14" fill="#52727d" font-weight="400">バックエンドへの新規接続</text><rect x="589" y="156" width="230" height="65" rx="5" fill="#f2f8f8" stroke="#7ba3aa" stroke-width="1"/><text x="601" y="183" font-size="21" fill="#174b55" font-weight="600">Firewall</text><text x="601" y="206" font-size="14" fill="#52727d" font-weight="400">Networkルール</text><rect x="943" y="156" width="230" height="65" rx="5" fill="#f2f8f8" stroke="#7ba3aa" stroke-width="1"/><text x="955" y="183" font-size="21" fill="#174b55" font-weight="600">APIM</text><text x="955" y="206" font-size="14" fill="#52727d" font-weight="400">受信と応答</text><path d="M465 179L589 179" fill="none" stroke="#087f8c" stroke-width="2.2" marker-end="url(#arrow07)"/><path d="M819 179L943 179" fill="none" stroke="#087f8c" stroke-width="2.2" marker-end="url(#arrow07)"/><text x="488" y="169" font-size="14" fill="#20323e" font-weight="400">TCP 80</text><text x="842" y="169" font-size="14" fill="#20323e" font-weight="400">TCP 80</text><text x="235" y="247" font-size="17" fill="#52727d" font-weight="400">U1：利用者 → AppGW とは別のネットワーク接続</text><rect x="214" y="274" width="972" height="39" rx="5" fill="#eef6f8" stroke="#d5e0e5" stroke-width="1"/><text x="228" y="299.5" font-size="16" fill="#586875" font-weight="500">失敗時刻</text><text x="438" y="299.5" font-size="17" fill="#087f8c" font-weight="400">時刻・タイムゾーン・検索する時間幅</text><rect x="216" y="276" width="968" height="35" rx="5" fill="none" stroke="#de343b" stroke-width="2.8"/><rect x="214" y="313" width="972" height="39" rx="5" fill="#fff" stroke="#d5e0e5" stroke-width="1"/><text x="228" y="338.5" font-size="16" fill="#586875" font-weight="500">通信元</text><text x="438" y="338.5" font-size="17" fill="#087f8c" font-weight="400">AppGWのprivate IP。元利用者のIPとは区別</text><rect x="214" y="352" width="972" height="39" rx="5" fill="#eef6f8" stroke="#d5e0e5" stroke-width="1"/><text x="228" y="377.5" font-size="16" fill="#586875" font-weight="500">宛先</text><text x="438" y="377.5" font-size="17" fill="#087f8c" font-weight="400">APIMの名前と、DNS回答の内部IP</text><rect x="216" y="354" width="968" height="35" rx="5" fill="none" stroke="#de343b" stroke-width="2.8"/><rect x="214" y="391" width="972" height="39" rx="5" fill="#fff" stroke="#d5e0e5" stroke-width="1"/><text x="228" y="416.5" font-size="16" fill="#586875" font-weight="500">通信条件</text><text x="438" y="416.5" font-size="17" fill="#087f8c" font-weight="400">TCP / 宛先80 / 新規接続か・失敗の症状</text><rect x="214" y="430" width="972" height="39" rx="5" fill="#fff" stroke="#d5e0e5" stroke-width="1"/><text x="228" y="455.5" font-size="16" fill="#586875" font-weight="500">検索する対象</text><text x="438" y="455.5" font-size="17" fill="#087f8c" font-weight="400">同じ環境のFirewall・LAW</text></g></svg>
