<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1207 511"><rect x="0" y="0" width="1207" height="511" rx="9" fill="#f5f7f9" stroke="#75949f" stroke-width="1"/><rect x="0" y="0" width="1207" height="39" rx="0" fill="#183844" stroke="#183844" stroke-width="1"/><text x="19" y="26" fill="#e0f4f2" font-size="18" font-weight="650" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">ネットワーク調査 / 教材用の設定メニュー</text><text x="1186" y="26" fill="#b8d8dc" font-size="15" font-weight="500" text-anchor="end" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">egakumi STUDY / 設定ビュー</text><text x="20" y="64" fill="#52727d" font-size="14" font-weight="500" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">通信の到達性を調べる / DNS</text><text x="20" y="100" fill="#20323e" font-size="26" font-weight="650" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">送信元でDNS回答を確かめる</text><text x="21" y="123" fill="#647984" font-size="14" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">現行定義・公開設定例に基づく教材。実環境の値は調査時に確認します。</text><path d="M0 135H1207" stroke="#cfdde1"/><rect x="0" y="136" width="192" height="346" rx="0" fill="#eaf0f3" stroke="#d5e0e5" stroke-width="1"/><text x="18" y="161" fill="#647984" font-size="13" font-weight="600" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">確認する設定</text><text x="23" y="192" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">通信の特定</text><rect x="9" y="204" width="173" height="32" rx="5" fill="#d4e9e9" stroke="#c1dddd" stroke-width="1"/><rect x="9" y="204" width="3" height="32" rx="0" fill="#087f8c" stroke="#087f8c" stroke-width="1"/><text x="23" y="227" fill="#086975" font-size="16" font-weight="600" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">DNS</text><text x="23" y="262" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">実効経路</text><text x="23" y="297" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">NSG</text><text x="23" y="332" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">Firewallログ</text><text x="23" y="367" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">収集範囲</text><text x="23" y="402" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">通知条件</text><text x="23" y="437" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">確認・まとめ</text><rect x="0" y="483" width="1207" height="28" rx="0" fill="#e8eff2" stroke="#d1dfe4" stroke-width="1"/><text x="18" y="502" fill="#5a737d" font-size="14" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">教材注釈：公開設定例と、調査時に照合する項目・判断を示しています。</text><defs><marker id="arrow07" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#087f8c"/></marker></defs><g font-family="Hiragino Sans,Yu Gothic,Meiryo,sans-serif"><rect x="235" y="156" width="230" height="65" rx="5" fill="#f2f8f8" stroke="#7ba3aa" stroke-width="1"/><text x="247" y="183" font-size="21" fill="#174b55" font-weight="600">送信元 AppGW</text><text x="247" y="206" font-size="14" fill="#52727d" font-weight="400">失敗した場所のDNS設定</text><rect x="589" y="156" width="230" height="65" rx="5" fill="#f2f8f8" stroke="#7ba3aa" stroke-width="1"/><text x="601" y="183" font-size="21" fill="#174b55" font-weight="600">参照するDNS</text><text x="601" y="206" font-size="14" fill="#52727d" font-weight="400">転送・ゾーンのリンク</text><rect x="943" y="156" width="230" height="65" rx="5" fill="#f2f8f8" stroke="#7ba3aa" stroke-width="1"/><text x="955" y="183" font-size="21" fill="#174b55" font-weight="600">APIM内部IP</text><text x="955" y="206" font-size="14" fill="#52727d" font-weight="400">今回の宛先として照合</text><path d="M465 190L589 190" fill="none" stroke="#087f8c" stroke-width="2.2" marker-end="url(#arrow07)"/><path d="M819 190L943 190" fill="none" stroke="#087f8c" stroke-width="2.2" marker-end="url(#arrow07)"/><text x="235" y="247" font-size="17" fill="#52727d" font-weight="400">端末でのDNS成功を、AppGWでの確認結果に置き換えない</text><rect x="214" y="274" width="972" height="49" rx="5" fill="#fff" stroke="#d5e0e5" stroke-width="1"/><text x="228" y="304.5" font-size="16" fill="#586875" font-weight="500">失敗した送信元</text><text x="438" y="304.5" font-size="17" fill="#087f8c" font-weight="400">AppGW。端末側の成功だけで判断しない</text><rect x="214" y="323" width="972" height="49" rx="5" fill="#fff" stroke="#d5e0e5" stroke-width="1"/><text x="228" y="353.5" font-size="16" fill="#586875" font-weight="500">参照するDNS</text><text x="438" y="353.5" font-size="17" fill="#087f8c" font-weight="400">送信元設定・転送・ゾーンのリンクを確認</text><rect x="214" y="372" width="972" height="49" rx="5" fill="#fff" stroke="#d5e0e5" stroke-width="1"/><text x="228" y="402.5" font-size="16" fill="#586875" font-weight="500">宛先の名前と回答</text><text x="438" y="402.5" font-size="17" fill="#087f8c" font-weight="400">APIMゲートウェイ名 → APIMの実内部IP</text><rect x="214" y="421" width="972" height="49" rx="5" fill="#fff" stroke="#d5e0e5" stroke-width="1"/><text x="228" y="451.5" font-size="16" fill="#586875" font-weight="500">確認した場所</text><text x="438" y="451.5" font-size="17" fill="#087f8c" font-weight="400">DNS回答と、調べた送信元を一緒に残す</text></g></svg>
