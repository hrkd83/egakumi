or="start">ハブ側のピアリング</text><text x="570" y="343" font-size="18" fill="#087f8c" font-weight="500" text-anchor="start">allowGatewayTransit</text><rect x="214" y="361" width="972" height="45" rx="5" fill="#fff" stroke="#c7d9df"/><text x="231" y="390" font-size="18" fill="#586875" font-weight="400" text-anchor="start">スポーク側のピアリング</text><text x="570" y="390" font-size="18" fill="#087f8c" font-weight="500" text-anchor="start">useRemoteGateways</text><rect x="214" y="408" width="972" height="45" rx="5" fill="#fff" stroke="#c7d9df"/><text x="231" y="437" font-size="18" fill="#586875" font-weight="400" text-anchor="start">採用・共有の制約</text><text x="570" y="437" font-size="18" fill="#087f8c" font-weight="500" text-anchor="start">実利用時のみ / 自身GW併用不可 / リモート利用1ピアリング</text></g></svg>