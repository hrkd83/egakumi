7" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">ピアリング</text><text x="23" y="262" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">公開出口</text><text x="23" y="297" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">入口の往復</text><text x="23" y="332" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">区画別の経路</text><text x="23" y="367" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">Gateway共有</text><text x="23" y="402" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">経路伝搬</text><text x="23" y="437" fill="#4d6571" font-size="16" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">確認問題</text><rect x="0" y="483" width="1207" height="28" rx="0" fill="#e8eff2" stroke="#d1dfe4" stroke-width="1"/><text x="18" y="502" fill="#5a737d" font-size="14" font-weight="400" text-anchor="start" style="font-family:&quot;Hiragino Sans&quot;,&quot;Yu Gothic&quot;,Meiryo,sans-serif">設定値は設計時の確認対象。実IP・実効経路・許可は対象環境で照合する</text><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#087f8c"/></marker></defs><g font-family="Hiragino Sans,Yu Gothic,Meiryo,sans-serif"><text x="240" y="165" font-size="17" fill="#647984" font-weight="500" text-anchor="start">公開宛ての接続</text><rect x="240" y="176" width="240" height="49" rx="5" fill="#fff"