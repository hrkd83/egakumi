="5" fill="#fff" stroke="#c7d9df"/><text x="231" y="395" font-size="18" fill="#586875" font-weight="400" text-anchor="start">AppGWの具体経路</text><text x="570" y="395" font-size="18" fill="#087f8c" font-weight="500" text-anchor="start">実APIM VIP /32・実ACA入口IP /32 → ローカルFW</text><rect x="214" y="413" width="972" height="45" rx="5" fill="#fff" stroke="#c7d9df"/><text x="231" y="442" font-size="18" fill="#586875" font-weight="400" text-anchor="start">APIMの管理経路</text><text x="570" y="442" font-size="18" fill="#087f8c" font-weight="500" text-anchor="start">ApiManagementタグ → Internet</text></g></svg>