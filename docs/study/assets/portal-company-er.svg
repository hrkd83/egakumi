<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="company-er-title company-er-desc">
  <title id="company-er-title">Portalの会社マスタ・変更監査・キーの会社帰属を示すER図</title>
  <desc id="company-er-desc">portalCompanyは費用帰属の分類に使う会社マスタ。主キーはtenantIdとidの組み合わせ。portalApiKeyのtenantIdとcompanyId、portalCompanyAuditのtenantIdとcompanyIdが、それぞれportalCompanyの複合主キーを参照する2本の物理外部キーを示す。会社の無効化はisActiveを変更し、会社行と既存キーの参照を保持する。会社はEntraグループによる所有権とは別の分類。通常発行では会社必須、移行済みキーではcompanyIdのNULLを許容する。</desc>
  <defs>
    <marker id="company-fk-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#607f73" stroke-width="1.3"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;fill:#1e302d}
      .canvas{fill:#fffefa}.card{fill:#fffefa;stroke:#cad9cc;stroke-width:1.3}.head{fill:#eaf2e9}.rule{stroke:#d4e0d7;stroke-width:1}
      .title{font-size:21px;font-weight:700}.subtitle{font-size:12px;fill:#63716c}.table{font-family:Consolas,monospace;font-size:17px;font-weight:700}
      .purpose{font-size:12px;fill:#52675c}.field{font-family:Consolas,monospace;font-size:13px}.badge{font-family:Consolas,monospace;font-size:11px;font-weight:700;fill:#006b5e}
      .note{font-size:12px;fill:#63716c}.card-note{font-size:11px;fill:#63716c}.edge{fill:none;stroke:#607f73;stroke-width:1.6;marker-end:url(#company-fk-arrow)}.relation{font-size:12px;fill:#006b5e}
    </style>
  </defs>
  <rect class="canvas" width="1200" height="820" rx="8"/>
  <text class="title" x="40" y="32">会社登録とAPIキーの参照関係</text>
  <text class="subtitle" x="40" y="57">会社管理に関係する3表・2本の物理FK / 主な列を抜粋 / 実線は親から子へ</text>

  <path class="edge" d="M400 230H500"/>
  <text class="relation" x="409" y="217">0..1</text>
  <text class="relation" x="492" y="217" text-anchor="end">0..N</text>
  <text class="relation" x="450" y="254" text-anchor="middle">会社帰属</text>
  <path class="edge" d="M220 400V560H500"/>
  <text class="relation" x="233" y="425">1</text>
  <text class="relation" x="487" y="547" text-anchor="end">0..N</text>
  <text class="relation" x="355" y="584" text-anchor="middle">会社の変更履歴</text>

  <g aria-label="portalCompany：請求等の費用帰属に使う会社分類を管理する">
    <rect class="card" x="40" y="100" width="360" height="300" rx="7"/>
    <path class="head" d="M47 100H393a7 7 0 0 1 7 7V174H40V107a7 7 0 0 1 7-7Z"/>
    <text class="table" x="58" y="128">portalCompany</text>
    <text class="purpose" x="58" y="154">目的：費用帰属に使う会社分類を管理</text>
    <path class="rule" d="M40 174H400"/>
    <text class="field" x="58" y="205">tenantId, id</text><text class="badge" x="382" y="205" text-anchor="end">複合PK</text>
    <text class="field" x="58" y="233">name</text>
    <text class="field" x="58" y="261">nameKey</text><text class="badge" x="382" y="261" text-anchor="end">UQ ※</text>
    <text class="field" x="58" y="289">isActive</text>
    <text class="field" x="58" y="317">createdAt / updatedAt</text>
    <text class="card-note" x="58" y="345">※ nameKeyはtenantIdと組み合わせて一意</text>
    <text class="card-note" x="58" y="369">isActive=0で新規発行の選択肢から外す。</text>
    <text class="card-note" x="58" y="387">会社行と既存キーの参照は保持する。</text>
  </g>

  <g aria-label="portalApiKey：会社への帰属とAPIMサブスクリプションの対応を保存する">
    <rect class="card" x="500" y="100" width="660" height="290" rx="7"/>
    <path class="head" d="M507 100H1153a7 7 0 0 1 7 7V174H500V107a7 7 0 0 1 7-7Z"/>
    <text class="table" x="518" y="128">portalApiKey</text>
    <text class="purpose" x="518" y="154">目的：会社への帰属とAPIMサブスクリプションの対応を保持</text>
    <path class="rule" d="M500 174H1160"/>
    <text class="field" x="518" y="207">id</text><text class="badge" x="1142" y="207" text-anchor="end">PK</text>
    <text class="field" x="518" y="235">tenantId, companyId</text><text class="badge" x="1142" y="235" text-anchor="end">FK → Company(tenantId, id)</text>
    <text class="field" x="518" y="263">companyId</text><text class="card-note" x="1142" y="263" text-anchor="end">移行済みキーはNULL可</text>
    <text class="field" x="518" y="291">apimSubscriptionId</text><text class="badge" x="1142" y="291" text-anchor="end">UQ：tenantIdとの組</text>
    <text class="field" x="518" y="319">displayName / clientType / state</text>
    <text class="field" x="518" y="347">systemName / teamName / contactEmail</text>
    <text class="card-note" x="518" y="374">companyIdは費用帰属の分類。所有グループや製品承認は別の列・表で管理する。</text>
  </g>

  <g aria-label="portalCompanyAudit：会社名と有効状態の変更前後と実行者を記録する">
    <rect class="card" x="500" y="440" width="660" height="270" rx="7"/>
    <path class="head" d="M507 440H1153a7 7 0 0 1 7 7V514H500V447a7 7 0 0 1 7-7Z"/>
    <text class="table" x="518" y="468">portalCompanyAudit</text>
    <text class="purpose" x="518" y="494">目的：会社名・有効状態の変更前後と実行者を記録</text>
    <path class="rule" d="M500 514H1160"/>
    <text class="field" x="518" y="542">id</text><text class="badge" x="1142" y="542" text-anchor="end">PK</text>
    <text class="field" x="518" y="570">tenantId, companyId</text><text class="badge" x="1142" y="570" text-anchor="end">FK → Company(tenantId, id)</text>
    <text class="field" x="518" y="598">actorObjectId / action</text><text class="card-note" x="1142" y="598" text-anchor="end">create / update</text>
    <text class="field" x="518" y="626">previousName / previousIsActive</text>
    <text class="field" x="518" y="654">name / isActive</text>
    <text class="field" x="518" y="682">createdAt</text>
  </g>

  <text class="note" x="40" y="639">PK：主キー　FK：外部キー</text>
  <text class="note" x="40" y="663">UQ：一意制約　0..N：0件以上</text>
  <text class="note" x="40" y="687">2本のFKとも同じtenantId内の会社を参照する。</text>
  <path class="rule" d="M40 730H1160"/>
  <text class="note" x="40" y="753">通常の新規発行は会社必須。移行済みキーは companyId = NULL を許容する。</text>
  <text class="note" x="40" y="777">会社は請求等の費用帰属を分類する属性。キーを管理する所有組織（Entraグループ）とは別に管理する。</text>
  <text class="note" x="40" y="801">出典：apps/portal/sql/002_api_keys.sql・007_apim_subscription_identity.sql・008_key_usage_companies.sql。</text>
</svg>
