<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" role="img" aria-labelledby="title desc">
  <title id="title">AppGWとAPIM・ACA間の往復UDR</title>
  <desc id="desc">AppGWはAPIMの実内部VIP/32とACA環境の実内部入口IP/32をFirewallへ送る。APIMとACAはAppGWサブネットCIDR宛てをFirewallへ返す。各行の上矢印が往路、下矢印が復路。実IPはサービス作成後の出力を使う。</desc>
  <defs>
    <marker id="forward" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#245f50"/></marker>
    <marker id="return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#99703a"/></marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; fill: #244c40; }
    .heading { font-size: 22px; font-weight: 650; }
    .copy { font-size: 18px; fill: #617462; }
    .route { font-size: 17px; }
    .back { fill: #88612f; }
    .box { fill: #fffefa; stroke: #b6c8ad; stroke-width: 1.5; }
    .fw { fill: #e7f0df; stroke: #86a17a; stroke-width: 1.5; }
    .out { stroke: #245f50; stroke-width: 2.2; marker-end: url(#forward); }
    .in { stroke: #99703a; stroke-width: 2.2; marker-end: url(#return); }
  </style>
  <rect x="8" y="8" width="1084" height="424" rx="9" fill="#f7f9f3" stroke="#c7d6be"/>
  <text x="30" y="42" class="heading">APIの中継</text>
  <rect x="30" y="73" width="245" height="102" rx="5" class="box"/>
  <text x="152" y="113" text-anchor="middle" class="heading">AppGW</text>
  <text x="152" y="146" text-anchor="middle" class="copy">外部要求の入口</text>
  <rect x="428" y="73" width="245" height="102" rx="5" class="fw"/>
  <text x="550" y="113" text-anchor="middle" class="heading">Firewall</text>
  <text x="550" y="146" text-anchor="middle" class="copy">通過する通信を検査</text>
  <rect x="827" y="73" width="245" height="102" rx="5" class="box"/>
  <text x="949" y="113" text-anchor="middle" class="heading">APIM</text>
  <text x="949" y="146" text-anchor="middle" class="copy">内部VIPで受ける</text>
  <path d="M283 104H420" class="out" fill="none"/>
  <text x="352" y="91" text-anchor="middle" class="route">APIM VIP /32</text>
  <path d="M681 104H819" class="out" fill="none"/>
  <text x="750" y="91" text-anchor="middle" class="route">転送</text>
  <path d="M420 143H283" class="in" fill="none"/>
  <text x="352" y="165" text-anchor="middle" class="route back">転送</text>
  <path d="M819 143H681" class="in" fill="none"/>
  <text x="750" y="165" text-anchor="middle" class="route back">AppGW CIDR</text>

  <line x1="30" y1="211" x2="1072" y2="211" stroke="#d8e2d0"/>
  <text x="30" y="246" class="heading">Portalの中継</text>
  <rect x="30" y="277" width="245" height="102" rx="5" class="box"/>
  <text x="152" y="317" text-anchor="middle" class="heading">AppGW</text>
  <text x="152" y="350" text-anchor="middle" class="copy">外部要求の入口</text>
  <rect x="428" y="277" width="245" height="102" rx="5" class="fw"/>
  <text x="550" y="317" text-anchor="middle" class="heading">Firewall</text>
  <text x="550" y="350" text-anchor="middle" class="copy">同じFirewallを通る</text>
  <rect x="827" y="277" width="245" height="102" rx="5" class="box"/>
  <text x="949" y="317" text-anchor="middle" class="heading">ACA / Portal</text>
  <text x="949" y="350" text-anchor="middle" class="copy">内部入口IPで受ける</text>
  <path d="M283 308H420" class="out" fill="none"/>
  <text x="352" y="295" text-anchor="middle" class="route">ACA入口IP /32</text>
  <path d="M681 308H819" class="out" fill="none"/>
  <text x="750" y="295" text-anchor="middle" class="route">転送</text>
  <path d="M420 347H283" class="in" fill="none"/>
  <text x="352" y="369" text-anchor="middle" class="route back">転送</text>
  <path d="M819 347H681" class="in" fill="none"/>
  <text x="750" y="369" text-anchor="middle" class="route back">AppGW CIDR</text>
  <text x="30" y="412" class="copy">上矢印：往路　下矢印：復路 / AppGW CIDRの公開例は10.40.0.0/24 / 入口IP・Firewall IPは実出力を使用</text>
</svg>
