<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="credential-session-title credential-session-desc">
<title id="credential-session-title">本人接続の照合・失効と、証明更新候補の関係</title>
<desc id="credential-session-desc">SessionsからSessionRotationCandidatesへSessionIdで1対多の物理外部キーがあり、セッション削除時は候補を連鎖削除する。Connectionsの状態・接続失効版、SubjectSecurityの本人失効版はアプリがSessionsと照合し、これらには物理外部キーがない。更新候補は秘密のハッシュと元の世代、有効期限を保存する。</desc>
<defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;fill:#1e302d}.canvas{fill:#fffefa}.card{fill:#fffefa;stroke:#cad9cc;stroke-width:1.3}.head{fill:#eaf2e9}.rule{stroke:#d4e0d7;stroke-width:1}.title{font-size:22px;font-weight:700}.subtitle{font-size:13px;fill:#63716c}.table{font-family:Consolas,monospace;font-size:16px;font-weight:700}.purpose{font-size:12px;fill:#52675c}.field{font-family:Consolas,monospace;font-size:13px}.note{font-size:12px;fill:#63716c}.small{font-size:11px;fill:#63716c}.relation{font-size:12px;fill:#006b5e}.fk{fill:none;stroke:#607f73;stroke-width:1.8}.logical{fill:none;stroke:#84968b;stroke-width:1.7;stroke-dasharray:7 5}</style>
<marker id="credential-session-fk-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#607f73" stroke-width="1.3"/></marker>
<marker id="credential-session-logical-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#84968b" stroke-width="1.3"/></marker></defs>
<rect class="canvas" width="1200" height="980" rx="8"/>
<text class="title" x="40" y="36">本人接続の照合・失効と、証明更新候補の関係</text>
<text class="subtitle" x="40" y="63">証明の利用と更新で使う4表 / 物理FKはSessionsから更新候補への1本</text>
<path class="fk" marker-end="url(#credential-session-fk-arrow)" d="M560 270H730"/>
<text class="relation" x="645" y="247" text-anchor="middle">1 → 0..N</text>
<text class="relation" x="645" y="297" text-anchor="middle">SessionId</text>
<text class="relation" x="645" y="319" text-anchor="middle">DELETE CASCADE</text>
<path class="logical" marker-end="url(#credential-session-logical-arrow)" d="M730 690H640V455H560"/>
<text class="relation" x="650" y="510">接続の状態・</text>
<text class="relation" x="650" y="533">失効版を照合</text>
<path class="logical" marker-end="url(#credential-session-logical-arrow)" d="M300 660V535"/>
<text class="relation" x="316" y="592">本人の失効版を照合</text>
<g aria-label="broker.Sessions：現在の証明・期限・失効状態を管理">
<rect class="card" x="40" y="115" width="520" height="420" rx="7"/>
<path class="head" d="M47 115H553a7 7 0 0 1 7 7V179H40V122a7 7 0 0 1 7-7Z"/>
<text class="table" x="58" y="142">broker.Sessions</text>
<text class="purpose" x="58" y="165">目的：現在の証明・期限・失効状態を管理</text>
<path class="rule" d="M40 179H560"/>
<text class="field" x="58" y="209">PK SessionId</text>
<text class="field" x="58" y="233">SecretHash / PreviousSecretHash</text>
<text class="field" x="58" y="257">Generation / PreviousValidUntil</text>
<text class="field" x="58" y="281">IdleExpiresAt / AbsoluteExpiresAt</text>
<text class="field" x="58" y="305">NextRotationAt / RotationDeadlineAt</text>
<text class="field" x="58" y="329">SubjectEpochAtAuthentication</text>
<text class="field" x="58" y="353">ConnectionEpochAtAuthentication</text>
<text class="field" x="58" y="377">Revoked / LastCommittedRotationId</text>
<text class="small" x="58" y="500">本人と接続はTenantId・ObjectId・ProfileName等で照合。</text>
<text class="small" x="58" y="519">保存した失効版と現在の失効版が一致することを確認する。</text>
</g>
<g aria-label="broker.SessionRotationCandidates：受領・確定前の証明更新候補を保存">
<rect class="card" x="730" y="115" width="430" height="305" rx="7"/>
<path class="head" d="M737 115H1153a7 7 0 0 1 7 7V179H730V122a7 7 0 0 1 7-7Z"/>
<text class="table" x="748" y="142">broker.SessionRotationCandidates</text>
<text class="purpose" x="748" y="165">目的：受領・確定前の証明更新候補を保存</text>
<path class="rule" d="M730 179H1160"/>
<text class="field" x="748" y="209">PK RotationId</text>
<text class="field" x="748" y="233">FK SessionId → Sessions.SessionId</text>
<text class="field" x="748" y="257">SecretHash / FromGeneration</text>
<text class="field" x="748" y="281">CreatedAt / ExpiresAt</text>
<text class="small" x="748" y="385">候補の平文秘密は保存せず、ハッシュを保持。</text>
<text class="small" x="748" y="404">同じ世代の候補は、処理で最大4件に制限する。</text>
</g>
<g aria-label="broker.Connections：CM接続の状態と接続単位の失効版">
<rect class="card" x="730" y="580" width="430" height="250" rx="7"/>
<path class="head" d="M737 580H1153a7 7 0 0 1 7 7V644H730V587a7 7 0 0 1 7-7Z"/>
<text class="table" x="748" y="607">broker.Connections</text>
<text class="purpose" x="748" y="630">目的：CM接続の状態と接続単位の失効版</text>
<path class="rule" d="M730 644H1160"/>
<text class="field" x="748" y="674">PK (TenantId, ObjectId, ProfileName)</text>
<text class="field" x="748" y="698">ProviderName / ConnectionId</text>
<text class="field" x="748" y="722">State / SecurityEpoch</text>
<text class="field" x="748" y="746">Version</text>
<text class="small" x="748" y="814">SessionsのConnectionEpochAtAuthenticationと比較。</text>
</g>
<g aria-label="broker.SubjectSecurity：本人全体の失効版を保持">
<rect class="card" x="40" y="660" width="520" height="170" rx="7"/>
<path class="head" d="M47 660H553a7 7 0 0 1 7 7V724H40V667a7 7 0 0 1 7-7Z"/>
<text class="table" x="58" y="687">broker.SubjectSecurity</text>
<text class="purpose" x="58" y="710">目的：本人全体の失効版を保持</text>
<path class="rule" d="M40 724H560"/>
<text class="field" x="58" y="754">PK (TenantId, ObjectId)</text>
<text class="field" x="58" y="778">RevocationEpoch</text>
<text class="small" x="58" y="814">SessionsのSubjectEpochAtAuthenticationと比較。</text>
</g>
<path class="rule" d="M40 852H1160"/>
<path class="fk" marker-end="url(#credential-session-fk-arrow)" d="M40 873H110"/>
<text class="note" x="125" y="877">実線：親 → 子の物理外部キー（FK）</text>
<path class="logical" marker-end="url(#credential-session-logical-arrow)" d="M570 873H640"/>
<text class="note" x="655" y="877">破線：アプリ側の照合（物理FKなし）</text>
<text class="small" x="40" y="904">PK：主キー　UQ：一意制約　／　broker. はSQLスキーマ名</text>
<text class="note" x="40" y="934">候補の確定で世代を進め、旧値には短い猶予を設ける。確定要求の再送は業務利用期限を延長しない。</text>
<text class="small" x="40" y="958">出典：credential-broker/sql/002_session_lifecycle.sql ／ credential_broker/store.py（照合・候補作成・確定・失効）</text>
</svg>
