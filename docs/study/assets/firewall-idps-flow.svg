<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-labelledby="title desc">
  <title id="title">Azure Firewall IDPSのAlertとDenyの処理</title>
  <desc id="desc">現在の本番定義はAlert。Firewallを通る通信に対し、NetworkまたはApplication規則の許可・拒否判定と、IDPS署名の照合が並列に動く。IDPSの一致はログへ記録されるが、それだけでは遮断しない。遮断を有効にするDenyでは通信ルールの判定後にIDPSを直列で評価し、遮断対象の署名に一致する通信を記録・遮断する。ポータルでの表示名はAlert and Denyで、現在の本番設定ではない。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 7 4 1 7" fill="none" stroke="#547c67" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; fill: #244c40; }
    .heading { font-size: 22px; font-weight: 650; }
    .label { font-size: 20px; font-weight: 600; }
    .copy { font-size: 18px; fill: #617462; }
    .node { fill: #fffefa; stroke: #b6c8ad; stroke-width: 1.4; }
    .flow { fill: none; stroke: #547c67; stroke-width: 1.8; marker-end: url(#arrow); }
  </style>
  <rect x="8" y="8" width="1084" height="454" rx="12" fill="#f7f9f3" stroke="#bdcfb4" stroke-width="1.4"/>

  <text x="32" y="42" class="heading">現在の本番定義 / Alert</text>
  <rect x="32" y="104" width="220" height="80" rx="6" class="node"/>
  <text x="142" y="136" class="label" text-anchor="middle">Firewallを通る</text>
  <text x="142" y="165" class="label" text-anchor="middle">通信</text>
  <path d="M252 144 H290 V101 H320" class="flow"/>
  <path d="M290 144 V199 H320" class="flow"/>
  <rect x="330" y="66" width="700" height="70" rx="6" class="node"/>
  <text x="350" y="95" class="label">Network / Application規則</text>
  <text x="350" y="122" class="copy">許可・拒否を判断</text>
  <rect x="330" y="164" width="700" height="70" rx="6" fill="#edf3e7" stroke="#547c67" stroke-width="2"/>
  <text x="350" y="193" class="label">IDPS署名照合</text>
  <text x="350" y="220" class="copy">一致をログに記録</text>
  <text x="32" y="268" class="copy">IDPSの検知だけでは遮断しない。規則の拒否は有効。</text>

  <path d="M32 287 H1068" fill="none" stroke="#d5e0d0" stroke-width="1.4"/>
  <text x="32" y="321" class="heading">遮断を有効にする場合 / Deny</text>
  <rect x="32" y="345" width="275" height="65" rx="6" class="node"/>
  <text x="169.5" y="385" class="label" text-anchor="middle">通信ルールの判定</text>
  <path d="M315 377.5 H350" class="flow"/>
  <rect x="360" y="345" width="275" height="65" rx="6" class="node"/>
  <text x="497.5" y="385" class="label" text-anchor="middle">IDPS署名照合</text>
  <path d="M643 377.5 H678" class="flow"/>
  <rect x="688" y="345" width="380" height="65" rx="6" fill="#edf3e7" stroke="#547c67" stroke-width="2"/>
  <text x="878" y="372" class="label" text-anchor="middle">Deny対象の署名に一致</text>
  <text x="878" y="398" class="copy" text-anchor="middle">通信を記録・遮断</text>
  <text x="32" y="444" class="copy">ポータル表示は Alert and Deny。現在の設定値ではない。署名ごとの有効モードも確認。</text>
</svg>
