<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="530" viewBox="0 0 1100 530" role="img" aria-labelledby="title desc">
  <title id="title">公開入口の3つの経路と防御の適用範囲</title>
  <desc id="desc">通常HTTP APIは公開HTTPSのTCP 443からApplication GatewayのWAF Preventionへ入り、HTTPのTCP 80でAzure Firewallを経由してAPIMへ進む。Portalも公開HTTPSをWAFで検査するが、その後はHTTPSのTCP 443でFirewallを経由してPortalへ進み、APIMは経由しない。gRPCは公開TLSのTCP 8443からAppGWのTCPリスナーに入り、HTTP WAFの対象外。TLSのTCP 443でFirewallを経由してAPIMへ進む。Firewallでは通信規則が許可・拒否を判断し、本番IDPS Alertが並列に検知・記録する。IDPSの検知だけでは遮断せず、TLS本文の復号検査も構成していない。テスト定義はFirewall StandardでIDPSなし。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 7 4 1 7" fill="none" stroke="#547c67" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; fill: #244c40; }
    .heading { font-size: 22px; font-weight: 650; }
    .lane { font-size: 19px; font-weight: 600; }
    .label { font-size: 20px; font-weight: 600; }
    .copy { font-size: 18px; fill: #617462; }
    .small { font-size: 17px; fill: #617462; }
    .compact { font-size: 16px; fill: #617462; }
    .node { fill: #fffefa; stroke: #b6c8ad; stroke-width: 1.4; }
    .waf { fill: #edf3e7; stroke: #547c67; stroke-width: 2; }
    .firewall { fill: #f1f6ed; stroke: #83a186; stroke-width: 1.6; }
    .flow { fill: none; stroke: #547c67; stroke-width: 1.8; marker-end: url(#arrow); }
  </style>
  <rect x="8" y="8" width="1084" height="514" rx="12" fill="#f7f9f3" stroke="#bdcfb4" stroke-width="1.4"/>
  <text x="32" y="40" class="heading">公開入口の3つの経路と、防御の適用範囲</text>
  <text x="32" y="72" class="lane">通常HTTP API</text>
  <text x="520" y="72" class="small">AppGW → APIM：HTTP / TCP 80</text>
  <rect x="32" y="85" width="168" height="86" rx="6" class="node"/>
  <text x="116" y="119" class="small" text-anchor="middle">外部クライアント</text>
  <text x="116" y="148" class="compact" text-anchor="middle">HTTPS / TCP 443</text>
  <path d="M208 128 H232" class="flow"/>
  <rect x="240" y="85" width="225" height="86" rx="6" class="waf"/>
  <text x="352.5" y="116" class="copy" text-anchor="middle" style="font-size:18px; font-weight:600">Application Gateway</text>
  <text x="352.5" y="148" class="copy" text-anchor="middle">WAF / Prevention</text>
  <path d="M473 128 H507" class="flow"/>
  <rect x="515" y="85" width="285" height="86" rx="6" class="firewall"/>
  <text x="657.5" y="109" class="label" text-anchor="middle">Azure Firewall</text>
  <text x="657.5" y="135" class="small" text-anchor="middle">通信規則：許可 / 拒否</text>
  <text x="657.5" y="159" class="small" text-anchor="middle">IDPS：本番Alert・並列</text>
  <path d="M808 128 H872" class="flow"/>
  <rect x="880" y="85" width="188" height="86" rx="6" class="node"/>
  <text x="974" y="119" class="label" text-anchor="middle">APIM</text>
  <text x="974" y="148" class="small" text-anchor="middle">APIの実行窓口</text>
  <path d="M32 190 H1068" fill="none" stroke="#d5e0d0" stroke-width="1.2"/>
  <text x="32" y="210" class="lane">Portal</text>
  <text x="520" y="210" class="small">AppGW → Portal：HTTPS / TCP 443</text>
  <rect x="32" y="223" width="168" height="86" rx="6" class="node"/>
  <text x="116" y="257" class="small" text-anchor="middle">外部クライアント</text>
  <text x="116" y="286" class="compact" text-anchor="middle">HTTPS / TCP 443</text>
  <path d="M208 266 H232" class="flow"/>
  <rect x="240" y="223" width="225" height="86" rx="6" class="waf"/>
  <text x="352.5" y="254" class="copy" text-anchor="middle" style="font-size:18px; font-weight:600">Application Gateway</text>
  <text x="352.5" y="286" class="copy" text-anchor="middle">WAF / Prevention</text>
  <path d="M473 266 H507" class="flow"/>
  <rect x="515" y="223" width="285" height="86" rx="6" class="firewall"/>
  <text x="657.5" y="247" class="label" text-anchor="middle">Azure Firewall</text>
  <text x="657.5" y="273" class="small" text-anchor="middle">同じFWポリシー</text>
  <text x="657.5" y="297" class="small" text-anchor="middle">TLS本文は復号しない</text>
  <path d="M808 266 H872" class="flow"/>
  <rect x="880" y="223" width="188" height="86" rx="6" class="node"/>
  <text x="974" y="248" class="label" text-anchor="middle">Portal</text>
  <text x="974" y="275" class="compact" text-anchor="middle">HTTPS / TCP 443</text>
  <text x="974" y="299" class="compact" text-anchor="middle">APIMは経由しない</text>
  <path d="M32 328 H1068" fill="none" stroke="#d5e0d0" stroke-width="1.2"/>
  <text x="32" y="348" class="lane">gRPC</text>
  <text x="520" y="348" class="small">AppGW → APIM：TLS / TCP 443</text>
  <rect x="32" y="361" width="168" height="86" rx="6" class="node"/>
  <text x="116" y="395" class="small" text-anchor="middle">外部クライアント</text>
  <text x="116" y="424" class="compact" text-anchor="middle">TLS / TCP 8443</text>
  <path d="M208 404 H232" class="flow"/>
  <rect x="240" y="361" width="225" height="86" rx="6" class="node"/>
  <text x="352.5" y="392" class="copy" text-anchor="middle" style="font-size:18px; font-weight:600">AppGW TCP listener</text>
  <text x="352.5" y="424" class="copy" text-anchor="middle">HTTP WAF対象外</text>
  <path d="M473 404 H507" class="flow"/>
  <rect x="515" y="361" width="285" height="86" rx="6" class="firewall"/>
  <text x="657.5" y="385" class="label" text-anchor="middle">Azure Firewall</text>
  <text x="657.5" y="411" class="small" text-anchor="middle">通信規則 + IDPS Alert</text>
  <text x="657.5" y="435" class="small" text-anchor="middle">TLS本文は復号しない</text>
  <path d="M808 404 H872" class="flow"/>
  <rect x="880" y="361" width="188" height="86" rx="6" class="node"/>
  <text x="974" y="395" class="label" text-anchor="middle">APIM</text>
  <text x="974" y="424" class="small" text-anchor="middle">TLS / TCP 443</text>
  <text x="32" y="481" class="small">本番IDPSはAlert：通信規則と並列に検知・記録し、IDPSの検知だけでは遮断しない。</text>
  <text x="32" y="509" class="compact">テスト定義はFirewall Standard / IDPSなし。FWではTLS本文の復号検査を構成していない。</text>
</svg>
