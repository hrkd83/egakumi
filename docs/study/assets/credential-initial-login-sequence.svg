<marker id="credential-initial-login-sequence-proof-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#477a93" stroke-width="1.5"/></marker>
<marker id="credential-initial-login-sequence-token-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#9a7846" stroke-width="1.5"/></marker>
</defs>
<rect width="1530" height="1968" rx="8" fill="#fffefa"/>
<text class="title" x="24" y="39">初回 B｜Brokerで本人を確認し、CMで認証・同意する</text>
<text class="subtitle" x="24" y="70">本人確認はBroker、外部API用トークンの取得・保存はCMが担当する。</text>
