<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1055" viewBox="0 0 1200 1055" role="img" aria-labelledby="credential-login-title credential-login-desc">
<title id="credential-login-title">本人認証の取引から、CM接続と継続セッションへ</title>
<desc id="credential-login-desc">Transactionsは短期の認証取引、Connectionsは本人とCM接続の対応、SessionsはAPIMサブスクリプションに結び付いた継続セッション。PoolsからConnectionsへの1対多だけがこの図の物理外部キー。取引の本人・profileから接続を照合し、認証完了時にPendingSessionIdでSessionsを作成する。Sessionsの本人と接続の失効版はアプリで照合する。</desc>
<defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;fill:#1e302d}.canvas{fill:#fffefa}.card{fill:#fffefa;stroke:#cad9cc;stroke-width:1.3}.head{fill:#eaf2e9}.rule{stroke:#d4e0d7;stroke-width:1}.title{font-size:22px;font-weight:700}.subtitle{font-size:13px;fill:#63716c}.table{font-family:Consolas,monospace;font-size:16px;font-weight:700}.purpose{font-size:12px;fill:#52675c}.field{font-family:Consolas,monospace;font-size:13px}.note{font-size:12px;fill:#63716c}.small{font-size:11px;fill:#63716c}.relation{font-size:12px;fill:#006b5e}.fk{fill:none;stroke:#607f73;stroke-width:1.8}.logical{fill:none;stroke:#84968b;stroke-width:1.7;stroke-dasharray:7 5}</style>
<marker id="credential-login-fk-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#607f73" stroke-width="1.3"/></marker>
<marker id="credential-login-logical-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#84968b" stroke-width="1.3"/></marker></defs>
<rect class="canvas" width="1200" height="1055" rx="8"/>
<text class="title" x="40" y="36">本人認証の取引から、CM接続と継続セッションへ</text>
<text class="subtitle" x="40" y="63">初回本人接続で使う5表 / 必要なキーと照合列を抜粋</text>
<path class="fk" marker-end="url(#credential-login-fk-arrow)" d="M460 220H710"/>
<text class="relation" x="585" y="198" text-anchor="middle">1 → 0..N</text>
<text class="relation" x="585" y="245" text-anchor="middle">ProfileName + ProviderName</text>
<path class="logical" marker-end="url(#credential-login-logical-arrow)" d="M460 430H590V335H710"/>
<text class="relation" x="590" y="318" text-anchor="middle">本人・profileで接続を照合</text>
<path class="logical" marker-end="url(#credential-login-logical-arrow)" d="M460 575H710"/>
<text class="relation" x="484" y="602">PendingSessionId =</text>
<text class="relation" x="484" y="625">SessionId（完了時に作成）</text>
<path class="logical" marker-end="url(#credential-login-logical-arrow)" d="M935 360V500"/>
<text class="relation" x="954" y="419">本人・profile・</text>
<text class="relation" x="954" y="442">CM接続を照合</text>
<path class="logical" marker-end="url(#credential-login-logical-arrow)" d="M460 800H710"/>
<text class="relation" x="585" y="779" text-anchor="middle">本人全体の失効版を照合</text>
<g aria-label="broker.Pools：CM providerごとの容量と予約数を管理">
<rect class="card" x="40" y="110" width="420" height="185" rx="7"/>
<path class="head" d="M47 110H453a7 7 0 0 1 7 7V174H40V117a7 7 0 0 1 7-7Z"/>
<text class="table" x="58" y="137">broker.Pools</text>
<text class="purpose" x="58" y="160">目的：CM providerごとの容量と予約数を管理</text>
<path class="rule" d="M40 174H460"/>
<text class="field" x="58" y="204">PK (ProfileName, ProviderName)</text>
<text class="field" x="58" y="228">Capacity / Allocated</text>
<text class="field" x="58" y="252">Enabled / AllocationBlocked</text>
<text class="field" x="58" y="276">Version</text>
</g>
<g aria-label="broker.Connections：本人を物理CM接続へ対応付ける">
<rect class="card" x="710" y="110" width="450" height="250" rx="7"/>
<path class="head" d="M717 110H1153a7 7 0 0 1 7 7V174H710V117a7 7 0 0 1 7-7Z"/>
<text class="table" x="728" y="137">broker.Connections</text>
<text class="purpose" x="728" y="160">目的：本人を物理CM接続へ対応付ける</text>
<path class="rule" d="M710 174H1160"/>
<text class="field" x="728" y="204">PK (TenantId, ObjectId, ProfileName)</text>
<text class="field" x="728" y="228">UQ (ProviderName, ConnectionId)</text>
<text class="field" x="728" y="252">State / SecurityEpoch</text>
<text class="field" x="728" y="276">LeaseOwner / LeaseUntil</text>
<text class="field" x="728" y="300">Version</text>
<text class="small" x="728" y="344">同じ本人・profileのCM接続を再利用する。</text>
</g>
<g aria-label="broker.Transactions：本人認証の途中状態を短期間保存">
<rect class="card" x="40" y="370" width="420" height="310" rx="7"/>
<path class="head" d="M47 370H453a7 7 0 0 1 7 7V434H40V377a7 7 0 0 1 7-7Z"/>
<text class="table" x="58" y="397">broker.Transactions</text>
<text class="purpose" x="58" y="420">目的：本人認証の途中状態を短期間保存</text>
<path class="rule" d="M40 434H460"/>
<text class="field" x="58" y="464">PK TransactionId</text>
<text class="field" x="58" y="488">ProfileName / SubscriptionId</text>
<text class="field" x="58" y="512">TenantId / ObjectId（認証後に確定）</text>
<text class="field" x="58" y="536">ProviderName / ConnectionId</text>
<text class="field" x="58" y="560">PendingSessionId / Phase / ExpiresAt</text>
<text class="field" x="58" y="584">SubjectEpochAtVerification</text>
<text class="field" x="58" y="608">ConnectionEpochAtVerification</text>
<text class="small" x="58" y="664">完了時に継続セッションを1件作成する。</text>
</g>
<g aria-label="broker.Sessions：APIMサブスクリプションに結び付いた継続利用を管理">
<rect class="card" x="710" y="500" width="450" height="350" rx="7"/>
<path class="head" d="M717 500H1153a7 7 0 0 1 7 7V564H710V507a7 7 0 0 1 7-7Z"/>
<text class="table" x="728" y="527">broker.Sessions</text>
<text class="purpose" x="728" y="550">目的：APIMサブスクリプションに結び付いた継続利用を管理</text>
<path class="rule" d="M710 564H1160"/>
<text class="field" x="728" y="594">PK SessionId</text>
<text class="field" x="728" y="618">SubscriptionId / ProfileName</text>
<text class="field" x="728" y="642">TenantId / ObjectId</text>
<text class="field" x="728" y="666">ProviderName / ConnectionId</text>
<text class="field" x="728" y="690">SecretHash / Generation</text>
<text class="field" x="728" y="714">SubjectEpochAtAuthentication</text>
<text class="field" x="728" y="738">ConnectionEpochAtAuthentication</text>
<text class="field" x="728" y="762">IdleExpiresAt / AbsoluteExpiresAt</text>
<text class="small" x="728" y="834">1つのCM接続を複数セッションが利用できる。</text>
</g>
<g aria-label="broker.SubjectSecurity：本人全体の失効版を保持">
<rect class="card" x="40" y="735" width="420" height="160" rx="7"/>
<path class="head" d="M47 735H453a7 7 0 0 1 7 7V799H40V742a7 7 0 0 1 7-7Z"/>
<text class="table" x="58" y="762">broker.SubjectSecurity</text>
<text class="purpose" x="58" y="785">目的：本人全体の失効版を保持</text>
<path class="rule" d="M40 799H460"/>
<text class="field" x="58" y="829">PK (TenantId, ObjectId)</text>
<text class="field" x="58" y="853">RevocationEpoch</text>
<text class="field" x="58" y="877">logout-allで失効版を進める</text>
</g>
<path class="rule" d="M40 909H1160"/>
<path class="fk" marker-end="url(#credential-login-fk-arrow)" d="M40 930H110"/>
<text class="note" x="125" y="934">実線：親 → 子の物理外部キー（FK）</text>
<path class="logical" marker-end="url(#credential-login-logical-arrow)" d="M570 930H640"/>
<text class="note" x="655" y="934">破線：アプリ側の照合（物理FKなし）</text>
<text class="small" x="40" y="961">PK：主キー　UQ：一意制約　／　broker. はSQLスキーマ名</text>
<text class="note" x="40" y="989">取引・CM接続・継続セッションは別の保存物。破線の対応にはSQLの外部キーを定義していない。</text>
<text class="note" x="40" y="1013">Microsoftのアクセストークン・更新トークンはCredential Manager（CM）が管理する。</text>
<text class="small" x="40" y="1037">出典：credential-broker/sql/001_initial.sql・002_session_lifecycle.sql ／ credential_broker/service.py・store.py</text>
</svg>
