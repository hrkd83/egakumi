<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1280" viewBox="0 0 1600 1280" role="img" aria-labelledby="title desc">
<title id="title">外向き通信・Azure管理・DNSの補助経路</title><desc id="desc">各段のFirewall、AppGW、APIM、ACAは主図と同じリソース。公開宛通信はAPIM・管理VM・ACAの既定経路で同じFirewallへ。AppGWの通常Internet、Key Vault PE、Azure APIM管理はFirewallを経由しない。DNSはAzure提供DNSとPrivate DNSにより名前を接続先IPへ解決し、すべてのDNSがFirewallを通るわけではない。</desc>
<defs><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#2c6a50"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#376d8c"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#87988d"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;fill:#244c40}.title{font-size:32px;font-weight:700}.head{font-size:27px;font-weight:650}.label{font-size:23px;font-weight:600}.copy{font-size:22px;fill:#617462}.small{font-size:21px;fill:#617462}.blueText{fill:#376d8c}.greenText{fill:#2c6a50}.mono{font-family:ui-monospace,Menlo,Consolas,monospace}.node{fill:#fffefa;stroke:#b6c8ad;stroke-width:2}.firewall{fill:#e6efdd;stroke:#819d73;stroke-width:2}.policy{fill:#f2ead9;stroke:#b99c6b;stroke-width:2}.outside{fill:#f5f4ee;stroke:#bdc3b6;stroke-width:2}.direct{fill:none;stroke:#376d8c;stroke-width:3;stroke-dasharray:9 6;marker-end:url(#blue)}.via{fill:none;stroke:#2c6a50;stroke-width:3.5;marker-start:url(#green);marker-end:url(#green)}.private{fill:none;stroke:#87988d;stroke-width:2;marker-end:url(#gray)}.association{stroke:#9b835a;stroke-width:2;stroke-dasharray:4 4;fill:none}</style>
<rect width="1600" height="1280" fill="#fffefa"/>
<text x="26" y="43" class="title" text-anchor="start">外向き通信・Azure管理・DNSの補助経路</text>
<text x="26" y="84" class="copy" text-anchor="start">各段のFirewall・AppGW・APIM・ACAは、主図と同じリソースです。段ごとに複製配置する意味ではありません。</text>
<path d="M30 119H100" class="via"/>
<text x="118" y="127" class="copy" text-anchor="start">緑：同一Firewallを経由</text>
<path d="M550 119H620" class="direct"/>
<text x="638" y="127" class="copy" text-anchor="start">青破線：Firewallを通らない</text>
<rect x="24" y="151" width="1552" height="211" rx="8" class="outside"/>
<text x="43" y="186" class="label" text-anchor="start">E1  公開依存先への外向き通信</text>
<rect x="45" y="211" width="302" height="127" rx="8" class="node"/>
<text x="63" y="250" class="head" text-anchor="start">APIM / 管理VM / ACA</text>
<text x="63" y="289" class="copy" text-anchor="start">より具体的な経路がない</text>
<text x="63" y="320" class="copy" text-anchor="start">公開宛通信</text>
<rect x="655" y="211" width="266" height="127" rx="8" class="firewall"/>
<text x="673" y="250" class="head" text-anchor="start">同一Firewall</text>
<text x="673" y="289" class="copy" text-anchor="start">Network：タグ・ポート</text>
<text x="673" y="320" class="copy" text-anchor="start">Application：許可FQDN</text>
<rect x="1205" y="211" width="348" height="127" rx="8" class="node"/>
<text x="1223" y="250" class="head" text-anchor="start">公開依存先・外部API</text>
<text x="1223" y="289" class="copy" text-anchor="start">認証・監視・更新・ビルド</text>
<text x="1223" y="320" class="copy" text-anchor="start">必要な接続先を許可</text>
<path d="M355 263H647" class="via"/>
<text x="500" y="246" class="label greenText" text-anchor="middle">UDR 0.0.0.0/0</text>
<path d="M929 263H1197" class="via"/>
<text x="1062" y="246" class="label greenText" text-anchor="middle">ポリシーで判定</text>
<rect x="24" y="379" width="1552" height="211" rx="8" class="outside"/>
<text x="43" y="414" class="label" text-anchor="start">E2  Portalサーバーから公開Gatewayへ</text>
<rect x="45" y="439" width="246" height="126" rx="8" class="node"/>
<text x="63" y="478" class="head" text-anchor="start">ACA / Portal</text>
<text x="63" y="517" class="copy" text-anchor="start">RT：aca</text>
<text x="63" y="548" class="copy" text-anchor="start">NSGなし</text>
<rect x="510" y="439" width="266" height="126" rx="8" class="firewall"/>
<text x="528" y="478" class="head" text-anchor="start">同一Firewall</text>
<text x="528" y="517" class="copy" text-anchor="start">aca-public-gateway-</text>
<text x="528" y="548" class="copy" text-anchor="start">https / FQDN許可</text>
<rect x="1020" y="439" width="260" height="126" rx="8" class="node"/>
<text x="1038" y="478" class="head" text-anchor="start">公開AppGW</text>
<text x="1038" y="517" class="copy" text-anchor="start">NSG：agw</text>
<text x="1038" y="548" class="copy" text-anchor="start">HTTPS 443</text>
<path d="M299 491H502" class="via"/>
<text x="400" y="475" class="label greenText" text-anchor="middle">UDR 0/0</text>
<path d="M784 491H1012" class="via"/>
<text x="898" y="475" class="label greenText" text-anchor="middle">HTTPS 443</text>
<text x="1310" y="478" class="copy" text-anchor="start">以降の内部中継は</text>
<text x="1310" y="512" class="copy" text-anchor="start">主図の経路へ</text>
<rect x="24" y="607" width="1552" height="237" rx="8" class="outside"/>
<text x="43" y="642" class="label" text-anchor="start">E3  AppGWの直接経路</text>
<rect x="45" y="686" width="302" height="126" rx="8" class="node"/>
<text x="63" y="725" class="head" text-anchor="start">AppGW</text>
<text x="63" y="764" class="copy" text-anchor="start">NSG：agw / RT：agw</text>
<text x="63" y="795" class="copy" text-anchor="start">FW向け0/0は追加しない</text>
<rect x="695" y="670" width="378" height="90" rx="8" class="node"/>
<text x="713" y="709" class="head" text-anchor="start">Key Vault PE</text>
<text x="713" y="748" class="copy" text-anchor="start">NSG agw送信・pep受信</text>
<rect x="695" y="772" width="378" height="56" rx="8" class="node"/>
<text x="713" y="811" class="head" text-anchor="start">Internet・Azure基盤</text>
<path d="M355 718H687" class="direct"/>
<text x="520" y="701" class="label blueText" text-anchor="middle">TCP 443 / PE経路</text>
<path d="M355 800H687" class="direct"/>
<text x="520" y="771" class="label blueText" text-anchor="middle">通常のInternet出口</text>
<text x="1110" y="704" class="copy" text-anchor="start">証明書取得はPEへ直接。</text>
<text x="1110" y="740" class="copy" text-anchor="start">通常の管理・制御通信も</text>
<text x="1110" y="776" class="copy" text-anchor="start">Firewallへ一律転送しない。</text>
<rect x="24" y="861" width="1552" height="237" rx="8" class="outside"/>
<text x="43" y="896" class="label" text-anchor="start">E4  Azure APIM管理系の直接経路</text>
<rect x="45" y="939" width="350" height="132" rx="8" class="node"/>
<text x="63" y="978" class="head" text-anchor="start">Azure APIM管理基盤</text>
<text x="63" y="1017" class="copy" text-anchor="start">ApiManagementタグ</text>
<text x="63" y="1048" class="copy" text-anchor="start">利用者のAPI入口とは別</text>
<rect x="1120" y="939" width="330" height="132" rx="8" class="node"/>
<text x="1138" y="978" class="head" text-anchor="start">APIM</text>
<text x="1138" y="1017" class="copy" text-anchor="start">NSG受信：TCP 3443</text>
<text x="1138" y="1048" class="copy" text-anchor="start">RT：apim</text>
<path d="M403 973H1112" class="direct"/>
<text x="757" y="956" class="label blueText" text-anchor="middle">管理要求 TCP 3443 / NSGで送信元を限定</text>
<path d="M1112 1038H403" class="direct"/>
<text x="757" y="1020" class="label blueText" text-anchor="middle">復路UDR：ApiManagement → Internet</text>
<rect x="24" y="1115" width="1552" height="143" rx="8" class="node"/>
<text x="43" y="1151" class="label" text-anchor="start">DNSは経路選択の前提。全問い合わせをFirewallへ送る構成ではない。</text>
<text x="43" y="1188" class="copy" text-anchor="start">公開例 network.dnsServers=[] はAzure提供DNS。VNetにリンクしたPrivate DNSで、対象FQDNをPEの実IPへ解決する。</text>
<text x="43" y="1224" class="copy" text-anchor="start">FirewallのDNS proxy有効化は、VNetのDNSを自動的にFirewall IPへ変える設定ではない。詳細はDNS・PEの節を参照。</text>
</svg>
