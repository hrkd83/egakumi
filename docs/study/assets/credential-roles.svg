<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="886" viewBox="0 0 1120 886" role="img" aria-labelledby="credential-roles-title credential-roles-desc">
<title id="credential-roles-title">APIキー・接続証明・アクセストークンの発行、保存、検証</title>
<desc id="credential-roles-desc">Graph本人接続の実装。APIキーはPortalの依頼でAPIMが生成し、実値をAPIMに保持してAPIMでAPIMサブスクリプションを検証する。接続証明はBrokerが生成し、呼出元バックエンドが実値を保持する。PortalではSQLに暗号化保存し、Broker SQLは秘密のハッシュと本人・APIMサブスクリプション・接続・期限を持ち、Brokerで照合する。アクセストークンはMicrosoft Entra IDが発行し、CMがアクセス・更新トークンを保持・更新する。APIMが取得してGraphへ送り、Graphが有効性と権限を検証する。APIMはGraphの本人照会結果をBrokerの本人と照合する。各行の矢印は発行、保存、検証の段階を表す。</desc>
<defs><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;fill:#223831}
.canvas{fill:#fffefa}.title{font-size:24px;font-weight:700}.subtitle{font-size:15px;fill:#66766d}
.column{font-size:17px;font-weight:650;fill:#536c5e}.card{fill:#fffefa;stroke:#d2ded1;stroke-width:1.3}
.node{font-size:20px;font-weight:650}.body{font-size:17px}.small{font-size:15px;fill:#617367}
.label{font-size:21px;font-weight:700}.purpose{font-size:16px;fill:#596e62}
.arrow{fill:none;stroke:#9cae9c;stroke-width:1.5}.flow{font-size:18px;font-weight:650}.flow-value{font-size:17px}
</style><marker id="credential-stage-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#9cae9c" stroke-width="1.4"/></marker></defs>
<rect class="canvas" width="1120" height="886" rx="8"/>
<text class="title" x="24" y="37">APIキー・接続証明・アクセストークンの役割</text>
<text class="subtitle" x="24" y="65">Graphの本人接続で使う3つの情報 / 矢印は発行 → 保存 → 検証の段階</text>
<text class="column" x="24" y="112">情報と目的</text>
<text class="column" x="184" y="112">発行する場所</text>
<text class="column" x="444" y="112">保存する場所</text>
<text class="column" x="764" y="112">要求時に確認する場所</text>

<g aria-label="APIMサブスクリプションキーの発行・保存・検証">
<rect x="24" y="138" width="140" height="166" rx="7" fill="#eaf3e9"/>
<rect x="24" y="148" width="4" height="146" fill="#357965"/>
<text class="label" x="38" y="172">APIM</text>
<text class="purpose" x="38" y="199" style="font-size:12px">サブスクリプション</text>
<text class="label" x="38" y="225">キー</text>
<text class="purpose" x="38" y="264">Gatewayの</text>
<text class="purpose" x="38" y="287">利用許可</text>
<rect class="card" x="184" y="138" width="240" height="166" rx="7"/>
<path d="M192 138H416" fill="none" stroke="#357965" stroke-width="3"/>
<text class="node" x="199" y="170">APIM</text>
<text class="body" x="199" y="202">PortalがARMで作成依頼</text>
<text class="body" x="199" y="226" style="font-size:16px"><tspan x="199">APIMサブスクリプションを</tspan><tspan x="199" dy="23">作成すると生成</tspan></text>
<text class="body" x="199" y="277">primary / secondary</text>
<rect class="card" x="444" y="138" width="300" height="166" rx="7"/>
<path d="M452 138H736" fill="none" stroke="#357965" stroke-width="3"/>
<text class="node" x="459" y="170">APIM / 呼出アプリ</text>
<text class="body" x="459" y="202">APIM：キーの実値を保持</text>
<text class="body" x="459" y="227">呼出アプリが受領・保管</text>
<text class="body" x="459" y="249" style="font-size:15px"><tspan x="459">Portal SQL：</tspan><tspan x="459" dy="22">APIMサブスクリプションの台帳・属性</tspan></text>
<text class="small" x="459" y="292">SQLにキーの実値は保存しない</text>
<rect class="card" x="764" y="138" width="332" height="166" rx="7"/>
<path d="M772 138H1088" fill="none" stroke="#357965" stroke-width="3"/>
<text class="node" x="779" y="170">APIM</text>
<text class="body" x="779" y="200" style="font-size:15px"><tspan x="779">キーとAPIMサブスクリプション状態を検証</tspan><tspan x="779" dy="23">製品・APIの利用許可を確認</tspan><tspan x="779" dy="23">検証済みAPIMサブスクリプションIDを</tspan><tspan x="779" dy="23">Brokerへ渡す</tspan></text>
<path class="arrow" marker-end="url(#credential-stage-arrow)" d="M425 221.0H442"/>
<path class="arrow" marker-end="url(#credential-stage-arrow)" d="M745 221.0H762"/>
</g>
<g aria-label="接続証明の発行・保存・検証">
<rect x="24" y="324" width="140" height="192" rx="7" fill="#edf3f7"/>
<rect x="24" y="334" width="4" height="172" fill="#477a93"/>
<text class="label" x="38" y="358">接続証明</text>
<text class="purpose" x="38" y="395" style="font-size:12px"><tspan x="38">本人とAPIM</tspan><tspan x="38" dy="21">サブスクリプション</tspan><tspan x="38" dy="21">に結び付く接続</tspan></text>
<rect class="card" x="184" y="324" width="240" height="192" rx="7"/>
<path d="M192 324H416" fill="none" stroke="#477a93" stroke-width="3"/>
<text class="node" x="199" y="356">Credential Broker</text>
<text class="body" x="199" y="388">ランダムな秘密を生成</text>
<text class="body" x="199" y="413">初回は仮証明として発行</text>
<text class="body" x="199" y="438">本人認証完了で有効化</text>
<text class="body" x="199" y="463">定期更新の候補も生成</text>
<rect class="card" x="444" y="324" width="300" height="192" rx="7"/>
<path d="M452 324H736" fill="none" stroke="#477a93" stroke-width="3"/>
<text class="node" x="459" y="356">呼出アプリ / Broker SQL</text>
<text class="body" x="459" y="388">呼出元Backend：実値</text>
<text class="body" x="459" y="413">Portal SQLでは暗号化</text>
<text class="body" x="459" y="438">Broker SQL：秘密のハッシュ</text>
<text class="body" x="459" y="462" style="font-size:15px"><tspan x="459">APIMサブスクリプション・本人・接続・</tspan><tspan x="459" dy="23">期限も保持</tspan></text>
<rect class="card" x="764" y="324" width="332" height="192" rx="7"/>
<path d="M772 324H1088" fill="none" stroke="#477a93" stroke-width="3"/>
<text class="node" x="779" y="356">Broker ＋ SQL</text>
<text class="body" x="779" y="388">秘密のハッシュを照合</text>
<text class="body" x="779" y="412" style="font-size:15px"><tspan x="779">APIMサブスクリプション・本人・CM接続</tspan><tspan x="779" dy="23">を照合。有効期限・失効状態を確認</tspan></text>
<text class="body" x="779" y="477">APIMがBrokerへ照会</text>
<path class="arrow" marker-end="url(#credential-stage-arrow)" d="M425 420.0H442"/>
<path class="arrow" marker-end="url(#credential-stage-arrow)" d="M745 420.0H762"/>
</g>
<g aria-label="アクセスの発行・保存・検証">
<rect x="24" y="536" width="140" height="192" rx="7" fill="#f7f1e5"/>
<rect x="24" y="546" width="4" height="172" fill="#9a7846"/>
<text class="label" x="38" y="570">アクセス</text>
<text class="label" x="38" y="599">トークン</text>
<text class="purpose" x="38" y="644">Graphを呼ぶ</text>
<text class="purpose" x="38" y="668">ための権限</text>
<rect class="card" x="184" y="536" width="240" height="192" rx="7"/>
<path d="M192 536H416" fill="none" stroke="#9a7846" stroke-width="3"/>
<text class="node" x="199" y="568">Microsoft Entra ID</text>
<text class="body" x="199" y="600">本人の認証・同意後に発行</text>
<text class="body" x="199" y="625">CMが取得する</text>
<text class="body" x="199" y="650">更新時もEntraへ要求</text>
<rect class="card" x="444" y="536" width="300" height="192" rx="7"/>
<path d="M452 536H736" fill="none" stroke="#9a7846" stroke-width="3"/>
<text class="node" x="459" y="568">Credential Manager</text>
<text class="body" x="459" y="600">アクセス・更新トークンを保存</text>
<text class="body" x="459" y="625">必要な再取得・更新を管理</text>
<text class="body" x="459" y="650">APIMが取得しGraphへ送信</text>
<rect class="card" x="764" y="536" width="332" height="192" rx="7"/>
<path d="M772 536H1088" fill="none" stroke="#9a7846" stroke-width="3"/>
<text class="node" x="779" y="568">Microsoft Graph</text>
<text class="body" x="779" y="600">トークンの有効性・権限を検証</text>
<text class="body" x="779" y="625">APIMは /me の応答を使い</text>
<text class="body" x="779" y="650">Broker登録の本人と照合</text>
<path class="arrow" marker-end="url(#credential-stage-arrow)" d="M425 632.0H442"/>
<path class="arrow" marker-end="url(#credential-stage-arrow)" d="M745 632.0H762"/>
</g>
<text class="column" x="24" y="765">要求で送る情報</text>
<rect x="24" y="780" width="510" height="80" rx="7" fill="#edf3e9"/>
<text class="flow" x="40" y="808">呼出アプリ → APIM</text>
<text class="flow-value" x="40" y="837">APIMサブスクリプションキー ＋ 接続証明</text>
<rect x="550" y="780" width="546" height="80" rx="7" fill="#f7f1e5"/>
<text class="flow" x="566" y="808">APIM → Microsoft Graph</text>
<text class="flow-value" x="566" y="837">Authorization: Bearer アクセストークン</text>
</svg>
