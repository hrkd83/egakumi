<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="648" viewBox="0 0 1200 648" role="img" aria-labelledby="credential-pool-title credential-pool-desc">
<title id="credential-pool-title">CM接続の割当と容量を、一緒に管理する</title>
<desc id="credential-pool-desc">PoolsはProfileNameとProviderNameを主キーに物理CM providerの容量と予約数を管理する。ConnectionsはTenantId、ObjectId、ProfileNameを主キーに本人のCM接続を保持し、ProfileNameとProviderNameの複合外部キーでPoolsを参照する。接続予約と予約数の加算を同じSQLトランザクションで行い、削除完了を確認してから容量を解放する。</desc>
<defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;fill:#1e302d}.canvas{fill:#fffefa}.card{fill:#fffefa;stroke:#cad9cc;stroke-width:1.3}.head{fill:#eaf2e9}.rule{stroke:#d4e0d7;stroke-width:1}.title{font-size:22px;font-weight:700}.subtitle{font-size:13px;fill:#63716c}.table{font-family:Consolas,monospace;font-size:16px;font-weight:700}.purpose{font-size:12px;fill:#52675c}.field{font-family:Consolas,monospace;font-size:13px}.note{font-size:12px;fill:#63716c}.small{font-size:11px;fill:#63716c}.relation{font-size:12px;fill:#006b5e}.fk{fill:none;stroke:#607f73;stroke-width:1.8}.logical{fill:none;stroke:#84968b;stroke-width:1.7;stroke-dasharray:7 5}</style>
<marker id="credential-pool-fk-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#607f73" stroke-width="1.3"/></marker>
<marker id="credential-pool-logical-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#84968b" stroke-width="1.3"/></marker></defs>
<rect class="canvas" width="1200" height="648" rx="8"/>
<text class="title" x="40" y="36">CM接続の割当と容量を、一緒に管理する</text>
<text class="subtitle" x="40" y="63">プールと本人接続の2表 / 物理FKはPoolsからConnectionsへの1本</text>
<path class="fk" marker-end="url(#credential-pool-fk-arrow)" d="M490 295H710"/>
<text class="relation" x="600" y="267" text-anchor="middle">1 → 0..N</text>
<text class="relation" x="600" y="323" text-anchor="middle">ProfileName +</text>
<text class="relation" x="600" y="346" text-anchor="middle">ProviderName</text>
<g aria-label="broker.Pools：物理CM providerの予約容量を管理">
<rect class="card" x="40" y="125" width="450" height="345" rx="7"/>
<path class="head" d="M47 125H483a7 7 0 0 1 7 7V189H40V132a7 7 0 0 1 7-7Z"/>
<text class="table" x="58" y="152">broker.Pools</text>
<text class="purpose" x="58" y="175">目的：物理CM providerの予約容量を管理</text>
<path class="rule" d="M40 189H490"/>
<text class="field" x="58" y="219">PK (ProfileName, ProviderName)</text>
<text class="field" x="58" y="243">UQ ProviderName</text>
<text class="field" x="58" y="267">Capacity / Allocated</text>
<text class="field" x="58" y="291">Enabled / AllocationBlocked</text>
<text class="field" x="58" y="315">Version（rowversion）</text>
<text class="small" x="58" y="435">新規割当は有効・未隔離・空きありのpoolから選ぶ。</text>
<text class="small" x="58" y="454">使用率が低いpoolを優先して予約する。</text>
</g>
<g aria-label="broker.Connections：本人ごとのCM接続と作業状態を保持">
<rect class="card" x="710" y="125" width="450" height="345" rx="7"/>
<path class="head" d="M717 125H1153a7 7 0 0 1 7 7V189H710V132a7 7 0 0 1 7-7Z"/>
<text class="table" x="728" y="152">broker.Connections</text>
<text class="purpose" x="728" y="175">目的：本人ごとのCM接続と作業状態を保持</text>
<path class="rule" d="M710 189H1160"/>
<text class="field" x="728" y="219">PK (TenantId, ObjectId, ProfileName)</text>
<text class="field" x="728" y="243">UQ (ProviderName, ConnectionId)</text>
<text class="field" x="728" y="267">FK (ProfileName, ProviderName)</text>
<text class="field" x="728" y="291">State / SecurityEpoch</text>
<text class="field" x="728" y="315">LeaseOwner / LeaseUntil</text>
<text class="field" x="728" y="339">Version（rowversion）</text>
<text class="small" x="728" y="454">1つの本人・profileに、1つのCM接続を割り当てる。</text>
</g>
<path class="rule" d="M40 489H1160"/>
<path class="fk" marker-end="url(#credential-pool-fk-arrow)" d="M40 510H110"/>
<text class="note" x="125" y="514">実線：親 → 子の物理外部キー（FK）</text>
<path class="logical" marker-end="url(#credential-pool-logical-arrow)" d="M570 510H640"/>
<text class="note" x="655" y="514">破線：アプリ側の照合（この図の関係は実線のみ）</text>
<text class="small" x="40" y="541">PK：主キー　UQ：一意制約　／　broker. はSQLスキーマ名</text>
<text class="note" x="40" y="570">新しい接続行とAllocatedの加算は、同じSQLトランザクションで確定。CMリソースの作成はその後に行う。</text>
<text class="note" x="40" y="596">解除は先にdeletingへ変更。CMのGETが404になったことを確認してから、接続行の削除と容量解放を確定する。</text>
<text class="small" x="40" y="624">出典：credential-broker/sql/001_initial.sql（AllocateConnection）／ credential_broker/store.py・cm.py</text>
</svg>
