<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="er-title er-desc">
  <title id="er-title">APIMサブスクリプション管理の主要5テーブルのER図</title>
  <desc id="er-desc">Entraグループを表すportalApiKeyGroupは、グループと製品の承認を表すportalApiKeyProductを0件以上持つ。承認1件はportalApiKeyを0件以上持つ。各キーの所有グループと製品は、tenantId、groupId、productIdの複合外部キーで指定する。会社マスタportalCompanyはキーを0件以上持ち、各キーに関連する会社は0件または1件。会社と所有グループの間に直接の外部キーはない。キー1件はportalApiKeyAuditを0件以上持つ。portalApiKeyProductはSQL上の承認表であり、Azure API Managementの製品リソース自体ではない。APIMの秘密キー値はSQLに保存しない。図は主要な列だけを示す。</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif; }
      .canvas { fill: #fffefa; }
      .card { fill: #fffefa; stroke: #d4e0d7; stroke-width: 1.3; }
      .card-head { fill: #edf5f0; }
      .key-head { fill: #006b5e; }
      .rule { stroke: #d4e0d7; stroke-width: 1; }
      .title { fill: #1e302d; font-size: 18px; font-weight: 650; letter-spacing: -.3px; }
      .table-name { fill: #1e302d; font-size: 16px; font-weight: 650; }
      .table-note { fill: #63716c; font-size: 10.5px; }
      .key-name { fill: #fffefa; }
      .key-note { fill: #d4e9de; }
      .field { fill: #334b43; font-family: "SFMono-Regular", Consolas, monospace; font-size: 12px; }
      .field-note { fill: #63716c; font-size: 11px; }
      .badge { fill: #006b5e; font-family: "SFMono-Regular", Consolas, monospace; font-size: 10px; font-weight: 650; }
      .edge { fill: none; stroke: #739784; stroke-width: 1.5; }
      .cardinality { fill: #006b5e; font-family: "SFMono-Regular", Consolas, monospace; font-size: 11px; font-weight: 650; }
      .relation { fill: #63716c; font-size: 10.5px; }
      .legend { fill: #63716c; font-size: 10.5px; }
      .note { fill: #006b5e; font-size: 10.5px; font-weight: 550; }
    </style>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 6 3-6 3" fill="none" stroke="#739784" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect class="canvas" width="1100" height="650" rx="8"/>
  <text class="title" x="40" y="32">所有グループ・製品承認・APIMサブスクリプション台帳・会社・監査</text>
  <text class="legend" x="1060" y="31" text-anchor="end">主要5テーブル / 列を抜粋</text>

  <!-- 親から子に向かう矢印。数値は各端点の多重度。 -->
  <path class="edge" d="M320 164H399" marker-end="url(#arrow)"/>
  <text class="cardinality" x="333" y="151">1</text>
  <text class="cardinality" x="388" y="151" text-anchor="end">0..N</text>
  <text class="relation" x="360" y="187" text-anchor="middle">製品承認</text>

  <path class="edge" d="M565 260V339" marker-end="url(#arrow)"/>
  <text class="cardinality" x="576" y="280">1</text>
  <text class="cardinality" x="576" y="326">0..N</text>
  <text class="relation" x="550" y="305" text-anchor="end">所有グループ × 製品</text>

  <path class="edge" d="M930 260V295H766V464H731" marker-end="url(#arrow)"/>
  <text class="cardinality" x="942" y="281">0..1</text>
  <text class="relation" x="914" y="281" text-anchor="end">キーごとの会社</text>
  <text class="cardinality" x="754" y="451" text-anchor="end">0..N</text>
  <text class="relation" x="782" y="322">会社属性</text>

  <path class="edge" d="M730 540H799" marker-end="url(#arrow)"/>
  <text class="cardinality" x="740" y="527">1</text>
  <text class="cardinality" x="789" y="527" text-anchor="end">0..N</text>

  <!-- Entraグループの観測・承認台帳 -->
  <g aria-label="portalApiKeyGroup、Entra所有グループ">
    <rect class="card" x="40" y="70" width="280" height="190" rx="7"/>
    <path class="card-head" d="M47 70h266a7 7 0 0 1 7 7v50H40V77a7 7 0 0 1 7-7Z"/>
    <text class="table-name" x="58" y="95">portalApiKeyGroup</text>
    <text class="table-note" x="58" y="114">目的：所有グループの登録・状態を管理</text>
    <path class="rule" d="M40 127H320"/>
    <text class="field" x="58" y="152">tenantId</text><text class="badge" x="302" y="152" text-anchor="end">PK</text>
    <text class="field" x="58" y="178">groupId</text><text class="badge" x="302" y="178" text-anchor="end">PK</text>
    <text class="field" x="58" y="204">displayName</text>
    <text class="field" x="58" y="230">directoryStatus</text>
  </g>

  <!-- この表はAPIM Productそのものではなく、SQL上の承認 -->
  <g aria-label="portalApiKeyProduct、グループ別の製品承認">
    <rect class="card" x="400" y="70" width="330" height="190" rx="7"/>
    <path class="card-head" d="M407 70h316a7 7 0 0 1 7 7v50H400V77a7 7 0 0 1 7-7Z"/>
    <text class="table-name" x="418" y="95">portalApiKeyProduct</text>
    <text class="table-note" x="418" y="114">目的：グループ別の製品承認・発行枠を管理</text>
    <path class="rule" d="M400 127H730"/>
    <text class="field" x="418" y="152">tenantId</text><text class="badge" x="712" y="152" text-anchor="end">PK / FK</text>
    <text class="field" x="418" y="178">groupId</text><text class="badge" x="712" y="178" text-anchor="end">PK / FK</text>
    <text class="field" x="418" y="204">productId</text><text class="badge" x="712" y="204" text-anchor="end">PK</text>
    <text class="field" x="418" y="230">maxSubscriptions</text>
  </g>

  <!-- 会社は所有権とは別の、統計・分類用属性 -->
  <g aria-label="portalCompany、会社マスタ">
    <rect class="card" x="800" y="70" width="260" height="190" rx="7"/>
    <path class="card-head" d="M807 70h246a7 7 0 0 1 7 7v50H800V77a7 7 0 0 1 7-7Z"/>
    <text class="table-name" x="818" y="95">portalCompany</text>
    <text class="table-note" x="818" y="114">目的：費用帰属の分類に使う会社を管理</text>
    <path class="rule" d="M800 127H1060"/>
    <text class="field" x="818" y="152">tenantId</text><text class="badge" x="1042" y="152" text-anchor="end">PK</text>
    <text class="field" x="818" y="178">id</text><text class="badge" x="1042" y="178" text-anchor="end">PK</text>
    <text class="field" x="818" y="204">name</text>
    <text class="field" x="818" y="230">isActive</text>
  </g>

  <!-- 主役のAPIMサブスクリプション台帳。秘密キー値の列は存在しない -->
  <g aria-label="portalApiKey、秘密値を含まないAPIMサブスクリプション台帳">
    <rect class="card" x="400" y="340" width="330" height="245" rx="7"/>
    <path class="key-head" d="M407 340h316a7 7 0 0 1 7 7v50H400v-50a7 7 0 0 1 7-7Z"/>
    <text class="table-name key-name" x="418" y="365">portalApiKey</text>
    <text class="table-note key-note" x="418" y="382"><tspan x="418">目的：所有組織・会社と</tspan><tspan x="418" dy="12">APIMサブスクリプションを対応付ける</tspan></text>
    <text class="field" x="418" y="420">id</text><text class="badge" x="712" y="420" text-anchor="end">PK</text>
    <text class="field" x="418" y="446">tenantId</text><text class="badge" x="712" y="446" text-anchor="end">FK</text>
    <text class="field" x="418" y="472">groupId, productId</text><text class="badge" x="712" y="472" text-anchor="end">FK</text>
    <text class="field" x="418" y="498">companyId</text><text class="badge" x="712" y="498" text-anchor="end">FK / NULL可</text>
    <text class="field" x="418" y="524">apimSubscriptionId</text><text class="badge" x="712" y="524" text-anchor="end">UQ ※</text>
    <text class="field-note" x="418" y="552">state / lastReviewedAt / 用途・連絡先など</text>
    <text class="table-note" x="418" y="572">※ tenantId と組み合わせて一意</text>
  </g>

  <!-- 棚卸を含む操作監査 -->
  <g aria-label="portalApiKeyAudit、APIMサブスクリプションの操作履歴">
    <rect class="card" x="800" y="385" width="260" height="200" rx="7"/>
    <path class="card-head" d="M807 385h246a7 7 0 0 1 7 7v50H800v-50a7 7 0 0 1 7-7Z"/>
    <text class="table-name" x="818" y="410">portalApiKeyAudit</text>
    <text class="table-note" x="818" y="429">目的：発行・表示・停止・棚卸を記録</text>
    <path class="rule" d="M800 442H1060"/>
    <text class="field" x="818" y="466">id</text><text class="badge" x="1042" y="466" text-anchor="end">PK</text>
    <text class="field" x="818" y="491">tenantId, apiKeyId</text><text class="badge" x="1042" y="491" text-anchor="end">FK</text>
    <text class="field" x="818" y="516">action, state</text>
    <text class="field" x="818" y="541">actorObjectId</text>
    <text class="field" x="818" y="566">recordedAt</text>
  </g>

  <g aria-label="関係の読み方">
    <text class="field-note" x="40" y="368">関係の読み方</text>
    <path class="rule" d="M40 381H305"/>
    <text class="legend" x="40" y="405">PK：主キー　FK：外部キー</text>
    <text class="legend" x="40" y="429">1：必ず1件　0..N：0件以上</text>
    <text class="legend" x="40" y="453">0..1：未登録、または1件</text>
    <text class="legend" x="40" y="489">複合キーは、同じ tenantId の中で関連付ける。</text>
    <text class="legend" x="40" y="513">会社と Entra グループに直接の FK はない。</text>
    <text class="legend" x="40" y="537">通常の新規発行は会社必須。</text>
    <text class="legend" x="40" y="557">移行済みの既存キーでは NULL を許容する。</text>
  </g>

  <path class="rule" d="M40 609H1060"/>
  <text class="legend" x="40" y="631">出典：SQL 002・004・007・008 / 図1：主要5表。残る14表は補助ER・隣接ERで示す。</text>
  <text class="note" x="1060" y="631" text-anchor="end">秘密値の保管・検証は APIM</text>
</svg>
