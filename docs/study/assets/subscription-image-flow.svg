<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="590" viewBox="0 0 1300 590" role="img" aria-labelledby="image-title image-desc">
  <title id="image-title">管理VMからACRへ登録し、Container Apps基盤がイメージを取得して起動する</title>
  <desc id="image-desc">Linux管理VMがPortalイメージをビルドしてACRへPushする。Azure Container Apps基盤がACRから同じportalイメージのdigestを取得し、Portal Container AppとSQL初期化Job、所有グループ観測Jobを起動する。Portalと観測Jobの取得IDはruntimeIdentity、SQL初期化JobはschemaIdentity。SQLはイメージ取得の経路に介在しない。</desc>
  <defs>
    <marker id="image-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#6b8972" stroke-width="1.2"/></marker>
    <style>
      text{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;fill:#1e302d}
      .title{font-size:21px;font-weight:700;letter-spacing:-.4px}.subtitle{font-size:13px;fill:#687a6c}.head{font-size:18px;font-weight:650}.small{font-size:13px;fill:#617568}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;fill:#5a7663}.tag{font-size:10px;letter-spacing:1px;fill:#006b5e;font-weight:650}.node{fill:#fffefa;stroke:#d4dfcf;stroke-width:1.4}.group{fill:#edf5eb;stroke:#b3c9a8;stroke-dasharray:7 4;stroke-width:1.5}.primary{fill:#164c43;stroke:#164c43}.white{fill:#fffefa}.light{fill:#c5d8bd}.route{fill:none;stroke:#6b8972;stroke-width:1.8;marker-end:url(#image-arrow)}.label{font-size:12px;fill:#60785c;paint-order:stroke;stroke:#fffefa;stroke-width:5px;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1300" height="590" rx="8" fill="#fffefa"/>
  <text class="title" x="30" y="36">イメージ配布は、管理VM → ACR → Container Apps。</text>
  <text class="subtitle" x="30" y="63">ACRはコンテナイメージを保管する。SQLは、起動したアプリが台帳・監査などを読み書きする別の接続先。</text>

  <rect class="group" x="630" y="92" width="640" height="428" rx="9"/>
  <text class="tag" x="651" y="118">AZURE CONTAINER APPS / イメージ取得と実行単位の起動</text>

  <rect class="node" x="30" y="235" width="235" height="140" rx="6"/>
  <text class="tag" x="48" y="262">BUILD / DEPLOYMENT</text>
  <text class="head" x="48" y="291">Linux管理VM</text>
  <text class="small" x="48" y="319">PortalイメージをDocker build</text>
  <text class="small" x="48" y="344">一時AcrPush権限で登録</text>

  <rect class="node" x="345" y="235" width="220" height="140" rx="6"/>
  <text class="tag" x="363" y="262">IMAGE REGISTRY</text>
  <text class="head" x="363" y="291">非公開ACR</text>
  <text class="mono" x="363" y="319">portal@imageDigest</text>
  <text class="small" x="363" y="344">同じイメージを3用途で共用</text>

  <rect class="node primary" x="660" y="235" width="230" height="140" rx="6"/>
  <text class="tag light" x="678" y="262">PLATFORM / PULL</text>
  <text class="head white" x="678" y="291">Container Apps基盤</text>
  <text class="small light" x="678" y="319">各実行単位のレジストリ設定で</text>
  <text class="small light" x="678" y="344">指定した認証IDで取得・起動</text>

  <path class="route" d="M265 305H345"/>
  <text class="label" x="305" y="286" text-anchor="middle">Push</text>
  <path class="route" d="M565 305H660"/>
  <text class="label" x="612" y="286" text-anchor="middle">Pull</text>
  <text class="subtitle" x="612" y="211" text-anchor="middle">SQLは通らない</text>

  <rect class="node" x="950" y="140" width="295" height="100" rx="6"/>
  <text class="head" x="968" y="167">Portal Container App</text>
  <text class="mono" x="968" y="192">ca-${stem}-portal</text>
  <text class="small" x="968" y="216">イメージ取得ID：runtimeIdentity</text>

  <rect class="node" x="950" y="265" width="295" height="100" rx="6"/>
  <text class="head" x="968" y="292">SQL初期化Job</text>
  <text class="mono" x="968" y="317">caj-${stem}-portal-schema</text>
  <text class="small" x="968" y="341">イメージ取得ID：schemaIdentity</text>

  <rect class="node" x="950" y="390" width="295" height="100" rx="6"/>
  <text class="head" x="968" y="417">所有グループ観測Job</text>
  <text class="mono" x="968" y="442">caj-${stem}-portal-groups</text>
  <text class="small" x="968" y="466">イメージ取得ID：runtimeIdentity</text>

  <path class="route" d="M890 305H920V190H950"/>
  <path class="route" d="M890 305H935V315H950"/>
  <path class="route" d="M890 305H920V440H950"/>

  <text class="subtitle" x="30" y="548">矢印はイメージの配布・起動の関係。SQLへのデータ接続は前の実行構成図で示す。</text>
  <text class="mono" x="30" y="575">出典：application.bicep:56 / schema-job.bicep:64 / group-reconciliation-job.bicep:32</text>
</svg>
