<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1300" viewBox="0 0 1600 1300" role="img" aria-labelledby="broker-er-title broker-er-desc">
<title id="broker-er-title">Credential Brokerの全7テーブルと物理・論理の関連</title>
<desc id="broker-er-desc">SQLマイグレーション002適用後の全7表を示す。物理外部キーはConnectionsからPools、SessionRotationCandidatesからSessionsの2本のみ。後者はON DELETE CASCADE。破線は本人・接続・セッションID・失効世代をアプリが照合する論理関連で、SQLの外部キーではない。各テーブルには目的、主なキーと列、ハッシュで保存する秘密の範囲を示す。SchemaVersionsは独立表。</desc>
<defs><marker id="broker-fk-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#426a59" stroke-width="1.4"/></marker><marker id="broker-logic-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#9a865c" stroke-width="1.3"/></marker></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;fill:#1e302d}
.canvas{fill:#fffefa}.card{fill:#fffefa;stroke:#cad9cc;stroke-width:1.3}.head{fill:#eaf2e9}.rule{stroke:#d4e0d7;stroke-width:1}
.title{font-size:23px;font-weight:700}.subtitle{font-size:13px;fill:#63716c}.table{font-family:Consolas,monospace;font-size:16px;font-weight:700}
.purpose{font-size:12px;fill:#52675c}.field{font-family:Consolas,monospace;font-size:12px}.badge{font-family:Consolas,monospace;font-size:10.5px;font-weight:700;fill:#006b5e}
.note{font-size:12px;fill:#63716c}.card-note{font-size:11px;fill:#63716c}.fk{fill:none;stroke:#426a59;stroke-width:1.8;marker-end:url(#broker-fk-arrow)}.logical{fill:none;stroke:#9a865c;stroke-width:1.5;stroke-dasharray:6 5;marker-end:url(#broker-logic-arrow)}.relation{font-size:11px;fill:#006b5e}.logical-label{font-size:10.5px;fill:#897044}.legend-rule{fill:none;stroke:#426a59;stroke-width:1.8}.legend-logical{fill:none;stroke:#9a865c;stroke-width:1.5;stroke-dasharray:6 5}
</style>
<rect class="canvas" width="1600" height="1300" rx="8"/>
<text class="title" x="40" y="33">Credential Brokerの全7表：接続枠・本人・認証取引・継続セッションを分けて管理する。</text>
<text class="subtitle" x="40" y="59">002適用後の現行構造 / 主な列を抜粋 / 実線は物理FK、破線はアプリが照合する論理関連</text>

<!-- 物理FKは2本。矢印は親から子へ。 -->
<path class="fk" d="M240 330V430"/>
<text class="relation" x="253" y="350">1</text><text class="relation" x="253" y="417">0..N</text>
<text class="relation" x="253" y="383">ProfileName, ProviderName</text>
<path class="fk" d="M1140 800H1200"/>
<text class="relation" x="1152" y="787">1</text><text class="relation" x="1190" y="787" text-anchor="end">0..N</text>
<text class="relation" x="1170" y="824" text-anchor="middle">更新候補</text>

<!-- 論理関連はSQLの参照制約ではない。 -->
<path class="logical" d="M440 530H490V300H550"/>
<text class="logical-label" x="495" y="360">本人・接続</text><text class="logical-label" x="495" y="378">論理照合</text><text class="logical-label" x="495" y="396">FKなし</text>
<path class="logical" d="M440 720H550"/>
<text class="logical-label" x="450" y="704">本人・接続</text><text class="logical-label" x="472" y="738">FKなし</text>
<path class="logical" d="M790 550V650"/>
<text class="logical-label" x="805" y="592">PendingSessionId</text><text class="logical-label" x="805" y="613">認証完了時の対応 / FKなし</text>
<path class="logical" d="M1200 180H1050"/>
<text class="logical-label" x="1125" y="164" text-anchor="middle">本人の失効世代</text><text class="logical-label" x="1125" y="201" text-anchor="middle">FKなし</text>
<path class="logical" d="M1200 230H1140V580H1100V650"/>
<text class="logical-label" x="1156" y="564">本人の失効世代 / FKなし</text>

<g data-table="broker.Pools" aria-label="broker.Pools：CMプロバイダーごとの接続枠を管理">
<rect class="card" x="40" y="100" width="400" height="230" rx="7"/>
<path class="head" d="M47 100H433a7 7 0 0 1 7 7V174H40V107a7 7 0 0 1 7-7Z"/>
<text class="table" x="58" y="128">broker.Pools</text>
<text class="purpose" x="58" y="154">目的：CMプロバイダーごとの接続枠を管理</text>
<path class="rule" d="M40 174H440"/>
<text class="field" x="58" y="206">ProfileName, ProviderName</text>
<text class="badge" x="422" y="206" text-anchor="end">複合PK</text>
<text class="field" x="58" y="232">Capacity</text>
<text class="field" x="58" y="258">Allocated</text>
<text class="field" x="58" y="284">Enabled / AllocationBlocked</text>
<text class="field" x="58" y="310">Version</text>
<text class="badge" x="422" y="310" text-anchor="end">rowversion</text>
</g>
<g data-table="broker.Connections" aria-label="broker.Connections：本人とCMの物理接続を対応付ける">
<rect class="card" x="40" y="430" width="400" height="330" rx="7"/>
<path class="head" d="M47 430H433a7 7 0 0 1 7 7V504H40V437a7 7 0 0 1 7-7Z"/>
<text class="table" x="58" y="458">broker.Connections</text>
<text class="purpose" x="58" y="484">目的：本人とCMの物理接続を対応付ける</text>
<path class="rule" d="M40 504H440"/>
<text class="field" x="58" y="536">TenantId, ObjectId, ProfileName</text>
<text class="badge" x="422" y="536" text-anchor="end">複合PK</text>
<text class="field" x="58" y="562">ProviderName, ConnectionId</text>
<text class="badge" x="422" y="562" text-anchor="end">UQ</text>
<text class="field" x="58" y="588">ProfileName, ProviderName</text>
<text class="badge" x="422" y="588" text-anchor="end">FK → Pools</text>
<text class="field" x="58" y="614">State</text>
<text class="field" x="58" y="640">UserPrincipalName</text>
<text class="field" x="58" y="666">SecurityEpoch</text>
<text class="field" x="58" y="692">LeaseOwner / LeaseUntil</text>
<text class="field" x="58" y="718">LastUsedAt / LastCheckedAt</text>
<text class="field" x="58" y="744">CreatedAt / Version</text>
</g>
<g data-table="broker.Transactions" aria-label="broker.Transactions：短時間の本人認証の進行と一度用の証明を管理">
<rect class="card" x="550" y="100" width="500" height="450" rx="7"/>
<path class="head" d="M557 100H1043a7 7 0 0 1 7 7V174H550V107a7 7 0 0 1 7-7Z"/>
<text class="table" x="568" y="128">broker.Transactions</text>
<text class="purpose" x="568" y="154">目的：短時間の本人認証の進行と一度用の証明を管理</text>
<path class="rule" d="M550 174H1050"/>
<text class="field" x="568" y="206">TransactionId</text>
<text class="badge" x="1032" y="206" text-anchor="end">PK</text>
<text class="field" x="568" y="232">ProfileName / SubscriptionId</text>
<text class="field" x="568" y="258">Phase / FailureCode</text>
<text class="field" x="568" y="284">TenantId / ObjectId</text>
<text class="field" x="568" y="310">ProviderName / ConnectionId</text>
<text class="field" x="568" y="336">PollHash / LaunchHash / CookieHash</text>
<text class="badge" x="1032" y="336" text-anchor="end">HASH</text>
<text class="field" x="568" y="362">OidcStateHash / CmStateHash / TicketHash</text>
<text class="badge" x="1032" y="362" text-anchor="end">HASH</text>
<text class="field" x="568" y="388">PendingSessionId / PendingSessionSecretHash</text>
<text class="badge" x="1032" y="388" text-anchor="end">秘密のみHASH</text>
<text class="field" x="568" y="414">OidcFlow</text>
<text class="badge" x="1032" y="414" text-anchor="end">途中のJSON</text>
<text class="field" x="568" y="440">ExpiresAt / CreatedAt</text>
<text class="field" x="568" y="466">RequiredTenantId / RequiredObjectId</text>
<text class="field" x="568" y="492">SubjectEpochAtVerification / ConnectionEpochAtVerification</text>
<text class="field" x="568" y="518">ForceCmLogin / Version</text>
</g>
<g data-table="broker.SubjectSecurity" aria-label="broker.SubjectSecurity：本人単位の一括失効世代を管理">
<rect class="card" x="1200" y="100" width="360" height="190" rx="7"/>
<path class="head" d="M1207 100H1553a7 7 0 0 1 7 7V174H1200V107a7 7 0 0 1 7-7Z"/>
<text class="table" x="1218" y="128">broker.SubjectSecurity</text>
<text class="purpose" x="1218" y="154">目的：本人単位の一括失効世代を管理</text>
<path class="rule" d="M1200 174H1560"/>
<text class="field" x="1218" y="206">TenantId, ObjectId</text>
<text class="badge" x="1542" y="206" text-anchor="end">複合PK</text>
<text class="field" x="1218" y="232">RevocationEpoch</text>
<text class="field" x="1218" y="258">UpdatedAt</text>
</g>
<g data-table="broker.SchemaVersions" aria-label="broker.SchemaVersions：SQL定義の適用済み版を記録">
<rect class="card" x="1200" y="340" width="360" height="180" rx="7"/>
<path class="head" d="M1207 340H1553a7 7 0 0 1 7 7V414H1200V347a7 7 0 0 1 7-7Z"/>
<text class="table" x="1218" y="368">broker.SchemaVersions</text>
<text class="purpose" x="1218" y="394">目的：SQL定義の適用済み版を記録</text>
<path class="rule" d="M1200 414H1560"/>
<text class="field" x="1218" y="446">Version</text>
<text class="badge" x="1542" y="446" text-anchor="end">PK</text>
<text class="field" x="1218" y="474">AppliedAt</text>
<text class="card-note" x="1218" y="502">独立表 / 物理FKなし</text>
</g>
<g data-table="broker.Sessions" aria-label="broker.Sessions：APIMサブスクリプション・本人・接続を束ねた継続利用の証明を管理">
<rect class="card" x="550" y="650" width="590" height="450" rx="7"/>
<path class="head" d="M557 650H1133a7 7 0 0 1 7 7V724H550V657a7 7 0 0 1 7-7Z"/>
<text class="table" x="568" y="678">broker.Sessions</text>
<text class="purpose" x="568" y="704">目的：APIMサブスクリプション・本人・接続を束ねた継続利用の証明を管理</text>
<path class="rule" d="M550 724H1140"/>
<text class="field" x="568" y="752">SessionId</text>
<text class="badge" x="1122" y="752" text-anchor="end">PK</text>
<text class="field" x="568" y="778">SecretHash / PreviousSecretHash</text>
<text class="badge" x="1122" y="778" text-anchor="end">HASH</text>
<text class="field" x="568" y="804">SubscriptionId / ProfileName</text>
<text class="field" x="568" y="830">TenantId / ObjectId</text>
<text class="field" x="568" y="856">ProviderName / ConnectionId</text>
<text class="field" x="568" y="882">IdleExpiresAt / AbsoluteExpiresAt</text>
<text class="field" x="568" y="908">LastBusinessUsedAt / ExpiresAt</text>
<text class="field" x="568" y="934">Generation / NextRotationAt</text>
<text class="field" x="568" y="960">RotationDeadlineAt / PreviousValidUntil</text>
<text class="field" x="568" y="986">SubjectEpochAtAuthentication</text>
<text class="field" x="568" y="1012">ConnectionEpochAtAuthentication</text>
<text class="field" x="568" y="1038">Revoked / RevokedAt / RevocationReason</text>
<text class="card-note" x="568" y="1074">期限・更新方針の各 *Seconds も、認証完了時にこの行へ固定する。</text>
</g>
<g data-table="broker.SessionRotationCandidates" aria-label="broker.SessionRotationCandidates：保存後に確定する新しい証明の候補を管理">
<rect class="card" x="1200" y="650" width="360" height="270" rx="7"/>
<path class="head" d="M1207 650H1553a7 7 0 0 1 7 7V724H1200V657a7 7 0 0 1 7-7Z"/>
<text class="table" x="1218" y="678">broker.SessionRotationCandidates</text>
<text class="purpose" x="1218" y="704">目的：保存後に確定する新しい証明の候補を管理</text>
<path class="rule" d="M1200 724H1560"/>
<text class="field" x="1218" y="752">RotationId</text>
<text class="badge" x="1542" y="752" text-anchor="end">PK</text>
<text class="field" x="1218" y="778">SessionId</text>
<text class="badge" x="1542" y="778" text-anchor="end">FK → Sessions</text>
<text class="field" x="1218" y="804">SecretHash</text>
<text class="badge" x="1542" y="804" text-anchor="end">HASH</text>
<text class="field" x="1218" y="830">FromGeneration</text>
<text class="field" x="1218" y="856">CreatedAt / ExpiresAt</text>
<text class="card-note" x="1218" y="884">Session削除時はON DELETE CASCADE。</text>
<text class="card-note" x="1218" y="903">更新確定時は同じSessionの候補を回収。</text>
</g>

<path class="legend-rule" d="M40 850H87"/><text class="note" x="100" y="854">実線：SQLの物理FK（計2本）</text>
<path class="legend-logical" d="M40 880H87"/><text class="note" x="100" y="884">破線：ID・本人・接続・世代の論理照合</text>
<text class="note" x="40" y="916">PK：主キー　FK：外部キー　UQ：一意制約</text>
<text class="note" x="40" y="945">HASH：秘密そのものを返さず照合するSHA-256値</text>
<text class="note" x="40" y="976">接続のSecurityEpochも、認証時の値と照合する。</text>
<text class="note" x="40" y="1007">Version(rowversion)と証明のGenerationは別の列。</text>
<text class="note" x="1200" y="965">専用の監査履歴テーブルはない。</text>
<text class="note" x="1200" y="992">Phase・失効理由は各状態行に記録する。</text>
<text class="note" x="1200" y="1019">期限済みの認証取引は照合Jobで削除する。</text>
<path class="rule" d="M40 1140H1560"/>
<text class="note" x="40" y="1166">ID・接続先・期限・世代は通常の値として保存。セッションや一度用の証明の秘密は、HASH表示の列にハッシュで保存する。</text>
<text class="note" x="40" y="1193">Microsoftのアクセストークン・更新トークンはCMで管理。本人確認のIDトークンを含め、Broker SQLには保存しない。</text>
<text class="note" x="40" y="1220">OidcFlowは認証途中のフローJSONを一時保存。OAuthトークンの混入を拒否し、コールバックで消費してSQLから消去する。</text>
<text class="note" x="40" y="1247">SchemaVersionsは独立した適用記録。図は002適用後の現行構造で、001の旧Sessionsを別表として数えない。</text>
<text class="note" x="40" y="1276">出典：apps/gateway/credential-broker/sql/001_initial.sql・002_session_lifecycle.sql / credential_broker/store.py。</text>
</svg>
