<text class="actor-subtitle" x="1434" y="170" text-anchor="middle">外部API</text>
<path d="M90 270H258" fill="none" stroke="#597265" stroke-width="1.8" marker-end="url(#credential-initial-start-sequence-plain-arrow)"/>
<rect x="74.0" y="219" width="200" height="49" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="174.0" y="238" text-anchor="middle"><tspan fill="#597265">Graph試用を要求</tspan></text>
<text class="message" x="174.0" y="261" text-anchor="middle"><tspan fill="#597265">選択したキーの台帳ID</tspan></text>
<path d="M258 357H594" fill="none" stroke="#597265" stroke-width="1.8" marker-end="url(#credential-initial-start-sequence-plain-arrow)"/>
<rect x="267.0" y="306" width="318" height="49" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="426.0" y="325" text-anchor="middle"><tspan fill="#597265">ARM：サブスクリプション・製品確認</tspan></text>
<text class="message" x="426.0" y="348" text-anchor="middle"><tspan fill="#597265">listSecretsで主キーを取得</tspan></text>
<path d="M594 421H258" fill="none" stroke="#357965" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#credential-initial-start-sequence-key-arrow)"/>
<rect x="384.0" y="393" width="84" height="26" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="426.0" y="412" text-anchor="middle"><tspan fill="#357965"></tspan><tspan fill="#357965">APIキー</tspan><tspan fill="#357965"></tspan></text>
<path d="M258 485H426" fill="none" stroke="#597265" stroke-width="1.8" marker-end="url(#credential-initial-start-sequence-plain-arrow)"/>
<rect x="234.0" y="457" width="216" height="26" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="342.0" y="476" text-anchor="middle"><tspan fill="#597265">接続状態を読取：未接続</tspan></text>
<path d="M258 572H594" fill="none" stroke="#357965" stroke-width="1.8" marker-end="url(#credential-initial-start-sequence-key-arrow)"/>
<rect x="294.0" y="521" width="264" height="49" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="426.0" y="540" text-anchor="middle"><tspan fill="#357965">GET /tools/graph/v1/me</tspan></text>
<text class="message" x="426.0" y="563" text-anchor="middle"><tspan fill="#357965"></tspan><tspan fill="#357965">APIキー</tspan><tspan fill="#357965">のみ（</tspan><tspan fill="#477a93">接続証明</tspan><tspan fill="#357965">なし）</tspan></text>
<rect x="374.0" y="614" width="440" height="51" rx="6" fill="#edf3e9" stroke="#d0dccb"/>
<text class="note" x="389.0" y="642" style="fill:#597265">APIキーを検証し、実サブスクリプションIDを確定</text>
<path d="M594 730H762" fill="none" stroke="#597265" stroke-width="1.8" marker-end="url(#credential-initial-start-sequence-plain-arrow)"/>
<rect x="569.0" y="679" width="218" height="49" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="678.0" y="698" text-anchor="middle"><tspan fill="#597265">POST /v1/challenge</tspan></text>
<text class="message" x="678.0" y="721" text-anchor="middle"><tspan fill="#597265">検証済みID ＋ profile</tspan></text>
<path d="M762 817H930" fill="none" stroke="#477a93" stroke-width="1.8" marker-end="url(#credential-initial-start-sequence-proof-arrow)"/>
<rect x="624.0" y="766" width="444" height="49" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="846.0" y="785" text-anchor="middle"><tspan fill="#477a93">Transactionsに取引・</tspan><tspan fill="#477a93">仮証明</tspan><tspan fill="#477a93">の秘密ハッシュを保存</tspan></text>
<text class="message" x="846.0" y="808" text-anchor="middle"><tspan fill="#477a93">この時点ではCM接続を予約しない</tspan></text>
<path d="M762 904H594" fill="none" stroke="#477a93" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#credential-initial-start-sequence-proof-arrow)"/>
<rect x="522.0" y="853" width="312" height="49" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="678.0" y="872" text-anchor="middle"><tspan fill="#477a93">200：仮の</tspan><tspan fill="#477a93">接続証明</tspan><tspan fill="#477a93"> ＋ pollSecret</tspan></text>
<text class="message" x="678.0" y="895" text-anchor="middle"><tspan fill="#477a93">取引ID・loginUrl・期限</tspan></text>
<path d="M594 991H258" fill="none" stroke="#477a93" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#credential-initial-start-sequence-proof-arrow)"/>
<rect x="246.0" y="940" width="360" height="49" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="426.0" y="959" text-anchor="middle"><tspan fill="#477a93">409 ConnectionRequiredに変換</tspan></text>
<text class="message" x="426.0" y="982" text-anchor="middle"><tspan fill="#477a93">仮の</tspan><tspan fill="#477a93">接続証明</tspan><tspan fill="#477a93">・pollSecret・loginUrl等</tspan></text>
<path d="M258 1078H426" fill="none" stroke="#477a93" stroke-width="1.8" marker-end="url(#credential-initial-start-sequence-proof-arrow)"/>
<rect x="129.0" y="1027" width="426" height="49" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="342.0" y="1046" text-anchor="middle"><tspan fill="#477a93">仮の</tspan><tspan fill="#477a93">接続証明</tspan><tspan fill="#477a93">・pollSecret等を暗号化保存</tspan></text>
<text class="message" x="342.0" y="1069" text-anchor="middle"><tspan fill="#477a93">保存を完了してから、ブラウザーへ認証URLを返す</tspan></text>
<path d="M258 1165H90" fill="none" stroke="#597265" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#credential-initial-start-sequence-plain-arrow)"/>
<rect x="12.0" y="1114" width="490" height="49" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="257.0" y="1133" text-anchor="middle"><tspan fill="#597265">loginUrl ＋ 期限</tspan></text>
<text class="message" x="257.0" y="1156" text-anchor="middle"><tspan fill="#597265">ブラウザーに</tspan><tspan fill="#357965">APIキー</tspan><tspan fill="#597265">・</tspan><tspan fill="#477a93">接続証明</tspan><tspan fill="#597265">・pollSecretは渡さない</tspan></text>
<text class="footer" x="24" y="1256">初回 Bへ：利用者がloginUrlを開く。仮証明はPortal SQL、照合用ハッシュはBroker SQLに保持。</text></svg>
