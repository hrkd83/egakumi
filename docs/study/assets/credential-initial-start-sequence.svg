<svg xmlns="http://www.w3.org/2000/svg" width="1530" height="1278" viewBox="0 0 1530 1278" role="img" aria-labelledby="credential-initial-start-sequence-title credential-initial-start-sequence-desc">
<title id="credential-initial-start-sequence-title">初回 A｜認証案内と仮の接続証明を保存する</title><desc id="credential-initial-start-sequence-desc">Portalログイン・キーの利用権限確認後。CMの本人接続と有効な接続証明はまだない。初回 Bへ：利用者がloginUrlを開く。仮証明はPortal SQL、照合用ハッシュはBroker SQLに保持。時刻は上から下。実線は要求・保存、破線は応答。Portal DBとBroker DBは別のSQLデータベース。</desc>
<defs><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;fill:#223831}
.title{font-size:26px;font-weight:700}.subtitle{font-size:17px;fill:#66766d}.actor{fill:#f2f6ee;stroke:#c8d8c7;stroke-width:1.2}
.actor-title{font-size:20px;font-weight:650}.actor-subtitle{font-size:15px;fill:#65796c}.life{stroke:#cad7ca;stroke-width:1.3;stroke-dasharray:6 6}
.message{font-size:18px}.note{font-size:17px}.frame-label{font-size:17px;font-weight:650;fill:#80683c}.footer{font-size:16px;fill:#63756a}
</style>
<marker id="credential-initial-start-sequence-plain-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#597265" stroke-width="1.5"/></marker>
<marker id="credential-initial-start-sequence-key-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#357965" stroke-width="1.5"/></marker>
<marker id="credential-initial-start-sequence-proof-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#477a93" stroke-width="1.5"/></marker>
<marker id="credential-initial-start-sequence-token-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#9a7846" stroke-width="1.5"/></marker>
</defs>
<rect width="1530" height="1278" rx="8" fill="#fffefa"/>
<text class="title" x="24" y="39">初回 A｜認証案内と仮の接続証明を保存する</text>
<text class="subtitle" x="24" y="70">Portalログイン・キーの利用権限確認後。CMの本人接続と有効な接続証明はまだない。</text>
<path d="M24 96H54" stroke="#357965" stroke-width="3"/>
<text x="63" y="102" font-size="16" style="fill:#357965">APIキー</text>
<path d="M259 96H289" stroke="#477a93" stroke-width="3"/>
<text x="298" y="102" font-size="16" style="fill:#477a93">接続証明</text>
<path d="M494 96H524" stroke="#9a7846" stroke-width="3"/>
<text x="533" y="102" font-size="16" style="fill:#9a7846">アクセストークン</text>
<text x="785" y="102" font-size="16" fill="#65796c">実線：要求・保存　破線：応答　／　上から順に実行</text>
