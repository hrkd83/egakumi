<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="limit-er-title limit-er-desc">
  <title id="limit-er-title">Portalのキー別利用制限と変更監査のER図</title>
  <desc id="limit-er-desc">portalApiKeyはAPIMサブスクリプション台帳。idが主キーで、tenantIdとidの組み合わせにも一意制約がある。portalApiKeyLimitはAPIMサブスクリプションごとの現在の利用制限を0件または1件保持し、tenantIdとapiKeyIdが複合主キーかつportalApiKeyへの外部キー。portalApiKeyLimitAuditは変更前後、版、操作者を0件以上記録し、tenantIdとapiKeyIdが直接portalApiKeyを参照する。LimitAuditからLimitへの外部キーはない。物理外部キーは合計2本。</desc>
  <defs>
    <marker id="limit-fk-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#607f73" stroke-width="1.3"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;fill:#1e302d}
      .canvas{fill:#fffefa}.card{fill:#fffefa;stroke:#cad9cc;stroke-width:1.3}.head{fill:#eaf2e9}.rule{stroke:#d4e0d7;stroke-width:1}
      .title{font-size:21px;font-weight:700}.subtitle{font-size:12px;fill:#63716c}.table{font-family:Consolas,monospace;font-size:17px;font-weight:700}
      .purpose{font-size:12px;fill:#52675c}.field{font-family:Consolas,monospace;font-size:13px}.badge{font-family:Consolas,monospace;font-size:11px;font-weight:700;fill:#006b5e}
      .note{font-size:12px;fill:#63716c}.card-note{font-size:11px;fill:#63716c}.edge{fill:none;stroke:#607f73;stroke-width:1.6;marker-end:url(#limit-fk-arrow)}.relation{font-size:12px;fill:#006b5e}
    </style>
  </defs>
  <rect class="canvas" width="1200" height="850" rx="8"/>
  <text class="title" x="40" y="32">利用制限と変更履歴の参照関係</text>
  <text class="subtitle" x="40" y="57">利用制限の3表・2本の物理FK / 主な列を抜粋 / 実線は親から子へ</text>

  <path class="edge" d="M400 260H500"/>
  <text class="relation" x="413" y="247">1</text>
  <text class="relation" x="492" y="247" text-anchor="end">0..1</text>
  <text class="relation" x="450" y="284" text-anchor="middle">現在の制限</text>
  <path class="edge" d="M230 400V610H500"/>
  <text class="relation" x="243" y="425">1</text>
  <text class="relation" x="487" y="597" text-anchor="end">0..N</text>
  <text class="relation" x="355" y="635" text-anchor="middle">制限の変更履歴</text>

  <g aria-label="portalApiKey：利用制限の対象となるAPIMサブスクリプション台帳">
    <rect class="card" x="40" y="140" width="360" height="260" rx="7"/>
    <path class="head" d="M47 140H393a7 7 0 0 1 7 7V214H40V147a7 7 0 0 1 7-7Z"/>
    <text class="table" x="58" y="168">portalApiKey</text>
    <text class="purpose" x="58" y="190"><tspan x="58">目的：利用制限の対象となる</tspan><tspan x="58" dy="17">APIMサブスクリプションを識別</tspan></text>
    <path class="rule" d="M40 214H400"/>
    <text class="field" x="58" y="245">id</text><text class="badge" x="382" y="245" text-anchor="end">PK</text>
    <text class="field" x="58" y="273">tenantId, id</text><text class="badge" x="382" y="273" text-anchor="end">複合UQ</text>
    <text class="field" x="58" y="301">apimSubscriptionId</text>
    <text class="field" x="58" y="329">state</text>
    <text class="card-note" x="58" y="358">両子表の(tenantId, apiKeyId)が</text>
    <text class="card-note" x="58" y="380">この表の(tenantId, id)を参照する。</text>
  </g>

  <g aria-label="portalApiKeyLimit：APIMサブスクリプション別の現在の利用制限と版数を保持">
    <rect class="card" x="500" y="100" width="660" height="320" rx="7"/>
    <path class="head" d="M507 100H1153a7 7 0 0 1 7 7V174H500V107a7 7 0 0 1 7-7Z"/>
    <text class="table" x="518" y="128">portalApiKeyLimit</text>
    <text class="purpose" x="518" y="154">目的：APIMサブスクリプション別の現在の利用制限と版数を保持</text>
    <path class="rule" d="M500 174H1160"/>
    <text class="field" x="518" y="205">tenantId, apiKeyId</text><text class="badge" x="1142" y="205" text-anchor="end">複合PK / FK → Key(tenantId, id)</text>
    <text class="field" x="518" y="233">version</text><text class="card-note" x="1142" y="233" text-anchor="end">保存時に1ずつ増加</text>
    <text class="field" x="518" y="261">requestCalls / requestRenewalSeconds</text>
    <text class="field" x="518" y="289">tokensPerMinute</text>
    <text class="field" x="518" y="317">tokenQuota / tokenQuotaPeriod</text>
    <text class="field" x="518" y="345">updatedAt / updatedByObjectId</text>
    <text class="card-note" x="518" y="376">制限項目のNULLは、その項目に上限を設けない指定。</text>
    <text class="card-note" x="518" y="400">未保存は行なし。取得時は version=0・全項目上限なしとして返す。</text>
  </g>

  <g aria-label="portalApiKeyLimitAudit：利用制限の変更前後と版数と操作者を記録">
    <rect class="card" x="500" y="470" width="660" height="280" rx="7"/>
    <path class="head" d="M507 470H1153a7 7 0 0 1 7 7V544H500V477a7 7 0 0 1 7-7Z"/>
    <text class="table" x="518" y="498">portalApiKeyLimitAudit</text>
    <text class="purpose" x="518" y="524">目的：利用制限の変更前後・版数・操作者を記録</text>
    <path class="rule" d="M500 544H1160"/>
    <text class="field" x="518" y="574">id</text><text class="badge" x="1142" y="574" text-anchor="end">PK</text>
    <text class="field" x="518" y="602">tenantId, apiKeyId</text><text class="badge" x="1142" y="602" text-anchor="end">FK → Key(tenantId, id)</text>
    <text class="field" x="518" y="630">version</text><text class="badge" x="1142" y="630" text-anchor="end">UQ ※</text>
    <text class="field" x="518" y="658">actorObjectId</text><text class="card-note" x="1142" y="658" text-anchor="end">操作した本人のEntra Object ID</text>
    <text class="field" x="518" y="686">previousProfile / profile</text><text class="card-note" x="1142" y="686" text-anchor="end">変更前 / 変更後の設定JSON</text>
    <text class="field" x="518" y="714">recordedAt</text>
    <text class="card-note" x="518" y="739">※ (tenantId, apiKeyId, version)の組み合わせで一意。</text>
  </g>

  <text class="note" x="40" y="678">PK：主キー　FK：外部キー　UQ：一意制約</text>
  <text class="note" x="40" y="704">2本のFKは、ともにKeyを直接参照する。</text>
  <text class="note" x="40" y="730">LimitAuditからLimitへのFKはない。</text>
  <path class="rule" d="M40 775H1160"/>
  <text class="note" x="40" y="798">設定の更新と変更監査の追記は、同じSQLトランザクションで確定する。</text>
  <text class="note" x="40" y="825">出典：apps/portal/sql/002_api_keys.sql・003_api_key_limits.sql / lib/api-keys/limit-repository.ts。</text>
</svg>
