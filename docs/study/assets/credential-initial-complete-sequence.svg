<text class="actor-title" x="426" y="148" text-anchor="middle">SQL</text>
<text class="actor-subtitle" x="426" y="170" text-anchor="middle">Portal DB</text>
<path class="life" d="M594 182V1976"/>
<rect class="actor" x="522" y="124" width="144" height="58" rx="7"/>
<text class="actor-title" x="594" y="148" text-anchor="middle">APIM</text>
<text class="actor-subtitle" x="594" y="170" text-anchor="middle">Gateway / ARM</text>
<path class="life" d="M762 182V1976"/>
<rect class="actor" x="690" y="124" width="144" height="58" rx="7"/>
<text class="actor-title" x="762" y="148" text-anchor="middle">Broker</text>
<text class="actor-subtitle" x="762" y="170" text-anchor="middle">内部HTTP</text>
