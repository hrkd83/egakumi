<rect class="actor" x="1026" y="124" width="144" height="58" rx="7"/>
<text class="actor-title" x="1098" y="148" text-anchor="middle">CM</text>
<text class="actor-subtitle" x="1098" y="170" text-anchor="middle">APIM機能</text>
<path class="life" d="M1266 182V1976"/>
<rect class="actor" x="1194" y="124" width="144" height="58" rx="7"/>
<text class="actor-title" x="1266" y="148" text-anchor="middle">Entra ID</text>
<text class="actor-subtitle" x="1266" y="170" text-anchor="middle">本人認証</text>
<path class="life" d="M1434 182V1976"/>
<rect class="actor" x="1362" y="124" width="144" height="58" rx="7"/>
<text class="actor-title" x="1434" y="148" text-anchor="middle">Graph</text>
<text class="actor-subtitle" x="1434" y="170" text-anchor="middle">外部API</text>
<path d="M90 270H594" fill="none" stroke="#597265" stroke-width="1.8" marker-end="url(#credential-initial-complete-sequence-plain-arrow)"/>
<rect x="143.0" y="219" width="398" height="49" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="342.0" y="238" text-anchor="middle"><tspan fill="#597265">GET /auth/connections/browser/callback</tspan></text>
<text class="message" x="342.0" y="261" text-anchor="middle"><tspan fill="#597265">CM戻り用state・Cookie</tspan></text>
<path d="M594 334H762" fill="none" stroke="#597265" stroke-width="1.8" marker-end="url(#credential-initial-complete-sequence-plain-arrow)"/>
<rect x="544.0" y="306" width="268" height="26" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="678.0" y="325" text-anchor="middle"><tspan fill="#597265">POST /v1/callback-context</tspan></text>
<path d="M762 421H930" fill="none" stroke="#597265" stroke-width="1.8" marker-end="url(#credential-initial-complete-sequence-plain-arrow)"/>
<rect x="695.0" y="370" width="302" height="49" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="846.0" y="389" text-anchor="middle"><tspan fill="#597265">Cookie・stateを照合</tspan></text>
<text class="message" x="846.0" y="412" text-anchor="middle"><tspan fill="#597265">一度限りのcallbackTicketを作成</tspan></text>
<path d="M762 485H594" fill="none" stroke="#597265" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#credential-initial-complete-sequence-plain-arrow)"/>
<rect x="482.0" y="457" width="392" height="26" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="678.0" y="476" text-anchor="middle"><tspan fill="#597265">物理接続先・期待する本人・callbackTicket</tspan></text>
<path d="M594 572H1098" fill="none" stroke="#597265" stroke-width="1.8" marker-end="url(#credential-initial-complete-sequence-plain-arrow)"/>
<rect x="712.0" y="521" width="268" height="49" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="846.0" y="540" text-anchor="middle"><tspan fill="#597265">get-authorization-context</tspan></text>
<text class="message" x="846.0" y="563" text-anchor="middle"><tspan fill="#597265">APIMのシステム割当MI</tspan></text>
<path d="M1098 636H594" fill="none" stroke="#9a7846" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#credential-initial-complete-sequence-token-arrow)"/>
<rect x="765.0" y="608" width="162" height="26" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="846.0" y="627" text-anchor="middle"><tspan fill="#9a7846"></tspan><tspan fill="#9a7846">アクセストークン</tspan><tspan fill="#9a7846"></tspan></text>
<path d="M594 723H1434" fill="none" stroke="#9a7846" stroke-width="1.8" marker-end="url(#credential-initial-complete-sequence-token-arrow)"/>
<rect x="898.0" y="672" width="232" height="49" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="1014.0" y="691" text-anchor="middle"><tspan fill="#9a7846">GET /me：本人確認</tspan></text>
<text class="message" x="1014.0" y="714" text-anchor="middle"><tspan fill="#9a7846">Bearer </tspan><tspan fill="#9a7846">アクセストークン</tspan><tspan fill="#9a7846"></tspan></text>
<path d="M1434 787H594" fill="none" stroke="#597265" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#credential-initial-complete-sequence-plain-arrow)"/>
<rect x="878.0" y="759" width="272" height="26" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="1014.0" y="778" text-anchor="middle"><tspan fill="#597265">トークン検証後、本人IDを返す</tspan></text>
<path d="M594 874H762" fill="none" stroke="#597265" stroke-width="1.8" marker-end="url(#credential-initial-complete-sequence-plain-arrow)"/>
<rect x="518.0" y="823" width="320" height="49" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="678.0" y="842" text-anchor="middle"><tspan fill="#597265">POST /v1/complete</tspan></text>
<text class="message" x="678.0" y="865" text-anchor="middle"><tspan fill="#597265">callbackTicket ＋ Graphの本人ID</tspan></text>
<path d="M762 961H930" fill="none" stroke="#477a93" stroke-width="1.8" marker-end="url(#credential-initial-complete-sequence-proof-arrow)"/>
<rect x="662.0" y="910" width="368" height="49" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="846.0" y="929" text-anchor="middle"><tspan fill="#477a93">本人・取引期限・失効版を再照合</tspan></text>
<text class="message" x="846.0" y="952" text-anchor="middle"><tspan fill="#477a93">Sessionsを作成し、最初の</tspan><tspan fill="#477a93">仮証明</tspan><tspan fill="#477a93">を有効化</tspan></text>
<path d="M762 1025H594" fill="none" stroke="#597265" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#credential-initial-complete-sequence-plain-arrow)"/>
<rect x="633.0" y="997" width="90" height="26" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="678.0" y="1016" text-anchor="middle"><tspan fill="#597265">認証完了</tspan></text>
<path d="M594 1089H90" fill="none" stroke="#597265" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#credential-initial-complete-sequence-plain-arrow)"/>
<rect x="270.0" y="1061" width="144" height="26" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="342.0" y="1080" text-anchor="middle"><tspan fill="#597265">認証完了の画面</tspan></text>
<rect x="20" y="1131" width="648" height="51" rx="6" fill="#edf3e9" stroke="#d0dccb"/>
<text class="note" x="35" y="1159" style="fill:#597265">元のPortal画面が完了を問い合わせる（未完了なら同じ取引をポーリング）</text>
<path d="M90 1224H258" fill="none" stroke="#597265" stroke-width="1.8" marker-end="url(#credential-initial-complete-sequence-plain-arrow)"/>
<rect x="66.0" y="1196" width="216" height="26" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="174.0" y="1215" text-anchor="middle"><tspan fill="#597265">完了状態を問い合わせる</tspan></text>
<rect x="144.0" y="1266" width="564" height="51" rx="6" fill="#edf3e9" stroke="#d0dccb"/>
<text class="note" x="159.0" y="1294" style="fill:#597265">Portalはキーの利用権限を再確認し、ARMからAPIキーを解決する</text>
<path d="M258 1382H426" fill="none" stroke="#597265" stroke-width="1.8" marker-end="url(#credential-initial-complete-sequence-plain-arrow)"/>
<rect x="180.0" y="1331" width="324" height="49" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="342.0" y="1350" text-anchor="middle"><tspan fill="#597265">暗号化状態を読取</tspan></text>
<text class="message" x="342.0" y="1373" text-anchor="middle"><tspan fill="#597265">Portalで取引ID・pollSecretを復号</tspan></text>
<path d="M258 1469H594" fill="none" stroke="#357965" stroke-width="1.8" marker-end="url(#credential-initial-complete-sequence-key-arrow)"/>
<rect x="216.0" y="1418" width="420" height="49" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="426.0" y="1437" text-anchor="middle"><tspan fill="#357965">GET /auth/connections/status</tspan></text>
<text class="message" x="426.0" y="1460" text-anchor="middle"><tspan fill="#357965"></tspan><tspan fill="#357965">APIキー</tspan><tspan fill="#357965"> ＋ pollSecret（</tspan><tspan fill="#477a93">接続証明</tspan><tspan fill="#357965">は送らない）</tspan></text>
<path d="M594 1556H762" fill="none" stroke="#597265" stroke-width="1.8" marker-end="url(#credential-initial-complete-sequence-plain-arrow)"/>
<rect x="554.0" y="1505" width="248" height="49" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="678.0" y="1524" text-anchor="middle"><tspan fill="#597265">GET /v1/status</tspan></text>
<text class="message" x="678.0" y="1547" text-anchor="middle"><tspan fill="#597265">検証済みID ＋ pollSecret</tspan></text>
<path d="M762 1620H930" fill="none" stroke="#597265" stroke-width="1.8" marker-end="url(#credential-initial-complete-sequence-plain-arrow)"/>
<rect x="680.0" y="1592" width="332" height="26" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="846.0" y="1611" text-anchor="middle"><tspan fill="#597265">取引と完成したSessionsの状態を確認</tspan></text>
<path d="M762 1707H594" fill="none" stroke="#597265" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#credential-initial-complete-sequence-plain-arrow)"/>
<rect x="538.0" y="1656" width="280" height="49" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="678.0" y="1675" text-anchor="middle"><tspan fill="#597265">complete ＋ 本人・世代・期限</tspan></text>
<text class="message" x="678.0" y="1698" text-anchor="middle"><tspan fill="#597265"></tspan><tspan fill="#477a93">接続証明</tspan><tspan fill="#597265">の実値は再発行しない</tspan></text>
<path d="M594 1771H258" fill="none" stroke="#597265" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#credential-initial-complete-sequence-plain-arrow)"/>
<rect x="336.0" y="1743" width="180" height="26" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="426.0" y="1762" text-anchor="middle"><tspan fill="#597265">同じ完了情報を中継</tspan></text>
<path d="M258 1858H426" fill="none" stroke="#477a93" stroke-width="1.8" marker-end="url(#credential-initial-complete-sequence-proof-arrow)"/>
<rect x="137.0" y="1807" width="410" height="49" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="342.0" y="1826" text-anchor="middle"><tspan fill="#477a93">Portal本人との一致を確認し、completeへ更新</tspan></text>
<text class="message" x="342.0" y="1849" text-anchor="middle"><tspan fill="#477a93">最初に保存した</tspan><tspan fill="#477a93">接続証明</tspan><tspan fill="#477a93">をそのまま保持</tspan></text>
<path d="M258 1922H90" fill="none" stroke="#597265" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#credential-initial-complete-sequence-plain-arrow)"/>
<rect x="50.0" y="1894" width="248" height="26" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="174.0" y="1913" text-anchor="middle"><tspan fill="#597265">完了通知 → API試用を再開</tspan></text>
<text class="footer" x="24" y="2013">接続済みAPI呼び出し図へ：接続証明はPortal側に保持し、Graph用アクセストークンはCMだけが保管する。</text></svg>
