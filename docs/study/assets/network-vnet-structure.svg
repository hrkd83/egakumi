<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-labelledby="title desc">
  <title id="title">egakumi-coreのVNet・アドレス空間・サブネット構造</title>
  <desc id="desc">公開設定例。1つのVNetに4つの/24アドレス空間を登録。10.40.0.0/24にAppGW、10.40.1.0/24にPrivate Endpoint。10.40.2.0/24をFirewall、APIM、管理VM、Container Appsの4つの/26サブネットに分割。10.40.3.0/24は予備でサブネットなし。</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; fill: #244c40; }
    .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
    .heading { font-size: 24px; font-weight: 650; }
    .label { font-size: 19px; font-weight: 600; }
    .copy { font-size: 18px; fill: #617462; }
    .subnet { fill: #fffefa; stroke: #b6c8ad; stroke-width: 1.4; }
    .space { fill: #edf3e7; stroke: #bdcfb4; stroke-width: 1.4; }
  </style>
  <rect x="8" y="8" width="1084" height="524" rx="12" fill="#f7f9f3" stroke="#547c67" stroke-width="2"/>
  <text x="32" y="46" class="heading">VNet</text>
  <text x="115" y="45" class="mono heading">vnet-&lt;環境名&gt;-&lt;製品名&gt;</text>
  <text x="32" y="77" class="copy">1環境につき1個 / 4つのアドレス空間 / 6つのサブネット</text>
  <text x="1058" y="45" class="copy" text-anchor="end">公開設定例</text>

  <rect x="32" y="98" width="506" height="123" rx="6" class="space"/>
  <text x="49" y="127" class="mono label">10.40.0.0/24</text>
  <rect x="49" y="143" width="472" height="59" rx="4" class="subnet"/>
  <text x="65" y="180" class="label">Application Gateway</text>
  <text x="503" y="180" class="mono copy" text-anchor="end">agw /24</text>

  <rect x="560" y="98" width="508" height="123" rx="6" class="space"/>
  <text x="577" y="127" class="mono label">10.40.1.0/24</text>
  <rect x="577" y="143" width="474" height="59" rx="4" class="subnet"/>
  <text x="593" y="180" class="label">Private Endpoint</text>
  <text x="1033" y="180" class="mono copy" text-anchor="end">pep /24</text>

  <rect x="32" y="240" width="1036" height="178" rx="6" class="space"/>
  <text x="49" y="271" class="mono label">10.40.2.0/24</text>
  <text x="1039" y="271" class="copy" text-anchor="end">64アドレスずつ、4区画に分割</text>
  <rect x="49" y="290" width="238" height="109" rx="4" class="subnet"/>
  <text x="65" y="320" class="label">Azure Firewall</text>
  <text x="65" y="349" class="mono copy">10.40.2.0/26</text>
  <text x="65" y="380" class="copy">Firewall専用</text>
  <rect x="304" y="290" width="238" height="109" rx="4" class="subnet"/>
  <text x="320" y="320" class="label">API Management</text>
  <text x="320" y="349" class="mono copy">10.40.2.64/26</text>
  <text x="320" y="380" class="copy">apim / 内部API処理</text>
  <rect x="559" y="290" width="238" height="109" rx="4" class="subnet"/>
  <text x="575" y="320" class="label">管理VM</text>
  <text x="575" y="349" class="mono copy">10.40.2.128/26</text>
  <text x="575" y="380" class="copy">vm / 配備・保守</text>
  <rect x="814" y="290" width="237" height="109" rx="4" class="subnet"/>
  <text x="830" y="320" class="label">Container Apps</text>
  <text x="830" y="349" class="mono copy">10.40.2.192/26</text>
  <text x="830" y="380" class="copy">aca / Portal等</text>

  <rect x="32" y="437" width="1036" height="73" rx="6" fill="none" stroke="#9eaf93" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="49" y="466" class="mono label">10.40.3.0/24</text>
  <text x="49" y="494" class="copy">拡張用の予備 / アドレス空間に含めるが、サブネットは作成しない</text>
</svg>
