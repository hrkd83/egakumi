<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="1300" viewBox="0 0 1540 1300" role="img" aria-labelledby="credential-runtime-title credential-runtime-desc">
  <title id="credential-runtime-title">Credential BrokerとAPIM Credential Managerの実行構成</title>
  <desc id="credential-runtime-desc">呼出元は公開GatewayのAPIMを利用する。APIMは内部Container AppsのBrokerへ共有鍵付きHTTPSを送り、SQLの本人・APIMサブスクリプション・接続・セッションを照合する。BrokerはマネージドIDでARM上のCredential Managerの接続と利用権限を管理する。APIMは自身のマネージドIDでCMの接続からトークンを取得し、Graphへ本人として接続する。SQLはOAuthトークンを保持しない。手動スキーマJobと毎時17分の照合Jobは同じイメージを使う。下段は管理VMからACRへの登録と、Container Apps基盤からACRへの取得を独立して示す。</desc>
  <defs>
    <marker id="runtime-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#006b5e" stroke-width="1.4"/></marker>
    <marker id="arm-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#426a93" stroke-width="1.4"/></marker>
    <marker id="platform-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#8a7353" stroke-width="1.4"/></marker>
    <style>
      text{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;fill:#243b34}
      .title{font-size:24px;font-weight:700}.head{font-size:18px;font-weight:650}.body{font-size:14px}.small{font-size:12px;fill:#627366}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}.tag{font-size:11px;letter-spacing:1px;font-weight:650;fill:#006b5e}.node{fill:#fffefa;stroke:#bccdbd;stroke-width:1.5}.primary{fill:#164c43;stroke:#164c43}.white{fill:#fffefa}.light{fill:#d5e4d6}.panel{fill:#f3f6ee;stroke:#d3decd;stroke-width:1.4}.runtime{fill:none;stroke:#006b5e;stroke-width:2;marker-end:url(#runtime-arrow)}.arm{fill:none;stroke:#426a93;stroke-width:2;marker-end:url(#arm-arrow)}.platform{fill:none;stroke:#8a7353;stroke-width:1.8;stroke-dasharray:6 4;marker-end:url(#platform-arrow)}.label{font-size:12px;fill:#4b6354;paint-order:stroke;stroke:#fffefa;stroke-width:5px;stroke-linejoin:round}.arm-label{fill:#426a93}.section{font-size:16px;font-weight:650}.note{font-size:13px;fill:#536b5b}
    </style>
  </defs>
  <rect width="1540" height="1300" rx="10" fill="#fffefa"/>
  <text class="title" x="30" y="35">Credential BrokerとAPIM Credential Manager</text>
  <text class="small" x="1510" y="35" text-anchor="end">矢印は要求先へ向く。応答は同じ経路で戻る。</text>

  <!-- 通常通信・管理要求。矢印はノードの中を通らず、対象の境界で終える。 -->
  <path class="runtime" d="M250 265H310"/>
  <text class="label" x="280" y="247" text-anchor="middle">HTTPS</text>
  <path class="runtime" d="M650 265H710"/>
  <text class="label" x="680" y="247" text-anchor="middle">内部HTTPS</text>
  <path class="runtime" d="M1060 265H1120"/>
  <text class="label" x="1090" y="247" text-anchor="middle">1433 / TLS</text>
  <path class="runtime" d="M480 190V140"/>
  <text class="label" x="493" y="170">Bearer token</text>
  <path class="runtime" d="M480 340V470"/>
  <text class="label" x="493" y="397">get-authorization-context</text>
  <text class="label" x="493" y="417">APIMのシステム割当ID</text>
  <path class="arm" d="M885 340V470"/>
  <text class="label arm-label" x="899" y="397">ARM / Broker実行ID</text>
  <text class="label arm-label" x="899" y="417">接続・権限・ログインURL</text>
  <path class="arm" d="M710 535H650"/>
  <text class="label arm-label" x="680" y="518" text-anchor="middle">設定を管理</text>
  <path class="runtime" d="M1060 305H1090V535H1120"/>
  <text class="label" x="1101" y="450">本人確認</text>
  <path class="runtime" d="M480 600V650H1295V600"/>
  <text class="label" x="740" y="641">CMによる同意・トークンの取得／更新</text>
  <path class="arm" d="M885 720V600"/>
  <text class="label arm-label" x="898" y="695">接続メタデータを照合</text>
  <path class="runtime" d="M1060 775H1105V375H1295V340"/>
  <text class="label" x="1205" y="367">照合結果・期限切れ状態を更新</text>
  <path class="runtime" d="M1470 775H1500V305H1470"/>
  <text class="label" x="1486" y="695" text-anchor="end">SQL定義・権限を準備</text>

  <!-- 基盤からの秘密参照・ログ転送。業務データの経路とは線種を分ける。 -->
  <path class="platform" d="M310 310H280V900"/>
  <path class="platform" d="M710 310H680V952H630"/>
  <path class="platform" d="M1060 325H1115V900"/>
  <path class="platform" d="M885 830V900"/>
  <path class="platform" d="M1295 830V900"/>

  <rect class="node" x="30" y="190" width="220" height="150" rx="8"/>
  <text class="head" x="47" y="220">Portal・呼出元Backend</text>
  <text class="body" x="47" y="244" style="font-size:12px"><tspan x="47">APIMサブスクリプションキー</tspan><tspan x="47" dy="20">＋ 本人セッション</tspan></text>
  <text class="head" x="47" y="282">利用者ブラウザー</text>
  <text class="body" x="47" y="310">Gatewayの認証案内を開く</text>

  <rect class="node primary" x="310" y="190" width="340" height="150" rx="8"/>
  <text class="tag light" x="328" y="214">公開GATEWAY / 内部APIM</text>
  <text class="head white" x="328" y="243">APIMポリシー</text>
  <text class="body light" x="328" y="269">APIMサブスクリプションを認可</text>
  <text class="body light" x="328" y="294">Brokerで接続確認、CMからtoken取得</text>
  <text class="body light" x="328" y="319">Graphで本人を照合してAPIを実行</text>

  <rect class="node primary" x="710" y="190" width="350" height="150" rx="8"/>
  <text class="tag light" x="728" y="214">内部CONTAINER APPS / cae-${stem}</text>
  <text class="head white" x="728" y="243">Credential Broker / FastAPI</text>
  <text class="mono light" x="728" y="267">ca-${stem}-credential-broker</text>
  <text class="body light" x="728" y="289" style="font-size:12px"><tspan x="728">本人・APIMサブスクリプション・接続を管理</tspan><tspan x="728" dy="18">期限・失効状態も管理</tspan></text>
  <text class="body light" x="728" y="327" style="font-size:12px">入口認証：X-Core-Broker-Key</text>

  <rect class="node" x="1120" y="190" width="350" height="150" rx="8"/>
  <text class="head" x="1138" y="219">Azure SQL / Private Endpoint</text>
  <text class="mono" x="1138" y="244">sqldb-${stem}-credentials</text>
  <text class="body" x="1138" y="270">プール・接続・取引・セッション台帳</text>
  <text class="body" x="1138" y="294">SQL認証：各実行単位のマネージドID</text>
  <text class="small" x="1138" y="318">OAuthのaccess / refresh tokenは保存しない</text>

  <rect class="node" x="310" y="65" width="340" height="75" rx="8"/>
  <text class="head" x="328" y="95">Microsoft Graph /me</text>
  <text class="body" x="328" y="121">CM tokenの本人照合・本人情報の取得</text>

  <rect class="node" x="310" y="470" width="340" height="130" rx="8"/>
  <text class="tag" x="328" y="494">APIMの管理機能</text>
  <text class="head" x="328" y="522">Credential Manager（CM）</text>
  <text class="body" x="328" y="548">provider → 接続 → 接続のaccess policy</text>
  <text class="body" x="328" y="572">OAuth access / refresh tokenを保持・更新</text>

  <rect class="node" x="710" y="470" width="350" height="130" rx="8"/>
  <text class="tag" x="728" y="494">AZUREの管理API / 2024-05-01</text>
  <text class="head" x="728" y="522">management.azure.com</text>
  <text class="body" x="728" y="548">authorizationProviders / authorizations</text>
  <text class="body" x="728" y="572">接続作成・状態照会・削除・getLoginLinks</text>

  <rect class="node" x="1120" y="470" width="350" height="130" rx="8"/>
  <text class="head" x="1138" y="502">Microsoft Entra ID</text>
  <text class="body" x="1138" y="531">Broker：MSAL / OIDCで本人を確認</text>
  <text class="body" x="1138" y="556">CM：OAuth同意とtokenの取得・更新</text>
  <text class="small" x="1138" y="581">ブラウザーはGatewayの案内から認証へ進む</text>

  <text class="section" x="30" y="737">同じCAE上の2つのJob</text>
  <text class="body" x="30" y="764">Brokerと同じイメージを別コマンドで実行</text>
  <text class="small" x="30" y="789">Job定義とID・権限は、実行終了後も残る</text>
  <text class="small" x="30" y="813">緑：通常の通信　青：CMの管理要求</text>
  <text class="small" x="30" y="837">点線：起動時の参照・ログ転送・配布</text>

  <rect class="node" x="710" y="720" width="350" height="110" rx="8"/>
  <text class="head" x="728" y="748">定期照合Job / 毎時17分</text>
  <text class="mono" x="728" y="773">caj-${stem}-recon</text>
  <text class="body" x="728" y="799">cli reconcile --execute / Broker実行ID</text>
  <text class="small" x="728" y="819">CMとの照合、期限切れ状態・削除中の回収</text>

  <rect class="node" x="1120" y="720" width="350" height="110" rx="8"/>
  <text class="head" x="1138" y="748">SQL初期化Job / 配備ごとに起動</text>
  <text class="mono" x="1138" y="773">caj-${stem}-schema</text>
  <text class="body" x="1138" y="799">cli migrate / スキーマ管理ID</text>
  <text class="small" x="1138" y="819">未適用SQL・実行権限・プール設定を準備</text>

  <rect class="node" x="30" y="900" width="600" height="105" rx="8"/>
  <text class="head" x="48" y="930">Key Vault</text>
  <text class="body" x="48" y="957">APIM：Named ValueでBroker共有鍵を参照</text>
  <text class="body" x="48" y="983">Broker：起動用secret参照で共有鍵・Entraアプリsecretを取得</text>
  <rect class="node" x="710" y="900" width="760" height="105" rx="8"/>
  <text class="head" x="728" y="930">Azure Monitor / Log Analytics</text>
  <text class="body" x="728" y="957">共用CAEのconsole / systemログ。照合Jobは件数などの集計結果を出力。</text>
  <text class="small" x="728" y="983">BrokerのUvicornアクセスログは無効。token・Cookie・OAuth queryを出力しない。</text>

  <rect class="panel" x="15" y="1055" width="1510" height="225" rx="9"/>
  <text class="section" x="30" y="1085">起動用イメージの登録と取得</text>
  <text class="note" x="30" y="1109">管理VMはACRへPush。Container Apps基盤は、実行単位に設定されたIDでACRからPullする。</text>
  <path class="platform" d="M280 1180H370"/>
  <text class="label" x="325" y="1163" text-anchor="middle">Push</text>
  <path class="platform" d="M800 1180H670"/>
  <text class="label" x="735" y="1163" text-anchor="middle">Pull要求</text>
  <rect class="node" x="30" y="1130" width="250" height="105" rx="8"/>
  <text class="head" x="48" y="1160">管理VM / Docker build</text>
  <text class="body" x="48" y="1187">既存VMで同一ソースをビルド</text>
  <text class="small" x="48" y="1213">VMのIDに一時AcrPush</text>
  <rect class="node" x="370" y="1130" width="300" height="105" rx="8"/>
  <text class="head" x="388" y="1160">非公開ACR</text>
  <text class="mono" x="388" y="1187">credential-broker@sha256:…</text>
  <text class="small" x="388" y="1213">同じdigestを3実行単位で使用</text>
  <rect class="node" x="800" y="1130" width="670" height="105" rx="8"/>
  <text class="head" x="818" y="1160">Container Apps基盤 / AcrPull</text>
  <text class="body" x="818" y="1187">Broker・照合Job：Broker実行ID　／　SQL初期化Job：スキーマ管理ID</text>
  <text class="small" x="818" y="1213">SQLの台帳操作とCMのtoken利用は、上段の通信経路で行う</text>
  <text class="small" x="30" y="1260">出典：apps/gateway/deploy/{main,broker,credential-manager,credential-access,broker-access}.bicep、credential_broker/{cm,cli,store}.py</text>
</svg>
