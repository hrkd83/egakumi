<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="auth-er-title auth-er-desc">
  <title id="auth-er-title">Portalのサインインを支える認証4テーブルのER図</title>
  <desc id="auth-er-desc">portalUserはログイン本人、portalSessionはログイン状態、portalAccountは外部認証アカウントとの対応、portalVerificationは認証途中の検証情報を保持する。portalSession.userIdとportalAccount.userIdがそれぞれportalUser.idを参照する2本の物理外部キーを持ち、本人削除時は子行も削除する。portalVerificationは独立表。キー台帳への物理外部キーはない。</desc>
  <defs>
    <marker id="auth-fk-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#607f73" stroke-width="1.3"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;fill:#1e302d}
      .canvas{fill:#fffefa}.card{fill:#fffefa;stroke:#cad9cc;stroke-width:1.3}.head{fill:#eaf2e9}.rule{stroke:#d4e0d7;stroke-width:1}
      .title{font-size:21px;font-weight:700}.subtitle{font-size:12px;fill:#63716c}.table{font-family:Consolas,monospace;font-size:17px;font-weight:700}
      .purpose{font-size:12px;fill:#52675c}.field{font-family:Consolas,monospace;font-size:13px}.badge{font-family:Consolas,monospace;font-size:11px;font-weight:700;fill:#006b5e}
      .note{font-size:12px;fill:#63716c}.edge{fill:none;stroke:#607f73;stroke-width:1.6;marker-end:url(#auth-fk-arrow)}.relation{font-size:12px;fill:#006b5e}
    </style>
  </defs>
  <rect class="canvas" width="1200" height="760" rx="8"/>
  <text class="title" x="40" y="32">認証機能のデータ構造</text>
  <text class="subtitle" x="40" y="55">認証4表 / 主な列を抜粋 / 実線はSQLの物理外部キー（親から子へ）</text>

  <path class="edge" d="M470 310V355H215V410"/>
  <text class="relation" x="225" y="343">User 1 → Session 0..N</text>
  <text class="relation" x="225" y="382">ON DELETE CASCADE</text>
  <path class="edge" d="M690 310V410"/>
  <text class="relation" x="704" y="350">1 → 0..N</text>
  <text class="relation" x="704" y="375">ON DELETE CASCADE</text>

  <g aria-label="portalUser：ログインする本人を識別する">
    <rect class="card" x="420" y="80" width="360" height="230" rx="7"/>
    <path class="head" d="M427 80H773a7 7 0 0 1 7 7V152H420V87a7 7 0 0 1 7-7Z"/>
    <text class="table" x="438" y="108">portalUser</text>
    <text class="purpose" x="438" y="134">目的：ログインする本人を識別</text>
    <path class="rule" d="M420 152H780"/>
    <text class="field" x="438" y="182">id</text><text class="badge" x="762" y="182" text-anchor="end">PK</text>
    <text class="field" x="438" y="208">entraTenantId, entraObjectId</text><text class="badge" x="762" y="208" text-anchor="end">UQ</text>
    <text class="field" x="438" y="234">email</text><text class="badge" x="762" y="234" text-anchor="end">UQ</text>
    <text class="field" x="438" y="260">name / image</text>
    <text class="field" x="438" y="286">createdAt / updatedAt</text>
  </g>

  <g aria-label="portalSession：ログイン状態と有効期限を管理する">
    <rect class="card" x="40" y="410" width="350" height="230" rx="7"/>
    <path class="head" d="M47 410H383a7 7 0 0 1 7 7V482H40V417a7 7 0 0 1 7-7Z"/>
    <text class="table" x="58" y="438">portalSession</text>
    <text class="purpose" x="58" y="464">目的：ログイン状態・有効期限を管理</text>
    <path class="rule" d="M40 482H390"/>
    <text class="field" x="58" y="512">id</text><text class="badge" x="372" y="512" text-anchor="end">PK</text>
    <text class="field" x="58" y="538">userId</text><text class="badge" x="372" y="538" text-anchor="end">FK → User.id</text>
    <text class="field" x="58" y="564">token</text><text class="badge" x="372" y="564" text-anchor="end">UQ</text>
    <text class="field" x="58" y="590">expiresAt</text>
    <text class="field" x="58" y="616">ipAddress / userAgent</text>
  </g>

  <g aria-label="portalAccount：Microsoftアカウントと本人を関連付ける">
    <rect class="card" x="425" y="410" width="350" height="230" rx="7"/>
    <path class="head" d="M432 410H768a7 7 0 0 1 7 7V482H425V417a7 7 0 0 1 7-7Z"/>
    <text class="table" x="443" y="438">portalAccount</text>
    <text class="purpose" x="443" y="464">目的：Microsoftアカウントと本人を関連付ける</text>
    <path class="rule" d="M425 482H775"/>
    <text class="field" x="443" y="512">id</text><text class="badge" x="757" y="512" text-anchor="end">PK</text>
    <text class="field" x="443" y="538">userId</text><text class="badge" x="757" y="538" text-anchor="end">FK → User.id</text>
    <text class="field" x="443" y="564">providerId, accountId</text><text class="badge" x="757" y="564" text-anchor="end">UQ</text>
    <text class="note" x="443" y="590">OAuthトークン・password列はNULL固定</text>
    <text class="field" x="443" y="616">createdAt / updatedAt</text>
  </g>

  <g aria-label="portalVerification：認証途中の検証情報を一時保存する独立表">
    <rect class="card" x="810" y="410" width="350" height="230" rx="7"/>
    <path class="head" d="M817 410H1153a7 7 0 0 1 7 7V482H810V417a7 7 0 0 1 7-7Z"/>
    <text class="table" x="828" y="438">portalVerification</text>
    <text class="purpose" x="828" y="464">目的：認証途中の検証情報を一時保存</text>
    <path class="rule" d="M810 482H1160"/>
    <text class="field" x="828" y="512">id</text><text class="badge" x="1142" y="512" text-anchor="end">PK</text>
    <text class="field" x="828" y="538">identifier / value</text>
    <text class="field" x="828" y="564">expiresAt</text>
    <text class="field" x="828" y="590">createdAt / updatedAt</text>
    <text class="note" x="828" y="616">物理FKなし</text>
  </g>

  <path class="rule" d="M40 675H1160"/>
  <text class="note" x="40" y="697">PK：主キー　FK：外部キー　UQ：一意制約。複数列を並べたUQは、その列の組み合わせが一意。</text>
  <text class="note" x="40" y="721">キー台帳への物理FKはない。キーの作成者・操作主体はEntra Object IDで記録する。</text>
  <text class="note" x="40" y="745">出典：apps/portal/sql/001_initial.sql。User削除時は、そのSession・AccountをON DELETE CASCADEで削除する。</text>
</svg>
