<text class="message" x="426.0" y="348" text-anchor="middle"><tspan fill="#597265">listSecretsで主キーを取得</tspan></text>
<path d="M594 421H258" fill="none" stroke="#357965" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#credential-connected-sequence-key-arrow)"/>
<rect x="384.0" y="393" width="84" height="26" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="426.0" y="412" text-anchor="middle"><tspan fill="#357965"></tspan><tspan fill="#357965">APIキー</tspan><tspan fill="#357965"></tspan></text>
<path d="M258 485H426" fill="none" stroke="#477a93" stroke-width="1.8" marker-end="url(#credential-connected-sequence-proof-arrow)"/>
<rect x="225.0" y="457" width="234" height="26" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="342.0" y="476" text-anchor="middle"><tspan fill="#477a93">暗号化した保存状態を読取</tspan></text>
<rect x="105.0" y="527" width="306" height="51" rx="6" fill="#edf3e9" stroke="#d0dccb"/>
<text class="note" x="120.0" y="555" style="fill:#477a93">Portalサーバーが接続証明を復号</text>
<path d="M258 643H594" fill="none" stroke="#477a93" stroke-width="1.8" marker-end="url(#credential-connected-sequence-proof-arrow)"/>
<rect x="307.0" y="592" width="238" height="49" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="426.0" y="611" text-anchor="middle"><tspan fill="#477a93">GET /tools/graph/v1/me</tspan></text>
<text class="message" x="426.0" y="634" text-anchor="middle"><tspan fill="#477a93"></tspan><tspan fill="#357965">APIキー</tspan><tspan fill="#477a93"> ＋ </tspan><tspan fill="#477a93">接続証明</tspan><tspan fill="#477a93"></tspan></text>
<rect x="374.0" y="685" width="440" height="51" rx="6" fill="#edf3e9" stroke="#d0dccb"/>
<text class="note" x="389.0" y="713" style="fill:#597265">APIキーを検証し、実サブスクリプションIDを確定</text>
<path d="M594 801H762" fill="none" stroke="#477a93" stroke-width="1.8" marker-end="url(#credential-connected-sequence-proof-arrow)"/>
<rect x="514.0" y="750" width="328" height="49" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="678.0" y="769" text-anchor="middle"><tspan fill="#477a93">POST /v2/session/authorize</tspan></text>
<text class="message" x="678.0" y="792" text-anchor="middle"><tspan fill="#477a93"></tspan><tspan fill="#477a93">接続証明</tspan><tspan fill="#477a93"> ＋ 検証済みID ＋ profile</tspan></text>
<path d="M762 888H930" fill="none" stroke="#477a93" stroke-width="1.8" marker-end="url(#credential-connected-sequence-proof-arrow)"/>
<rect x="666.0" y="837" width="360" height="49" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="846.0" y="856" text-anchor="middle"><tspan fill="#477a93">ハッシュ・本人・接続・期限・失効を照合</tspan></text>
<text class="message" x="846.0" y="879" text-anchor="middle"><tspan fill="#477a93">authorizeでは未利用期限を延長しない</tspan></text>
<path d="M762 952H594" fill="none" stroke="#597265" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#credential-connected-sequence-plain-arrow)"/>
<rect x="488.0" y="924" width="380" height="26" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="678.0" y="943" text-anchor="middle"><tspan fill="#597265">利用可能な物理CM接続・期待する本人・期限</tspan></text>
<path d="M594 1039H1098" fill="none" stroke="#597265" stroke-width="1.8" marker-end="url(#credential-connected-sequence-plain-arrow)"/>
<rect x="712.0" y="988" width="268" height="49" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="846.0" y="1007" text-anchor="middle"><tspan fill="#597265">get-authorization-context</tspan></text>
<text class="message" x="846.0" y="1030" text-anchor="middle"><tspan fill="#597265">APIMのシステム割当MI</tspan></text>
<rect x="1021" y="1072" width="322" height="194" rx="7" fill="#faf6ed" fill-opacity=".65" stroke="#cabb9b" stroke-dasharray="7 5"/>
<text class="frame-label" x="1034" y="1100">必要な場合だけ：CMがトークンを更新</text>
