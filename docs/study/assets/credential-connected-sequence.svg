<rect x="1056.0" y="1123" width="252" height="26" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="1182.0" y="1142" text-anchor="middle"><tspan fill="#597265">更新トークンで再取得を要求</tspan></text>
<path d="M1266 1215H1098" fill="none" stroke="#9a7846" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#credential-connected-sequence-token-arrow)"/>
<rect x="1074.0" y="1187" width="216" height="26" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="1182.0" y="1206" text-anchor="middle"><tspan fill="#9a7846"></tspan><tspan fill="#9a7846">アクセストークン</tspan><tspan fill="#9a7846">を発行</tspan></text>
<path d="M1098 1305H594" fill="none" stroke="#9a7846" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#credential-connected-sequence-token-arrow)"/>
<rect x="765.0" y="1277" width="162" height="26" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="846.0" y="1296" text-anchor="middle"><tspan fill="#9a7846"></tspan><tspan fill="#9a7846">アクセストークン</tspan><tspan fill="#9a7846"></tspan></text>
<path d="M594 1392H1434" fill="none" stroke="#9a7846" stroke-width="1.8" marker-end="url(#credential-connected-sequence-token-arrow)"/>
<rect x="898.0" y="1341" width="232" height="49" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="1014.0" y="1360" text-anchor="middle"><tspan fill="#9a7846">① 本人確認用 GET /me</tspan></text>
<text class="message" x="1014.0" y="1383" text-anchor="middle"><tspan fill="#9a7846">Bearer </tspan><tspan fill="#9a7846">アクセストークン</tspan><tspan fill="#9a7846"></tspan></text>
<path d="M1434 1456H594" fill="none" stroke="#597265" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#credential-connected-sequence-plain-arrow)"/>
<rect x="878.0" y="1428" width="272" height="26" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="1014.0" y="1447" text-anchor="middle"><tspan fill="#597265">トークン検証後、本人IDを返す</tspan></text>
<rect x="397.0" y="1498" width="394" height="51" rx="6" fill="#edf3e9" stroke="#d0dccb"/>
<text class="note" x="412.0" y="1526" style="fill:#597265">Graph本人IDをBrokerの期待する本人と照合</text>
<path d="M594 1614H762" fill="none" stroke="#477a93" stroke-width="1.8" marker-end="url(#credential-connected-sequence-proof-arrow)"/>
<rect x="541.0" y="1563" width="274" height="49" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="678.0" y="1582" text-anchor="middle"><tspan fill="#477a93">POST /v2/session/use</tspan></text>
<text class="message" x="678.0" y="1605" text-anchor="middle"><tspan fill="#477a93"></tspan><tspan fill="#477a93">接続証明</tspan><tspan fill="#477a93"> ＋ 検証済みの本人ID</tspan></text>
<path d="M762 1701H930" fill="none" stroke="#597265" stroke-width="1.8" marker-end="url(#credential-connected-sequence-plain-arrow)"/>
<rect x="657.0" y="1650" width="378" height="49" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="846.0" y="1669" text-anchor="middle"><tspan fill="#597265">本人・失効状態を再照合し、業務利用を確定</tspan></text>
<text class="message" x="846.0" y="1692" text-anchor="middle"><tspan fill="#597265">最終利用時刻・未利用期限を更新</tspan></text>
<path d="M762 1765H594" fill="none" stroke="#597265" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#credential-connected-sequence-plain-arrow)"/>
<rect x="471.0" y="1737" width="414" height="26" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="678.0" y="1756" text-anchor="middle"><tspan fill="#597265">世代・期限（更新時期なら新証明の候補も返す）</tspan></text>
<path d="M594 1852H1434" fill="none" stroke="#9a7846" stroke-width="1.8" marker-end="url(#credential-connected-sequence-token-arrow)"/>
<rect x="864.0" y="1801" width="300" height="49" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="1014.0" y="1820" text-anchor="middle"><tspan fill="#9a7846">② 業務API GET /me?$select=…</tspan></text>
<text class="message" x="1014.0" y="1843" text-anchor="middle"><tspan fill="#9a7846">同じBearer</tspan><tspan fill="#9a7846">アクセストークン</tspan><tspan fill="#9a7846"></tspan></text>
<path d="M1434 1916H594" fill="none" stroke="#597265" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#credential-connected-sequence-plain-arrow)"/>
<rect x="945.0" y="1888" width="138" height="26" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="1014.0" y="1907" text-anchor="middle"><tspan fill="#597265">業務APIの結果</tspan></text>
<path d="M594 2003H258" fill="none" stroke="#597265" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#credential-connected-sequence-plain-arrow)"/>
<rect x="272.0" y="1952" width="308" height="49" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="426.0" y="1971" text-anchor="middle"><tspan fill="#597265">業務結果 ＋ 検証済みの世代・期限</tspan></text>
<text class="message" x="426.0" y="1994" text-anchor="middle"><tspan fill="#597265">OAuth</tspan><tspan fill="#9a7846">アクセストークン</tspan><tspan fill="#597265">は返さない</tspan></text>
<path d="M258 2067H426" fill="none" stroke="#597265" stroke-width="1.8" marker-end="url(#credential-connected-sequence-plain-arrow)"/>
<rect x="198.0" y="2039" width="288" height="26" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="342.0" y="2058" text-anchor="middle"><tspan fill="#597265">接続の期限・世代等を暗号化保存</tspan></text>
<rect x="44.0" y="2109" width="428" height="51" rx="6" fill="#edf3e9" stroke="#d0dccb"/>
<text class="note" x="59.0" y="2137" style="fill:#597265">応答の本人IDも確認し、接続管理ヘッダーを除去</text>
<path d="M258 2202H90" fill="none" stroke="#597265" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#credential-connected-sequence-plain-arrow)"/>
<rect x="77.0" y="2174" width="194" height="26" rx="3" fill="#fffefa" fill-opacity=".97"/>
<text class="message" x="174.0" y="2193" text-anchor="middle"><tspan fill="#597265">Graphの表示結果のみ</tspan></text>
<text class="footer" x="24" y="2293">更新候補を受領した場合は、Portal SQLへ先に保存してcommitする。未確定候補は次の業務APIより先に回収する。</text></svg>
