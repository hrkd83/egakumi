<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
<title id="title">Portalの認証4表・スキーマ版・本人接続状態の全6表</title>
<desc id="desc">UserからSessionとAccountへそれぞれ1対多の外部キー。両方ともON DELETE CASCADE。Verification、SchemaVersions、ConnectionStateは独立表で物理外部キーはない。APIMサブスクリプション台帳の作成者Object IDをportalUser.idへ結ぶ外部キーもない。</desc>
<defs>
<marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
<path d="M0 0 L7 3.5 L0 7" fill="none" stroke="#607f73" stroke-width="1.2"/>
</marker>
</defs>
<style>text{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;fill:#1e302d}.bg{fill:#fffefa}.panel{fill:#f6f8f1;stroke:#dbe4d7}.card{fill:#fffefa;stroke:#cad9cc}.head{fill:#eaf2e9}.refhead{fill:#edf0eb}.title{font-size:20px;font-weight:700}.small{font-size:12px;fill:#63716c}.paneltitle{font-size:14px;font-weight:700;fill:#006b5e}.table{font-family:Consolas,monospace;font-size:14px;font-weight:700}.purpose{font-size:10.5px;fill:#52675c}.field{font-family:Consolas,monospace;font-size:12px}.fk{fill:none;stroke:#607f73;stroke-width:1.5;marker-end:url(#arrow)}.edge{font-size:11px;fill:#006b5e}.ref{font-size:10px;fill:#758278}.note{font-size:11px;fill:#63716c}</style>
<rect class="bg" width="1000" height="760"/>
<text class="title" x="25" y="33">Portalの認証・本人接続・版管理</text>
<text class="small" x="25" y="57">利用者の認証情報と、APIキーを所有するEntraグループは別の関係。</text>
<g aria-label="portalUser：ログインする本人とEntra IDを対応付ける">
<rect class="card" x="350" y="83" width="300" height="135" rx="5"/>
<path class="head" d="M355 83h290a5 5 0 0 1 5 5v50H350v-50a5 5 0 0 1 5-5Z"/>
<text class="table" x="362" y="106">portalUser</text>
<text class="purpose" x="362" y="126">目的：ログインする本人とEntra IDを対応付ける</text>
<text class="field" x="362" y="158">PK id</text>
<text class="field" x="362" y="179">UQ entraTenantId, entraObjectId</text>
<text class="field" x="362" y="200">UQ email</text>
</g>
<g aria-label="portalSession：ログイン状態・有効期限を管理">
<rect class="card" x="25" y="290" width="285" height="135" rx="5"/>
<path class="head" d="M30 290h275a5 5 0 0 1 5 5v50H25v-50a5 5 0 0 1 5-5Z"/>
<text class="table" x="37" y="313">portalSession</text>
<text class="purpose" x="37" y="333">目的：ログイン状態・有効期限を管理</text>
<text class="field" x="37" y="365">PK id; FK userId</text>
<text class="field" x="37" y="386">UQ token; expiresAt</text>
<text class="field" x="37" y="407">ipAddress / userAgent</text>
</g>
<g aria-label="portalAccount：Microsoftアカウントと本人を関連付ける">
<rect class="card" x="350" y="290" width="300" height="135" rx="5"/>
<path class="head" d="M355 290h290a5 5 0 0 1 5 5v50H350v-50a5 5 0 0 1 5-5Z"/>
<text class="table" x="362" y="313">portalAccount</text>
<text class="purpose" x="362" y="333">目的：Microsoftアカウントと本人を関連付ける</text>
<text class="field" x="362" y="365">PK id; FK userId</text>
<text class="field" x="362" y="386">UQ providerId, accountId</text>
<text class="field" x="362" y="407">OAuth資格情報列はNULL固定</text>
</g>
<path class="fk" d="M400 218V245H165V290"/>
<text class="edge" x="175" y="236" text-anchor="start">1 → 0..N / DELETE CASCADE</text>
<path class="fk" d="M550 218V290"/>
<text class="edge" x="558" y="246" text-anchor="start">1 → 0..N</text>
<text class="edge" x="558" y="267">DELETE CASCADE</text>
<g aria-label="portalVerification：認証途中の検証情報を一時保存">
<rect class="card" x="690" y="290" width="285" height="135" rx="5"/>
<path class="head" d="M695 290h275a5 5 0 0 1 5 5v50H690v-50a5 5 0 0 1 5-5Z"/>
<text class="table" x="702" y="313">portalVerification</text>
<text class="purpose" x="702" y="333">目的：認証途中の検証情報を一時保存</text>
<text class="field" x="702" y="365">PK id</text>
<text class="field" x="702" y="386">identifier / value / expiresAt</text>
<text class="field" x="702" y="407">物理FKなし</text>
</g>
<g aria-label="portalSchemaVersions：SQL定義の適用済み版を記録">
<rect class="card" x="25" y="530" width="285" height="135" rx="5"/>
<path class="head" d="M30 530h275a5 5 0 0 1 5 5v50H25v-50a5 5 0 0 1 5-5Z"/>
<text class="table" x="37" y="553">portalSchemaVersions</text>
<text class="purpose" x="37" y="573">目的：SQL定義の適用済み版を記録</text>
<text class="field" x="37" y="605">PK version</text>
<text class="field" x="37" y="626">appliedAt</text>
<text class="field" x="37" y="647">物理FKなし</text>
</g>
<g aria-label="portalConnectionState：本人接続の状態を暗号化し、同時更新を制御">
<rect class="card" x="350" y="530" width="625" height="135" rx="5"/>
<path class="head" d="M355 530h615a5 5 0 0 1 5 5v50H350v-50a5 5 0 0 1 5-5Z"/>
<text class="table" x="362" y="553">portalConnectionState</text>
<text class="purpose" x="362" y="573">目的：本人接続の状態を暗号化し、同時更新を制御</text>
<text class="field" x="362" y="605">PK bindingHash</text>
<text class="field" x="362" y="626">revision / stateCiphertext（暗号化）</text>
<text class="field" x="362" y="647">leaseToken / leaseUntil / updatedAt; 物理FKなし</text>
</g>
<text class="note" x="25" y="704">actorObjectId 等はEntraのObject ID。portalUser.idへのFKとして描かない。</text>
<text class="note" x="25" y="728">出典：001_initial.sql・010_connection_sessions.sql。本人接続状態は暗号化し、版数と期限付きの占有権で同時更新を制御。</text>
</svg>
