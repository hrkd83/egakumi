name: Public data guard

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pending:
    name: Mark trusted inspection pending
    if: ${{ github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Mark the exact pull request head pending
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 -I -S - <<'PY'
          from pathlib import Path
          import json
          import os
          import re
          import sys
          from urllib.request import Request, urlopen

          try:
              repository = "hrkd83/egakumi"
              event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
              request = event["pull_request"]
              sha = request["head"]["sha"]
              if (os.environ.get("GITHUB_REPOSITORY") != repository
                      or request["base"]["repo"]["full_name"] != repository
                      or not re.fullmatch(r"[0-9a-f]{40}", sha)
                      or type(event["number"]) is not int or event["number"] <= 0):
                  raise ValueError
              payload = json.dumps({
                  "state": "pending", "context": "Public data guard",
                  "description": "Trusted static inspection is pending.",
              }).encode()
              api_request = Request(
                  "https://api.github.com/repos/" + repository + "/statuses/" + sha,
                  data=payload, method="POST", headers={
                      "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urlopen(api_request, timeout=30) as response:
                  if response.status != 201:
                      raise ValueError
          except Exception:
              print("Public-data guard: status reporting failed.", file=sys.stderr)
              raise SystemExit(1)
          print("Public-data guard: trusted inspection marked pending.")
          PY

  scan:
    name: Trusted public data inspection
    needs: [pending]
    if: ${{ always() && (github.event_name != 'pull_request_target' || needs.pending.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - name: Check out trusted base or the push object store
        # Official actions/checkout refs/tags/v4 verified against GitHub.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect Git objects with trusted code and policy
        env:
          GUARD_BOOTSTRAP_REVISION: ${{ vars.PUBLIC_DATA_GUARD_BOOTSTRAP_REVISION }}
        shell: bash
        run: |
          python3 -I -S - <<'PY'
          from pathlib import Path
          import json
          import os
          import re
          import subprocess
          import sys
          import tempfile

          repository = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          expected_repository = "hrkd83/egakumi"
          sources = {
              "scanner": "scripts/check_public_data.py",
              "policy": "scripts/public-data-policy.json",
              "tests": "tests/test_public_data_guard.py",
          }

          def stop():
              print("Public-data guard: trusted validation did not pass.", file=sys.stderr)
              raise SystemExit(1)

          def git(directory, *arguments):
              try:
                  return subprocess.run(
                      ["git", "-c", "core.hooksPath=/dev/null", *arguments],
                      cwd=directory, capture_output=True, timeout=120, check=False,
                  )
              except (OSError, subprocess.TimeoutExpired):
                  stop()

          def valid_revision(revision):
              return isinstance(revision, str) and re.fullmatch(r"[0-9a-f]{40}", revision) and set(revision) != {"0"}

          def trusted_files(revision):
              if not valid_revision(revision):
                  return None
              if git(repository, "cat-file", "-e", revision + "^{commit}").returncode:
                  return None
              files = {}
              for label, path in sources.items():
                  result = git(repository, "show", revision + ":" + path)
                  if result.returncode or not result.stdout:
                      return None
                  files[label] = result.stdout
              return files

          def checked_git(directory, *arguments):
              result = git(directory, *arguments)
              if result.returncode:
                  stop()
              return result.stdout

          def run(command, directory, environment, input_bytes=None):
              try:
                  result = subprocess.run(
                      command, cwd=directory, env=environment, input=input_bytes,
                      capture_output=True, timeout=300, check=False,
                  )
              except (OSError, subprocess.TimeoutExpired):
                  stop()
              if result.returncode:
                  stop()

          try:
              event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
              event_name = os.environ.get("GITHUB_EVENT_NAME", "")
              if (os.environ.get("GITHUB_REPOSITORY") != expected_repository
                      or event["repository"]["full_name"] != expected_repository):
                  stop()
              request = None
              if event_name == "pull_request_target":
                  request = event["pull_request"]
                  if (request["base"]["repo"]["full_name"] != expected_repository
                          or type(event["number"]) is not int or event["number"] <= 0
                          or not valid_revision(request["head"]["sha"])
                          or not valid_revision(request["base"]["sha"])):
                      stop()
                  revision = request["base"]["sha"]
              elif event_name in ("push", "workflow_dispatch"):
                  # A feature branch's previous commit is not a trusted policy source.
                  branch = event["repository"]["default_branch"]
                  if not isinstance(branch, str) or not branch:
                      stop()
                  checked_git(repository, "check-ref-format", "--branch", branch)
                  revision = checked_git(
                      repository, "rev-parse", "--verify",
                      "refs/remotes/origin/" + branch + "^{commit}",
                  ).decode("ascii").strip()
              else:
                  stop()

              files = trusted_files(revision)
              if files is None:
                  files = trusted_files(os.environ.get("GUARD_BOOTSTRAP_REVISION", ""))
              if files is None:
                  stop()

              # Only reviewed source from the trusted revision is ever executed.
              with tempfile.TemporaryDirectory(
                  prefix="public-data-guard-", dir=os.environ["RUNNER_TEMP"],
              ) as directory:
                  trusted = Path(directory)
                  scanner = trusted / "check_public_data.py"
                  policy = trusted / "public-data-policy.json"
                  tests = trusted / "tests"
                  tests.mkdir()
                  scanner.write_bytes(files["scanner"])
                  policy.write_bytes(files["policy"])
                  (tests / "test_public_data_guard.py").write_bytes(files["tests"])
                  environment = os.environ.copy()
                  environment["PYTHONDONTWRITEBYTECODE"] = "1"
                  environment["PUBLIC_DATA_GUARD_SCRIPT"] = str(scanner)
                  environment["PUBLIC_DATA_GUARD_POLICY"] = str(policy)
                  candidate = repository
                  ref_input = None
                  if request is not None:
                      # No candidate checkout: Git attributes, hooks, scripts and tests stay inert.
                      candidate = trusted / "candidate-objects"
                      candidate.mkdir()
                      checked_git(candidate, "init", "--initial-branch=guard-bootstrap")
                      checked_git(candidate, "config", "user.name", "Example contributor")
                      checked_git(candidate, "config", "user.email", "developer@example.com")
                      checked_git(
                          candidate, "-c", "credential.helper=", "-c", "protocol.file.allow=never",
                          "fetch", "--no-tags", "--no-recurse-submodules",
                          "https://github.com/" + expected_repository + ".git",
                          "refs/pull/" + str(event["number"]) + "/head:refs/heads/inspected",
                      )
                      actual = checked_git(
                          candidate, "rev-parse", "--verify", "refs/heads/inspected^{commit}",
                      ).decode("ascii").strip()
                      if actual != request["head"]["sha"]:
                          stop()
                      checked_git(candidate, "symbolic-ref", "HEAD", "refs/heads/inspected")
                      for side in ("head", "base"):
                          name = request[side]["ref"]
                          if not isinstance(name, str) or not name:
                              stop()
                          checked_git(candidate, "check-ref-format", "--branch", name)
                      ref_input = (
                          "refs/heads/" + request["head"]["ref"] + " " + actual
                          + " refs/heads/" + request["base"]["ref"] + " "
                          + request["base"]["sha"] + "\n"
                      ).encode("utf-8")

                  command = [sys.executable, "-I", "-S", str(scanner), "--repository", str(candidate), "--policy", str(policy)]
                  run(command + ["--all-history"], trusted, environment)
                  if ref_input is not None:
                      run(command + ["--pre-push-refs"], trusted, environment, ref_input)
                  run(
                      [sys.executable, "-I", "-S", "-m", "unittest", "discover", "-s", str(tests),
                       "-p", "test_public_data_guard.py", "-v"],
                      trusted, environment,
                  )
          except (OSError, UnicodeError, ValueError, KeyError, TypeError):
              stop()
          print("Public-data guard: trusted history scan and tests passed.")
          PY

  report:
    name: Report trusted inspection result
    needs: [pending, scan]
    if: ${{ always() && github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Report the exact pull request head result
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GUARD_PENDING_RESULT: ${{ needs.pending.result }}
          GUARD_SCAN_RESULT: ${{ needs.scan.result }}
        shell: bash
        run: |
          python3 -I -S - <<'PY'
          from pathlib import Path
          import json
          import os
          import re
          import sys
          from urllib.request import Request, urlopen

          try:
              repository = "hrkd83/egakumi"
              event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
              request = event["pull_request"]
              sha = request["head"]["sha"]
              if (os.environ.get("GITHUB_REPOSITORY") != repository
                      or request["base"]["repo"]["full_name"] != repository
                      or not re.fullmatch(r"[0-9a-f]{40}", sha)
                      or type(event["number"]) is not int or event["number"] <= 0):
                  raise ValueError
              passed = (os.environ.get("GUARD_PENDING_RESULT") == "success"
                        and os.environ.get("GUARD_SCAN_RESULT") == "success")
              payload = json.dumps({
                  "state": "success" if passed else "failure",
                  "context": "Public data guard",
                  "description": "Trusted static inspection passed." if passed else "Trusted static inspection did not pass.",
              }).encode()
              api_request = Request(
                  "https://api.github.com/repos/" + repository + "/statuses/" + sha,
                  data=payload, method="POST", headers={
                      "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urlopen(api_request, timeout=30) as response:
                  if response.status != 201:
                      raise ValueError
          except Exception:
              print("Public-data guard: status reporting failed.", file=sys.stderr)
              raise SystemExit(1)
          print("Public-data guard: trusted inspection result reported.")
          PY
